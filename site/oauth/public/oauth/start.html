<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Signing in · Caw&amp;Co</title>
<style>
  :root { --paper:#f4f0e6; --raised:#fbf8f1; --ink:#171715; --soft:#5b574d; --line:#ddd6c6; --brand:#e65d46; }
  @media (prefers-color-scheme: dark) { :root { --paper:#171715; --raised:#201f1c; --ink:#f4f0e6; --soft:#a8a295; --line:#34322d; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; background:var(--paper); color:var(--ink);
    font:17px/1.45 ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    padding:max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }
  main { max-width:26rem; margin:0 auto; }
  .mark { font-weight:800; font-size:1.15rem; letter-spacing:-.01em; margin:4px 0 28px; }
  .mark b { color:var(--brand); font-weight:800; }
  .card { background:var(--raised); border:1px solid var(--line); border-radius:16px; padding:24px; }
  h1 { font-size:1.45rem; line-height:1.2; margin:0 0 10px; letter-spacing:-.015em; }
  p { margin:0; color:var(--soft); }
</style>
<body>
<main>
  <div class="mark">Caw<b>&amp;</b>Co</div>
  <section class="card" aria-live="polite">
    <h1 id="title">Taking you to sign in</h1>
    <p id="msg">One moment…</p>
  </section>
</main>
<script>
  // The install's address arrives in the URL fragment, so it is never sent to
  // a server. It is kept in this browser only, keyed by the sign-in's state,
  // until the provider sends the person back to the callback page.
  try {
    const b64 = location.hash.slice(1).replaceAll("-", "+").replaceAll("_", "/");
    const { origin, auth } = JSON.parse(atob(b64));
    const home = new URL(origin);
    const to = new URL(auth);
    const state = to.searchParams.get("state");
    if (!["http:", "https:"].includes(home.protocol) || home.username || home.password
        || home.origin !== origin || to.protocol !== "https:" || !state) {
      throw new Error("bad");
    }
    document.getElementById("msg").textContent = "Opening " + to.host + "…";
    localStorage.setItem("cawco-oauth:" + state, JSON.stringify({ origin, at: Date.now() }));
    history.replaceState(null, "", location.pathname);
    location.replace(to.href);
  } catch {
    document.getElementById("title").textContent = "This sign-in link isn't valid";
    document.getElementById("msg").textContent = "Start sign-in again from CawCo.";
  }
</script>
