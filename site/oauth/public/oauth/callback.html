<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>CawCo sign-in</title>
<body style="font:16px system-ui;margin:2rem;max-width:32rem">
<p id="out">Reading the sign-in result…</p>
<button id="go" hidden style="font:inherit;padding:.6rem 1rem;min-height:44px">Continue</button>
<script>
  // The provider sends the person here with a one-time code. The code is
  // useless without the verifier that stays on the install, and goes on only
  // to the install that started this sign-in, after a tap.
  const out = document.getElementById("out");
  const go = document.getElementById("go");
  const q = new URLSearchParams(location.search);
  const code = q.get("code");
  const state = q.get("state");
  history.replaceState(null, "", location.pathname);
  const key = state ? "cawco-oauth:" + state : "";
  const saved = key ? localStorage.getItem(key) : null;
  let origin = "";
  try {
    const entry = saved ? JSON.parse(saved) : null;
    if (entry && Date.now() - entry.at < 10 * 60 * 1000) origin = new URL(entry.origin).origin;
  } catch {}
  if (q.get("error")) {
    out.textContent = "The provider did not complete the sign-in (" + q.get("error") + "). Start again from CawCo.";
  } else if (!code || !origin) {
    out.textContent = "This sign-in has expired or was started on another device. Start sign-in again from CawCo.";
  } else {
    out.textContent = "Send this sign-in to the CawCo hub at " + origin + "?";
    go.hidden = false;
    go.onclick = () => {
      localStorage.removeItem(key);
      const back = new URL("/api/fleet/mcp/oauth/callback", origin);
      back.searchParams.set("code", code);
      back.searchParams.set("state", state);
      location.assign(back.href);
    };
  }
</script>
