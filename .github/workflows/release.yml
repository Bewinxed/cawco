# Publishing happens on a TAG, never on a push to a branch.
#
# This is the gate the old mechanism did not have. Machines used to track
# `main` through a deployment clone and pull whatever landed there, so any
# commit — including one pushed to save work in progress — reached every
# machine running that clone. That is survivable when the only fleet is the
# author's. It is not something to hand to users.
#
# So `main` is now just a branch. A release is an act: tag `v0.2.0`, and the
# artifact that reaches the registry is built from exactly that commit and
# carries provenance attesting to it.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # npm provenance: the published package can prove which commit and which
  # workflow built it, which is worth having the moment somebody other than
  # the author installs it.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The tag is the version. A mismatch means the tag was cut against a
      # commit that says something else, and publishing it would put a version
      # on the registry that no commit in this repo claims.
      - name: The tag and the manifest must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match packages/cli version ${pkg}" >&2
            exit 1
          fi

      - name: Build the release
        run: bun scripts/build-release.mjs

      # Proves the thing that is about to be published actually runs, from a
      # clean install, before anybody else installs it.
      - name: Smoke the artifact
        run: |
          cd release
          npm pack
          mkdir -p /tmp/smoke && cd /tmp/smoke
          bun add "$(ls "$GITHUB_WORKSPACE"/release/*.tgz)"
          ./node_modules/.bin/cawco --version
          ./node_modules/.bin/cawco --help > /dev/null

      - name: Publish
        run: npm publish --provenance --access public
        working-directory: release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
