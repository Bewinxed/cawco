# XcodeGen 2.46. Generate with `xcodegen generate` in apps/apple; the
# .xcodeproj and CawCo/Info.plist are written from this file, never edited
# and never committed.
name: CawCo
options:
  bundleIdPrefix: dev.cawco
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  CawCoKit:
    path: Packages/CawCoKit
# CawCo Pro's two products for StoreKit Testing in Xcode: in the project,
# never in the app's bundle; the scheme's Run uses it (target `scheme` below).
fileGroups:
  - StoreKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MARKETING_VERSION: "0.1.11"
    CURRENT_PROJECT_VERSION: "1"
targets:
  # One UIKit app: iPhone, iPad and, through Mac Catalyst, the Mac. It holds
  # only the app and scene delegates; shared code lives in CawCoKit.
  CawCo:
    type: application
    supportedDestinations: [iOS, macCatalyst]
    # CawCo/ includes PrivacyInfo.xcprivacy, the privacy manifest, which
    # XcodeGen copies into the app's resources (App Review audit R3).
    sources:
      - path: CawCo
    # Xcode's Run reads Pro and the free week from this file instead of the
    # App Store ("only has an effect when you run your app using Xcode",
    # developer.apple.com/forums/thread/756071).
    scheme:
      storeKitConfiguration: StoreKit/CawCo.storekit
    dependencies:
      - package: CawCoKit
        products: [CawCoAPI, CawCoCore, CawCoDesign, CawCoTranscript, CawCoMascot, CawCoScreens]
    settings:
      base:
        DEVELOPMENT_TEAM: FN5LJSPX2R
        PRODUCT_BUNDLE_IDENTIFIER: dev.cawco.app
        PRODUCT_NAME: CawCo
        # iPhone, iPad, and the Mac idiom: Catalyst "Optimize for Mac".
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        "IPHONEOS_DEPLOYMENT_TARGET[sdk=macosx*]": "18.0"
        # CawCo/AppIcon.icon (Icon Composer): Ivory by default, Ink with the
        # cream-rim Caw in dark and tinted.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Embedded frameworks (RiveRuntime) sit in Contents/Frameworks on the Mac;
        # the iOS-style default runpath (@executable_path/Frameworks) misses them.
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": ["$(inherited)", "@executable_path/../Frameworks"]
        # The Mac app is sandboxed and may open connections to the hub.
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        # An ad-hoc signature carries no Team ID, so the hardened runtime's library
        # validation refuses the embedded RiveRuntime ("mapping process and mapped
        # file have different Team IDs") and the Mac app cannot launch at all.
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: NO
        # Push Notifications (PRD §5.5): the key differs per platform. iPhone and
        # iPad claim `aps-environment` (`entitlements` below); the Mac claims
        # `com.apple.developer.aps-environment` ("The entitlement key is different
        # for iOS than it is for macOS", Apple's Entitlement Key Reference), and an
        # iOS profile does not authorise the Mac key, so each has its own file.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": CawCo/CawCo-macCatalyst.entitlements
        # Xcode builds talk to APNs' sandbox; TestFlight and the App Store to production.
        APS_ENVIRONMENT: development
      configs:
        # Profiles carrying Push Notifications (made 2026-10-07 when the App ID
        # got the capability; that invalidated "CawCo App Store 20261005").
        # Automatic signing over the App Store Connect key made no push profile.
        # The Mac's profiles (Mac Catalyst development and App Store, made
        # 2026-10-09 through the App Store Connect API); development lists this
        # Mac's Provisioning UDID.
        Debug:
          "CODE_SIGN_STYLE[sdk=iphoneos*]": Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": CawCo Development 20261007
          "CODE_SIGN_STYLE[sdk=macosx*]": Manual
          "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
          "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": CawCo Mac Catalyst Development 20261009
        Release:
          APS_ENVIRONMENT: production
          "CODE_SIGN_STYLE[sdk=iphoneos*]": Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": CawCo App Store 20261007
          "CODE_SIGN_STYLE[sdk=macosx*]": Manual
          "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": CawCo Mac Catalyst App Store 20261009
    entitlements:
      path: CawCo/CawCo.entitlements
      properties:
        # Alerts only: no `remote-notification` background mode, no silent pushes.
        aps-environment: $(APS_ENVIRONMENT)
    info:
      path: CawCo/Info.plist
      properties:
        CFBundleDisplayName: CawCo
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSUserActivityTypes: [dev.cawco.session, dev.cawco.scene]
        UILaunchScreen: {}
        # Scene life cycle (required from the 27 SDKs): every window is a
        # scene, and SceneDelegate builds each one's interface.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The hub is a LAN address (http://192.168.3.100:3456). Local
        # networking only; ATS stays on for everything else.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # A hub reached by its Tailscale MagicDNS name (<host>.<tailnet>.ts.net)
          # over http: ATS refused it (NSURLErrorDomain -1022) under local
          # networking alone. The tailnet is the encrypted link.
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
            # Tailscale also exposes stable IPv4 addresses in 100.64.0.0/10.
            # Apple's NSExceptionDomains supports CIDR ranges from iOS 17;
            # keep this HTTP exception inside that encrypted tailnet range.
            "100.64.0.0/10":
              NSExceptionAllowsInsecureHTTPLoads: true
        # A device asks before it reaches the LAN; the simulator does not.
        NSLocalNetworkUsageDescription: CawCo finds and connects to your hub on this network.
        # The hub announces itself as `_cawco._tcp` (packages/hub/src/mdns.ts).
        NSBonjourServices:
          - _cawco._tcp
