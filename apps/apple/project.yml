# XcodeGen 2.46. Generate with `xcodegen generate` in apps/apple; the
# .xcodeproj and CawCo/Info.plist are written from this file, never edited
# and never committed.
name: CawCo
options:
  bundleIdPrefix: dev.cawco
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  CawCoKit:
    path: Packages/CawCoKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MARKETING_VERSION: "0.1.11"
    CURRENT_PROJECT_VERSION: "1"
targets:
  # One UIKit app: iPhone, iPad and, through Mac Catalyst, the Mac. It holds
  # only the app and scene delegates; shared code lives in CawCoKit.
  CawCo:
    type: application
    supportedDestinations: [iOS, macCatalyst]
    sources:
      - path: CawCo
    dependencies:
      - package: CawCoKit
        products: [CawCoAPI, CawCoCore, CawCoDesign, CawCoTranscript, CawCoMascot, CawCoScreens]
    settings:
      base:
        DEVELOPMENT_TEAM: FN5LJSPX2R
        PRODUCT_BUNDLE_IDENTIFIER: dev.cawco.app
        PRODUCT_NAME: CawCo
        # iPhone, iPad, and the Mac idiom: Catalyst "Optimize for Mac".
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        "IPHONEOS_DEPLOYMENT_TARGET[sdk=macosx*]": "18.0"
        # CawCo/AppIcon.icon (Icon Composer): Ivory by default, Ink with the
        # cream-rim Caw in dark and tinted.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Embedded frameworks (RiveRuntime) sit in Contents/Frameworks on the Mac;
        # the iOS-style default runpath (@executable_path/Frameworks) misses them.
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": ["$(inherited)", "@executable_path/../Frameworks"]
        # Sign to Run Locally until a development team is chosen.
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        # The Mac app is sandboxed and may open connections to the hub.
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          "CODE_SIGN_STYLE[sdk=iphoneos*]": Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": CawCo App Store 20261005
    info:
      path: CawCo/Info.plist
      properties:
        CFBundleDisplayName: CawCo
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSUserActivityTypes: [dev.cawco.session, dev.cawco.scene]
        UILaunchScreen: {}
        # Scene life cycle (required from the 27 SDKs): every window is a
        # scene, and SceneDelegate builds each one's interface.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The hub is a LAN address (http://192.168.3.100:3456). Local
        # networking only; ATS stays on for everything else.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # A hub reached by its Tailscale MagicDNS name (<host>.<tailnet>.ts.net)
          # over http: ATS refused it (NSURLErrorDomain -1022) under local
          # networking alone. The tailnet is the encrypted link.
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
            # Tailscale also exposes stable IPv4 addresses in 100.64.0.0/10.
            # Apple's NSExceptionDomains supports CIDR ranges from iOS 17;
            # keep this HTTP exception inside that encrypted tailnet range.
            "100.64.0.0/10":
              NSExceptionAllowsInsecureHTTPLoads: true
        # A device asks before it reaches the LAN; the simulator does not.
        NSLocalNetworkUsageDescription: CawCo finds and connects to your hub on this network.
        # The hub announces itself as `_cawco._tcp` (packages/hub/src/mdns.ts).
        NSBonjourServices:
          - _cawco._tcp
