<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link href="data:," rel="icon">
    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
      name="viewport"
    >
    <title>Whiffle — mission control for Claude Code</title>
    %sveltekit.head%
    <!--
      The faces the first paint sets its text in, decoded before it. The build
      inlines Figtree's and JetBrains Mono's latin faces into the stylesheet
      above (vite.config.ts), but a browser decodes a face only once text asks for
      it, and off to one side: the first frame could still be laid out in the
      fallback and re-set a moment later. This script runs once the stylesheet
      is in and before the body is parsed, so both are ready by the first
      layout.
    -->
    <!--
      The scheme, before anything paints. A stored choice wins; with none the
      page follows the OS (neither scheme is the default). theme.svelte.ts
      owns the class from hydration onward.
    -->
    <script>
      "use strict";
      try {
        const stored = localStorage.getItem("whiffle-theme");
        const dark =
          stored === "dark" ||
          (stored !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {
        /* No storage: the OS decides through theme.svelte.ts on hydration. */
      }
    </script>
    <script>
      "use strict";
      document.fonts.load('1em "Figtree Variable"');
      document.fonts.load('1em "JetBrains Mono Variable"');
    </script>
    <!--
      Taps before hydration. The shell is server-rendered, so its buttons (the
      phone's burger first of all) are on screen before their handlers are,
      and a tap in that gap used to fall through with nothing to catch it. A
      button click that lands before the app has mounted is held here and
      replayed by the root layout's onMount, once every handler is attached.
      Links are left alone: before hydration they navigate as plain links.
    -->
    <script>
      "use strict";
      (() => {
        const held = [];
        const hold = (event) => {
          const button =
            event.target instanceof Element
              ? event.target.closest("button")
              : null;
          if (button === null) {
            return;
          }
          event.preventDefault();
          event.stopImmediatePropagation();
          held.push(button);
        };
        document.addEventListener("click", hold, true);
        window.releaseHeldTaps = () => {
          document.removeEventListener("click", hold, true);
          for (const button of held) {
            button.click();
          }
        };
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <!--
      The sidebar's width, before anything can paint it wrong.

      The rail is this browser's preference, not the fleet's, and it lives in
      localStorage — which the server cannot read. It is mirrored into a cookie
      so SSR usually gets it right, but a browser that has a width and no cookie
      (the migration case, and every fresh profile that has resized once) painted
      the default and snapped on hydration. Six lines here, before the body, and
      the first paint is already the stored width: `--rail-w` is what the rail's
      `--sidebar-width` resolves to, with the server's cookie value as the
      fallback. Shell.svelte owns the property from hydration onward.
    -->
    <script>
      "use strict";
      try {
        const w = Number.parseInt(
          localStorage.getItem("whiffle-rail-width"),
          10
        );
        if (w >= 216 && w <= 520) {
          document.documentElement.style.setProperty("--rail-w", `${w}px`);
        }
      } catch {
        /* No storage, or a value that is not a width: the cookie default stands. */
      }
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
