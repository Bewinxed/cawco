<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>Merge checks, live</title>
  </head>
  <body>
    <svg
      aria-labelledby="checks-title"
      font-family="system-ui, sans-serif"
      font-size="14"
      role="img"
      viewBox="0 0 600 340"
      xmlns="http://www.w3.org/2000/svg"
    >
      <title id="checks-title">
        Merge checks on the rebased branch: four checks filling as they run
      </title>
      <text font-size="17" font-weight="600" x="24" y="40">
        Merge checks on the rebased branch
      </text>
      <text fill-opacity="0.7" x="24" y="66">
        Four checks, run side by side after the rebase onto main.
      </text>
      <text x="24" y="115">Types</text>
      <rect
        fill="#8a8a8a"
        fill-opacity="0.18"
        height="10"
        rx="5"
        width="330"
        x="170"
        y="105"
      />
      <rect fill="#2f7d5b" height="10" rx="5" width="0" x="170" y="105">
        <animate
          attributeName="width"
          dur="3.2s"
          keyTimes="0;0.7;1"
          repeatCount="indefinite"
          values="0;330;330"
        />
      </rect>
      <text fill-opacity="0.7" text-anchor="end" x="576" y="115">41 s</text>
      <text x="24" y="167">Lint and Biome</text>
      <rect
        fill="#8a8a8a"
        fill-opacity="0.18"
        height="10"
        rx="5"
        width="330"
        x="170"
        y="157"
      />
      <rect fill="#2f7d5b" height="10" rx="5" width="0" x="170" y="157">
        <animate
          attributeName="width"
          dur="2.4s"
          keyTimes="0;0.7;1"
          repeatCount="indefinite"
          values="0;330;330"
        />
      </rect>
      <text fill-opacity="0.7" text-anchor="end" x="576" y="167">18 s</text>
      <text x="24" y="219">House checks</text>
      <rect
        fill="#8a8a8a"
        fill-opacity="0.18"
        height="10"
        rx="5"
        width="330"
        x="170"
        y="209"
      />
      <rect fill="#2f7d5b" height="10" rx="5" width="0" x="170" y="209">
        <animate
          attributeName="width"
          dur="4.0s"
          keyTimes="0;0.7;1"
          repeatCount="indefinite"
          values="0;330;330"
        />
      </rect>
      <text fill-opacity="0.7" text-anchor="end" x="576" y="219">1 m 02 s</text>
      <text x="24" y="271">Formatting</text>
      <rect
        fill="#8a8a8a"
        fill-opacity="0.18"
        height="10"
        rx="5"
        width="330"
        x="170"
        y="261"
      />
      <rect fill="#2f7d5b" height="10" rx="5" width="0" x="170" y="261">
        <animate
          attributeName="width"
          dur="1.6s"
          keyTimes="0;0.7;1"
          repeatCount="indefinite"
          values="0;330;330"
        />
      </rect>
      <text fill-opacity="0.7" text-anchor="end" x="576" y="271">6 s</text>
    </svg>
  </body>
</html>
