<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=1440" name="viewport">
    <title>v2 token bridge — smoke render</title>
    <link href="./entry.css" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>

    <script type="module">
      /* Every class string below is copied verbatim out of
   apps/dashboard/src/lib/components/ui/<component>.svelte so the smoke page
   exercises the real library contract, not an approximation of it. */

      const BTN_BASE =
        "rounded-4xl border border-transparent bg-clip-padding text-sm font-medium focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 active:not-aria-[haspopup]:translate-y-px aria-invalid:border-destructive aria-invalid:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&_svg:not([class*='size-'])]:size-4 group/button inline-flex shrink-0 items-center justify-center whitespace-nowrap transition-all outline-none select-none disabled:pointer-events-none disabled:opacity-50";
      const BTN_VARIANT = {
        default: "bg-primary text-primary-foreground hover:bg-primary/80",
        outline:
          "border-input bg-input/30 hover:bg-input/50 hover:text-foreground aria-expanded:bg-muted aria-expanded:text-foreground",
        secondary:
          "bg-secondary text-secondary-foreground hover:bg-secondary/80 aria-expanded:bg-secondary aria-expanded:text-secondary-foreground",
        ghost:
          "hover:bg-muted hover:text-foreground aria-expanded:bg-muted aria-expanded:text-foreground dark:hover:bg-muted/50",
        destructive:
          "bg-destructive/10 text-destructive hover:bg-destructive/20 focus-visible:border-destructive/40 focus-visible:ring-destructive/20 dark:bg-destructive/20 dark:hover:bg-destructive/30 dark:focus-visible:ring-destructive/40",
        link: "text-primary underline-offset-4 hover:underline",
      };
      const BTN_SIZE = {
        default: "h-9 gap-1.5 px-3",
        xs: "h-6 gap-1 px-2.5 text-xs",
        sm: "h-8 gap-1 px-3",
        lg: "h-10 gap-1.5 px-4",
        icon: "size-9",
      };

      const BADGE_BASE =
        "h-5 gap-1 rounded-4xl border border-transparent px-2 py-0.5 text-xs font-medium transition-all [&>svg]:size-3! group/badge inline-flex w-fit shrink-0 items-center justify-center overflow-hidden whitespace-nowrap transition-colors focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50";
      const BADGE_VARIANT = {
        default: "bg-primary text-primary-foreground [a]:hover:bg-primary/80",
        secondary:
          "bg-secondary text-secondary-foreground [a]:hover:bg-secondary/80",
        destructive:
          "bg-destructive/10 text-destructive focus-visible:ring-destructive/20 dark:bg-destructive/20 [a]:hover:bg-destructive/20",
        outline:
          "border-border bg-input/30 text-foreground [a]:hover:bg-muted [a]:hover:text-muted-foreground",
        ghost:
          "hover:bg-muted hover:text-muted-foreground dark:hover:bg-muted/50",
      };

      const INPUT_CLS =
        "h-9 rounded-4xl border border-input bg-input/30 px-3 py-1 text-base transition-colors focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 md:text-sm w-full min-w-0 outline-none placeholder:text-muted-foreground disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50";
      const TEXTAREA_CLS =
        "resize-none rounded-xl border border-input bg-input/30 px-3 py-3 text-base transition-colors focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 md:text-sm flex field-sizing-content min-h-16 w-full outline-none placeholder:text-muted-foreground";
      const SELECT_TRIGGER =
        "gap-1.5 rounded-4xl border border-input bg-input/30 px-3 py-2 text-sm transition-colors focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 data-placeholder:text-muted-foreground data-[size=default]:h-9 flex w-fit items-center justify-between whitespace-nowrap outline-none";
      const SELECT_CONTENT =
        "min-w-48 rounded-2xl text-popover-foreground shadow-2xl ring-1 ring-foreground/5 isolate z-50 overflow-x-hidden overflow-y-auto bg-popover";
      const MENU_ITEM =
        "gap-2.5 rounded-xl px-3 py-2 text-sm focus:bg-accent focus:text-accent-foreground relative flex cursor-default items-center outline-hidden select-none";
      const MENU_ITEM_HL =
        "gap-2.5 rounded-xl px-3 py-2 text-sm bg-accent text-accent-foreground relative flex cursor-default items-center outline-hidden select-none";
      const MENU_ITEM_DESTRUCTIVE =
        "gap-2.5 rounded-xl px-3 py-2 text-sm text-destructive bg-destructive/10 relative flex cursor-default items-center outline-hidden select-none";

      const ALERT_BASE =
        "grid gap-0.5 rounded-lg border px-4 py-3 text-left text-sm has-[>svg]:grid-cols-[auto_1fr] has-[>svg]:gap-x-2.5 group/alert relative w-full";
      const DIALOG_CONTENT =
        "grid max-w-[calc(100%-2rem)] gap-6 rounded-4xl bg-popover p-6 text-sm text-popover-foreground ring-1 ring-foreground/5 w-full outline-none";
      const TOOLTIP_CONTENT =
        "inline-flex items-center gap-1.5 rounded-2xl px-3 py-1.5 text-xs z-50 w-fit max-w-xs bg-foreground text-background";
      const KBD_CLS =
        "h-5 w-fit min-w-5 gap-1 rounded-sm bg-muted px-1 font-sans text-xs font-medium text-muted-foreground in-data-[slot=tooltip-content]:bg-background/20 in-data-[slot=tooltip-content]:text-background pointer-events-none inline-flex items-center justify-center select-none";

      const TABS_LIST =
        "rounded-4xl p-[3px] h-9 bg-muted inline-flex w-fit items-center justify-center text-muted-foreground";
      const TABS_TRIGGER =
        "gap-1.5 rounded-xl border border-transparent px-2 py-1 text-sm font-medium relative inline-flex h-[calc(100%-1px)] flex-1 items-center justify-center whitespace-nowrap text-foreground/60 transition-all hover:text-foreground dark:text-muted-foreground";
      const TABS_TRIGGER_ACTIVE =
        "gap-1.5 rounded-xl border border-transparent px-2 py-1 text-sm font-medium relative inline-flex h-[calc(100%-1px)] flex-1 items-center justify-center whitespace-nowrap transition-all bg-background text-foreground dark:border-input dark:bg-input/30 dark:text-foreground";

      const SW_ROOT =
        "shrink-0 rounded-full border border-transparent h-[18.4px] w-[32px] peer group/switch relative inline-flex items-center transition-all outline-none";
      const SW_THUMB =
        "rounded-full bg-background size-4 pointer-events-none block ring-0 transition-transform dark:data-checked:bg-primary-foreground dark:data-unchecked:bg-foreground";
      const CB_ROOT =
        "flex size-4 items-center justify-center rounded-[6px] border border-input transition-shadow focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 dark:bg-input/30 peer relative shrink-0 outline-none";
      const CB_CHECKED =
        "flex size-4 items-center justify-center rounded-[6px] border border-primary bg-primary text-primary-foreground transition-shadow dark:data-checked:bg-primary peer relative shrink-0 outline-none";

      const SB_MENU_BTN =
        "gap-2 rounded-lg px-3 py-2 text-left text-sm ring-sidebar-ring transition-[width,height,padding] hover:bg-sidebar-accent hover:text-sidebar-accent-foreground focus-visible:ring-2 peer/menu-button group/menu-button flex w-full items-center overflow-hidden outline-hidden";
      const SB_MENU_BTN_ACTIVE =
        "gap-2 rounded-lg px-3 py-2 text-left text-sm ring-sidebar-ring bg-sidebar-accent font-medium text-sidebar-accent-foreground flex w-full items-center overflow-hidden outline-hidden";
      const SB_CONTENT =
        "no-scrollbar gap-2 [--radius:var(--radius-xl)] flex min-h-0 flex-1 flex-col overflow-auto";
      const CAL =
        "p-3 [--cell-radius:var(--radius-4xl)] [--cell-size:--spacing(8)] group/calendar bg-background";
      const SONNER_STYLE =
        "--normal-bg: var(--color-popover); --normal-text: var(--color-popover-foreground); --normal-border: var(--color-border);";
      const SB_GROUP_LABEL =
        "h-8 rounded-md px-3 text-xs font-medium text-sidebar-foreground/70 ring-sidebar-ring flex shrink-0 items-center outline-hidden";

      const ICON = (d) =>
        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="${d}"/></svg>`;
      const CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="size-3.5"><path d="M20 6 9 17l-5-5"/></svg>`;
      const CHEV = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4 text-muted-foreground"><path d="m6 9 6 6 6-6"/></svg>`;

      const sect = (t, body) => `
  <section class="mt-7">
    <h2 class="text-xs font-semibold tracking-wide uppercase text-faint mb-2.5">${t}</h2>
    <div class="panel p-4">${body}</div>
  </section>`;

      const buttons = [
        "default",
        "outline",
        "secondary",
        "ghost",
        "destructive",
        "link",
      ]
        .map(
          (v) =>
            `<button data-slot="button" class="${BTN_BASE} ${BTN_VARIANT[v]} ${BTN_SIZE.default}">${v}</button>`
        )
        .join("");
      const buttonSizes =
        ["xs", "sm", "default", "lg"]
          .map(
            (s) =>
              `<button data-slot="button" class="${BTN_BASE} ${BTN_VARIANT.default} ${BTN_SIZE[s]}">size ${s}</button>`
          )
          .join("") +
        `<button data-slot="button" class="${BTN_BASE} ${BTN_VARIANT.outline} ${BTN_SIZE.icon}">${ICON("M12 5v14M5 12h14")}</button>` +
        `<button data-slot="button" disabled class="${BTN_BASE} ${BTN_VARIANT.default} ${BTN_SIZE.default}">disabled</button>`;

      const badges = ["default", "secondary", "destructive", "outline", "ghost"]
        .map(
          (v) =>
            `<span data-slot="badge" class="${BADGE_BASE} ${BADGE_VARIANT[v]}">${v}</span>`
        )
        .join("");

      const pills = [
        ["bg-success-bg text-success-ink", "idle"],
        ["bg-warning-bg text-warning-ink", "working"],
        ["bg-attention-bg text-attention-ink", "needs you"],
        ["bg-error-bg text-error-ink", "failed"],
        ["bg-info-bg text-info-ink", "12 queued"],
        ["bg-mint-bg text-mint-ink", "fresh"],
      ]
        .map(([c, t]) => `<span class="pill ${c}">${t}</span>`)
        .join("");

      const table = `
<div data-slot="table-container" class="w-full overflow-x-auto">
<table data-slot="table" class="w-full caption-bottom text-sm">
  <thead data-slot="table-header" class="[&_tr]:border-b">
    <tr data-slot="table-row" class="border-b transition-colors hover:bg-muted/50">
      <th data-slot="table-head" class="h-12 px-3 text-left align-middle font-medium whitespace-nowrap text-foreground">Agent</th>
      <th data-slot="table-head" class="h-12 px-3 text-left align-middle font-medium whitespace-nowrap text-foreground">Status</th>
      <th data-slot="table-head" class="h-12 px-3 text-left align-middle font-medium whitespace-nowrap text-foreground">Tokens</th>
      <th data-slot="table-head" class="h-12 px-3 text-left align-middle font-medium whitespace-nowrap text-foreground">Last seen</th>
    </tr>
  </thead>
  <tbody data-slot="table-body" class="[&_tr:last-child]:border-0">
    ${[
      [
        "cawco-dashboard",
        "bg-success-bg text-success-ink",
        "idle",
        "1.2M",
        "2m ago",
        "text-success",
      ],
      [
        "fleet-runner",
        "bg-warning-bg text-warning-ink",
        "working",
        "840k",
        "just now",
        "text-warning",
      ],
      [
        "token-bridge",
        "bg-attention-bg text-attention-ink",
        "needs you",
        "2.4M",
        "11m ago",
        "text-error",
      ],
      [
        "nightly-sweep",
        "bg-error-bg text-error-ink",
        "failed",
        "96k",
        "1h ago",
        "text-error",
      ],
    ]
      .map(
        ([n, pc, ps, tok, when, inkc]) => `
      <tr data-slot="table-row" class="border-b transition-colors hover:bg-muted/50">
        <td data-slot="table-cell" class="h-11 px-3 align-middle"><span class="flex items-center gap-2.5"><span class="size-[17px] rounded-[5px] identity-tint identity-ink grid place-items-center text-[9px] font-bold" style="--identity-h:262">${n[0].toUpperCase()}</span><b class="font-medium text-row-name">${n}</b></span></td>
        <td data-slot="table-cell" class="h-11 px-3 align-middle"><span class="pill ${pc}">${ps}</span></td>
        <td data-slot="table-cell" class="h-11 px-3 align-middle tabular-nums ${inkc}">${tok}</td>
        <td data-slot="table-cell" class="h-11 px-3 align-middle text-muted-foreground">${when}</td>
      </tr>`
      )
      .join("")}
  </tbody>
</table>
</div>`;

      const stats = `
<div class="grid grid-cols-4 gap-3.5">
      ${[
        ["Active runs", "12"],
        ["Queued", "3"],
        ["Tokens today", "4.8M"],
        ["Failures", "1"],
      ]
        .map(
          ([l, v]) => `
  <div class="bg-card rounded-[10px] p-[7px] h-[90px] shadow-sm">
    <div class="well h-full px-4 py-3 flex flex-col justify-between">
      <div class="flex items-center gap-2.5 text-[13.5px] text-ink-2">
        <span class="size-6 rounded-[5.5px] bg-background grid place-items-center shadow-md">${ICON("M12 2v20M2 12h20")}</span>${l}
      </div>
      <div class="ml-[33px] text-[26px] font-medium tracking-[-0.006em] text-stat-num tabular-nums">${v}</div>
    </div>
  </div>`
        )
        .join("")}
</div>`;

      const board = (mode) => `
<div class="${mode} ${mode === "dark" ? "dark" : ""} bg-canvas text-foreground min-h-screen">
  <div class="flex min-h-screen">
    <!-- sidebar -->
    <aside class="w-[228px] shrink-0 bg-sidebar border-r border-sidebar-border text-sidebar-foreground flex flex-col">
      <div class="h-[57px] flex items-center gap-2.5 px-3.5">
        <span class="size-[26px] rounded-[7px] action-surface grid place-items-center text-[13px] font-bold">C</span>
        <b class="text-[15px] font-semibold text-foreground">CawCo</b>
      </div>
      <div data-slot="sidebar-content" class="px-2.5 ${SB_CONTENT}">
        <div data-slot="sidebar-group-label" class="${SB_GROUP_LABEL}">Workspace</div>
        <button data-slot="sidebar-menu-button" data-active="true" class="${SB_MENU_BTN_ACTIVE}">${ICON("M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z")}<span>Fleet</span></button>
        <button data-slot="sidebar-menu-button" class="${SB_MENU_BTN}">${ICON("M12 2 2 7l10 5 10-5z")}<span>Runs</span><span class="pill ml-auto bg-info-bg text-info-ink">8</span></button>
        <button data-slot="sidebar-menu-button" class="${SB_MENU_BTN}">${ICON("M4 6h16M4 12h16M4 18h16")}<span>Sessions</span><span class="pill ml-auto bg-mint-bg text-mint-ink">3</span></button>
        <div data-slot="sidebar-group-label" class="${SB_GROUP_LABEL} mt-3">Recent</div>
        <button data-slot="sidebar-menu-button" class="${SB_MENU_BTN}"><span class="size-[17px] rounded-[6px] identity-tint identity-ink grid place-items-center text-[9px] font-bold" style="--identity-h:292">T</span><span>token-bridge</span></button>
        <button data-slot="sidebar-menu-button" class="${SB_MENU_BTN}"><span class="size-[17px] rounded-[6px] identity-tint identity-ink grid place-items-center text-[9px] font-bold" style="--identity-h:176">D</span><span>dashboard</span></button>
      </div>
      <div class="mt-auto border-t border-sidebar-border h-[60px] flex items-center gap-2.5 px-3.5">
        <span data-slot="avatar" class="size-8 rounded-full bg-muted text-muted-foreground grid place-items-center text-[11.5px] font-semibold">BW</span>
        <span class="text-[13px] font-semibold text-foreground">bewinxed</span>
      </div>
    </aside>

    <!-- main -->
    <main class="flex-1 min-w-0">
      <div class="h-[57px] bg-sidebar border-b border-border flex items-center gap-2.5 px-5">
        <span class="text-sm text-muted-foreground">Fleet</span><span class="text-faint">/</span><span class="text-sm">Overview</span>
        <div class="ml-auto flex items-center gap-2.5">
          <button data-slot="button" class="${BTN_BASE} ${BTN_VARIANT.outline} ${BTN_SIZE.sm}">Export</button>
          <button data-slot="button" class="${BTN_BASE} ${BTN_VARIANT.default} ${BTN_SIZE.sm}">New run</button>
        </div>
      </div>

      <div class="px-5 pb-10">
        <div class="flex items-start pt-6 pb-4">
          <div><h1 class="text-title">Fleet overview</h1><p class="text-caption mt-0.5">Four agents, one of them wants you.</p></div>
        </div>

        ${stats}

        ${sect("Table (panel + band header + status pills)", table)}

        ${sect(
          "Buttons — variants",
          `<div class="flex flex-wrap items-center gap-3">${buttons}</div>
          <div class="flex flex-wrap items-center gap-3 mt-3">${buttonSizes}</div>`
        )}

        ${sect(
          "Badges + v2 status pills",
          `<div class="flex flex-wrap items-center gap-3">${badges}</div>
          <div class="flex flex-wrap items-center gap-3 mt-3">${pills}</div>`
        )}

        ${sect(
          "Form controls",
          `
          <div class="grid grid-cols-3 gap-4 items-start">
            <div class="flex flex-col gap-2">
              <label data-slot="label" class="gap-2 text-sm leading-none font-medium flex items-center select-none">Name</label>
              <input data-slot="input" class="${INPUT_CLS}" placeholder="Search runs…">
            </div>
            <div class="flex flex-col gap-2">
              <label data-slot="label" class="gap-2 text-sm leading-none font-medium flex items-center select-none">Filter</label>
              <button data-slot="select-trigger" data-size="default" class="${SELECT_TRIGGER} w-full">All statuses ${CHEV}</button>
            </div>
            <div class="flex flex-col gap-2">
              <label data-slot="label" class="gap-2 text-sm leading-none font-medium flex items-center select-none">Legacy .input class</label>
              <input class="input" placeholder="83 call sites use this">
            </div>
          </div>
          <textarea data-slot="textarea" class="${TEXTAREA_CLS} mt-4" placeholder="Notes…"></textarea>
          <div class="flex items-center gap-8 mt-4">
            <span class="flex items-center gap-2 text-sm">
              <span data-slot="switch" data-unchecked class="${SW_ROOT}"><span data-slot="switch-thumb" data-unchecked class="${SW_THUMB}"></span></span> off
            </span>
            <span class="flex items-center gap-2 text-sm">
              <span data-slot="switch" data-checked class="${SW_ROOT} bg-primary justify-end"><span data-slot="switch-thumb" data-checked class="${SW_THUMB}"></span></span> on
            </span>
            <span class="flex items-center gap-2 text-sm">
              <span data-slot="checkbox" class="${CB_ROOT}"></span> unchecked
            </span>
            <span class="flex items-center gap-2 text-sm">
              <span data-slot="checkbox" class="${CB_CHECKED}">${CHECK}</span> checked
            </span>
            <span class="flex items-center gap-2 text-sm">
              <span data-slot="checkbox" aria-invalid="true" class="${CB_ROOT} border-destructive ring-[3px] ring-destructive/20"></span> invalid
            </span>
          </div>`
        )}

        ${sect(
          "Tabs, progress, kbd, separator, skeleton",
          `
          <div data-slot="tabs-list" class="${TABS_LIST}">
            <button data-slot="tabs-trigger" data-active class="${TABS_TRIGGER_ACTIVE}">Active</button>
            <button data-slot="tabs-trigger" class="${TABS_TRIGGER}">Queued</button>
            <button data-slot="tabs-trigger" class="${TABS_TRIGGER}">Archive</button>
          </div>
          <div data-slot="progress" class="${"h-3 rounded-4xl bg-muted relative flex w-full items-center overflow-x-hidden mt-4"}">
            <div data-slot="progress-indicator" class="bg-primary size-full flex-1 transition-all" style="transform:translateX(-38%)"></div>
          </div>
          <div class="flex items-center gap-3 mt-4">
            <kbd data-slot="kbd" class="${KBD_CLS}">⌘</kbd><kbd data-slot="kbd" class="${KBD_CLS}">K</kbd>
            <div data-slot="separator" class="shrink-0 bg-border h-4 w-px"></div>
            <div data-slot="skeleton" class="bg-muted h-4 w-40 rounded-md animate-pulse"></div>
            <div data-slot="separator" class="shrink-0 bg-border h-4 w-px"></div>
            <span class="text-micro text-faint">faint ink on panel</span>
          </div>
          <div data-slot="separator" class="shrink-0 bg-border h-px w-full my-4"></div>`
        )}

        ${sect(
          "Overlay surfaces — dialog, menu, tooltip, alert",
          `
          <div class="grid grid-cols-3 gap-5 items-start">
            <div data-slot="dialog-content" class="${DIALOG_CONTENT} shadow-2xl">
              <div><div data-slot="dialog-title" class="text-base font-semibold">Stop this run?</div>
              <div data-slot="dialog-description" class="text-muted-foreground mt-1">The transcript is kept.</div></div>
              <div class="flex justify-end gap-2.5">
                <button data-slot="button" class="${BTN_BASE} ${BTN_VARIANT.ghost} ${BTN_SIZE.sm}">Cancel</button>
                <button data-slot="button" class="${BTN_BASE} ${BTN_VARIANT.destructive} ${BTN_SIZE.sm}">Stop run</button>
              </div>
            </div>
            <div data-slot="select-content" class="${SELECT_CONTENT} p-1">
              <div data-slot="select-item" class="${MENU_ITEM}">All statuses</div>
              <div data-slot="select-item" class="${MENU_ITEM_HL}">Needs you</div>
              <div data-slot="select-item" class="${MENU_ITEM}">Working</div>
              <div data-slot="dropdown-menu-separator" class="bg-border h-px my-1 -mx-1"></div>
              <div data-slot="select-item" data-variant="destructive" class="${MENU_ITEM_DESTRUCTIVE}">Delete filter</div>
            </div>
            <div class="flex flex-col gap-4">
              <span data-slot="tooltip-content" class="${TOOLTIP_CONTENT}">Restart the fleet <kbd data-slot="kbd" class="${KBD_CLS}">⌘R</kbd></span>
              <div data-slot="alert" class="${ALERT_BASE} bg-card text-card-foreground">
                ${ICON("M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z")}
                <div data-slot="alert-title" class="font-medium">Quota at 82%</div>
                <div data-slot="alert-description" class="text-muted-foreground">Resets in 4 hours.</div>
              </div>
              <div data-slot="alert" class="${ALERT_BASE} bg-card text-destructive">
                ${ICON("M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z")}
                <div data-slot="alert-title" class="font-medium">Run failed</div>
                <div data-slot="alert-description" class="text-destructive/90">Exit code 137.</div>
              </div>
            </div>
          </div>`
        )}

        ${sect(
          "Raw var() consumers — the sites @theme inline can silently break",
          `
          <div class="flex flex-wrap gap-5 items-start">
            <div data-slot="sonner-toast" id="sonner-${mode}" style="${SONNER_STYLE} background:var(--normal-bg); color:var(--normal-text); border:1px solid var(--normal-border);" class="rounded-2xl px-4 py-3 text-sm shadow-lg">sonner toast — reads var(--color-popover) raw</div>
            <div data-slot="calendar" id="cal-${mode}" class="${CAL} rounded-xl border">
              <div class="grid grid-cols-7 gap-1">${Array.from({ length: 14 }, (_, i) => `<span class="size-8 grid place-items-center text-xs ${i === 5 ? "bg-primary text-primary-foreground" : "hover:bg-accent hover:text-accent-foreground"}" style="border-radius:var(--cell-radius)">${i + 1}</span>`).join("")}</div>
            </div>
            <div data-slot="sidebar-probe" class="${SB_CONTENT} w-40 border p-2" style="border-radius:var(--radius)">reads [--radius:var(--radius-xl)] → should be 10px</div>
          </div>`
        )}

        ${sect(
          "Prose (typography plugin bridged to tokens)",
          `
          <div class="prose prose-sm max-w-none">
            <h3>Rendered markdown</h3>
            <p>Body copy with <strong>bold</strong>, a <a href="#">link</a>, and <code>inline code</code>.</p>
            <blockquote>A quote sits on the muted rule.</blockquote>
          </div>`
        )}
      </div>
    </main>
  </div>
</div>`;

      document.getElementById("app").innerHTML = board("light") + board("dark");
    </script>
  </body>
</html>
