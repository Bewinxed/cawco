<!doctype html>
<!-- The decision-page kit's surfaces in one page (specs/concentric): the
     kit's page.html with a card's media (two panes, a mockup and a code
     block) and a picked option, built by the hub's own builder. The kit's
     script is left out: the fill and the pick stand in the markup, as the
     bridge would draw them, so the page holds still. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concentric fixture</title>
<style>{{KIT_CSS}}</style>
</head>
<body>
<main class="dp">
  <header class="dp-hero">
    <span><img class="caw-l" src="caw/light-ready.webp" alt="Caw" width="72" height="72"><img class="caw-d" src="caw/dark-ready.webp" alt="" width="72" height="72"></span>
    <div>
      <h1>Which layout the board takes</h1>
      <p>Two decisions; the picks go to the session that wrote this page.</p>
    </div>
    <div class="dp-meter"><span><b data-dp-count>1</b> of <span data-dp-total>2</span> picked</span><span class="dp-bar"><i data-dp-fill style="width: 50%"></i></span></div>
  </header>

  <article class="dp-card" id="layout">
    <header><h2>Which layout does the board take?</h2><span class="dp-state" data-dp-state="layout">Picked</span></header>
    <p class="dp-why">Today: one column of cards.</p>
    <div class="dp-show">
      <figure class="dp-pane"><figcaption>How it would look</figcaption>{{MK:look}}</figure>
      <figure class="dp-pane"><figcaption>How it works</figcaption><pre>columns: 2
gap: space-3</pre></figure>
    </div>
    <div class="dp-opts" data-cawco-choice="layout" role="group" aria-label="Layout">
      <button class="dp-opt" type="button" data-option="one"><b><span class="dp-kc">1</span><span>One column</span></b><span>As it is.</span></button>
      <button class="dp-opt" type="button" data-option="two" data-cawco-picked aria-pressed="true"><span class="dp-tag">Recommended</span><b><span class="dp-kc">2</span><span>Two columns</span></b><span>Twice the cards in view.</span></button>
    </div>
    <label class="dp-note">Note<textarea data-dp-note="layout" rows="1" placeholder="Anything to add"></textarea></label>
  </article>

  <footer class="dp-done"><span data-dp-sent></span><button class="dp-send" type="button" data-dp-send>Send picks</button></footer>
</main>
</body>
</html>
