<!-- From backlot scripts/probe-review/index.html, unchanged: the owner's review page, reading manifest.json beside it. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover"
      name="viewport"
    >
    <title>Pick</title>
    <link href="data:," rel="icon">
    <style>
      :root {
        color-scheme: dark;
        --bg: #111214;
        --card: #1b1c20;
        --line: #2b2d33;
        --text: #ececef;
        --dim: #9a9ba3;
        --accent: #5b8def;
        --pick: #3fb37f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px / 1.4 system-ui,
          -apple-system,
          sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: calc(16px + env(safe-area-inset-top)) 14px
          calc(24px + env(safe-area-inset-bottom));
      }
      .step {
        color: var(--dim);
        font-size: 13px;
        margin: 0 0 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .step button {
        background: none;
        border: 0;
        color: var(--accent);
        font-size: 14px;
        padding: 8px 0;
      }
      h1 {
        font-size: 21px;
        line-height: 1.25;
        margin: 0 0 6px;
        font-weight: 650;
      }
      .how {
        color: var(--dim);
        font-size: 14px;
        margin: 0 0 16px;
      }
      .opt {
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 14px;
        margin: 0 0 16px;
        overflow: hidden;
      }
      .opt.chosen {
        border-color: var(--pick);
      }
      .head {
        padding: 12px 14px 10px;
      }
      .name {
        font-size: 17px;
        font-weight: 650;
        margin: 0;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .badge {
        font-size: 12px;
        font-weight: 600;
        color: #0b1530;
        background: var(--accent);
        border-radius: 6px;
        padding: 2px 7px;
      }
      .why {
        color: var(--dim);
        font-size: 13px;
        margin: 4px 0 0;
      }
      .strip {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
      }
      .strip::-webkit-scrollbar {
        display: none;
      }
      .shot {
        flex: 0 0 100%;
        scroll-snap-align: start;
        position: relative;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: pan-x pan-y;
      }
      .shot img {
        display: block;
        width: 100%;
        height: auto;
        background: #0b0b0c;
      }
      .lbl {
        position: absolute;
        left: 8px;
        bottom: 8px;
        background: rgba(0, 0, 0, 0.66);
        font-size: 12px;
        padding: 3px 8px;
        border-radius: 6px;
      }
      .orig {
        position: absolute;
        left: 8px;
        top: 8px;
        background: var(--accent);
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 6px;
        display: none;
      }
      .shot.held .orig {
        display: block;
      }
      .dots {
        display: flex;
        justify-content: center;
        gap: 6px;
        padding: 8px 0 2px;
      }
      .dots i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #3a3c43;
      }
      .dots i.on {
        background: var(--text);
      }
      .hint {
        text-align: center;
        color: var(--dim);
        font-size: 12px;
        margin: 0 0 10px;
      }
      .pickbtn {
        display: block;
        width: calc(100% - 28px);
        margin: 4px 14px 14px;
        min-height: 52px;
        border: 0;
        border-radius: 11px;
        background: var(--accent);
        color: #fff;
        font-size: 17px;
        font-weight: 650;
      }
      .opt.chosen .pickbtn {
        background: var(--pick);
        color: #06140c;
      }
      .done li {
        margin: 0 0 12px;
        list-style: none;
      }
      .done ul {
        padding: 0;
        margin: 0 0 20px;
      }
      .done .q {
        color: var(--dim);
        font-size: 13px;
      }
      .done .a {
        font-size: 17px;
        font-weight: 600;
      }
      .done .a button {
        background: none;
        border: 0;
        color: var(--accent);
        font-size: 14px;
        margin-left: 8px;
        padding: 6px;
      }
      .big {
        display: block;
        width: 100%;
        min-height: 56px;
        border: 0;
        border-radius: 12px;
        background: var(--pick);
        color: #06140c;
        font-size: 18px;
        font-weight: 700;
      }
      .err {
        color: #e0565b;
      }
    </style>
  </head>
  <body>
    <main id="main"><p class="how">Loading…</p></main>
    <script>
      "use strict";
      // One decision per screen. Each option is a card: its pictures (swipe), hold a
      // picture to see the original, and one "Pick" button that records the choice
      // and moves to the next decision. The last screen copies the picks for chat.
      // Manifest schema: scripts/probe-review/README.md.
      const main = document.getElementById("main");
      let manifest;
      let picks = {};
      let at = 0;
      const storeKey = () => `probe-review:${manifest.id ?? manifest.title}`;
      const save = () =>
        localStorage.setItem(storeKey(), JSON.stringify(picks));

      function shot(item, total, index) {
        const el = document.createElement("div");
        el.className = "shot";
        el.innerHTML = `<img alt=""><span class="orig">Original</span><span class="lbl"></span>`;
        const img = el.querySelector("img");
        img.src = item.after;
        img.loading = index === 0 ? "eager" : "lazy";
        el.querySelector(".lbl").textContent =
          `${item.label}${total > 1 ? ` · ${index + 1}/${total}` : ""}`;
        if (item.before && item.before !== item.after) {
          let timer;
          const show = () => {
            img.src = item.before;
            el.classList.add("held");
          };
          const hide = () => {
            clearTimeout(timer);
            if (el.classList.contains("held")) {
              img.src = item.after;
              el.classList.remove("held");
            }
          };
          el.addEventListener("pointerdown", () => {
            timer = setTimeout(show, 220);
          });
          for (const ev of ["pointerup", "pointerleave", "pointercancel"]) {
            el.addEventListener(ev, hide);
          }
          el.addEventListener("contextmenu", (e) => e.preventDefault());
        }
        return el;
      }

      function option(d, c) {
        const el = document.createElement("section");
        el.className = `opt${picks[d.id] === c.id ? " chosen" : ""}`;
        el.innerHTML = `<div class="head"><p class="name"></p><p class="why"></p></div><div class="strip"></div><div class="dots"></div><p class="hint"></p><button class="pickbtn" type="button"></button>`;
        const name = el.querySelector(".name");
        name.textContent = c.label;
        if (d.recommended === c.id) {
          const b = document.createElement("span");
          b.className = "badge";
          b.textContent = "Recommended";
          name.append(b);
        }
        el.querySelector(".why").textContent = c.result ?? "";
        const strip = el.querySelector(".strip");
        const dots = el.querySelector(".dots");
        c.items.forEach((item, i) => {
          strip.append(shot(item, c.items.length, i));
          const dot = document.createElement("i");
          if (i === 0) {
            dot.className = "on";
          }
          dots.append(dot);
        });
        if (c.items.length < 2) {
          dots.remove();
        }
        strip.addEventListener(
          "scroll",
          () => {
            const i = Math.round(strip.scrollLeft / strip.clientWidth);
            for (const [j, dot] of dots.querySelectorAll("i").entries()) {
              dot.classList.toggle("on", i === j);
            }
          },
          { passive: true }
        );
        const hasOriginal = c.items.some(
          (it) => it.before && it.before !== it.after
        );
        el.querySelector(".hint").textContent = [
          c.items.length > 1 ? "Swipe for more" : "",
          hasOriginal ? "hold to see the original" : "",
        ]
          .filter(Boolean)
          .join(" · ");
        const btn = el.querySelector(".pickbtn");
        btn.textContent =
          picks[d.id] === c.id ? `✓ Picked ${c.label}` : `Pick ${c.label}`;
        btn.onclick = () => {
          picks[d.id] = c.id;
          save();
          render();
          setTimeout(() => {
            at += 1;
            render();
            window.scrollTo(0, 0);
          }, 350);
        };
        return el;
      }

      function decisionScreen(d) {
        const n = manifest.decisions.length;
        main.innerHTML = `<p class="step"><span></span><button type="button" class="back"></button></p><h1></h1><p class="how"></p>`;
        main.querySelector(".step span").textContent =
          n > 1 ? `Question ${at + 1} of ${n}` : manifest.title;
        const back = main.querySelector(".back");
        if (at > 0) {
          back.textContent = "‹ Back";
          back.onclick = () => {
            at -= 1;
            render();
            window.scrollTo(0, 0);
          };
        } else {
          back.remove();
        }
        main.querySelector("h1").textContent = d.question;
        main.querySelector(".how").textContent = d.bar
          ? `Tap the one that looks best. ${d.bar}`
          : "Tap the one that looks best.";
        for (const c of d.candidates) {
          main.append(option(d, c));
        }
      }

      function doneScreen() {
        main.innerHTML = `<div class="done"><h1>Your picks</h1><p class="how">Copy them and paste them in the chat.</p><ul></ul><button class="big" type="button">Copy picks</button></div>`;
        const ul = main.querySelector("ul");
        manifest.decisions.forEach((d, i) => {
          const c = d.candidates.find((x) => x.id === picks[d.id]);
          const li = document.createElement("li");
          li.innerHTML = `<div class="q"></div><div class="a"><span></span><button type="button">Change</button></div>`;
          li.querySelector(".q").textContent = d.question;
          li.querySelector(".a span").textContent = c ? c.label : "Not picked";
          li.querySelector("button").onclick = () => {
            at = i;
            render();
            window.scrollTo(0, 0);
          };
          ul.append(li);
        });
        const btn = main.querySelector(".big");
        btn.onclick = async () => {
          const text = `${manifest.title}\n${manifest.decisions.map((d) => `${d.question} → ${d.candidates.find((x) => x.id === picks[d.id])?.label ?? "no pick"}`).join("\n")}`;
          try {
            await navigator.clipboard.writeText(text);
            btn.textContent = "Copied, paste it in the chat";
          } catch {
            // biome-ignore lint/suspicious/noAlert: where the phone refuses clipboard access, a prompt box is the only way to hand the owner the picks to copy
            window.prompt("Copy this:", text);
          }
        };
      }

      function render() {
        if (at >= manifest.decisions.length) {
          doneScreen();
        } else {
          decisionScreen(manifest.decisions[at]);
        }
      }

      fetch("manifest.json")
        .then((r) => {
          if (!r.ok) {
            throw new Error(`manifest.json: HTTP ${r.status}`);
          }
          return r.json();
        })
        .then((m) => {
          manifest = m;
          document.title = m.title;
          picks = JSON.parse(localStorage.getItem(storeKey()) ?? "{}");
          render();
        })
        .catch((e) => {
          main.innerHTML = `<p class="err"></p>`;
          main.querySelector(".err").textContent = String(e);
        });
    </script>
  </body>
</html>
