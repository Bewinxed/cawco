# The isolated linker's shared fallback directory, node_modules/.bun/node_modules,
# lets an undeclared import reach whichever copy the last install task wrote
# (oven-sh/bun#40355). svelte-eslint-parser declares no typescript and loads the
# newest it can reach, which there is the API-less TS 7. Without the directory an
# undeclared import fails, and TS 6 at the root is the only typescript reachable.
# https://bun.com/docs/pm/isolated-installs
#
# A store package's own undeclared import is declared in the root package.json,
# the one node_modules above the store, until bun ships packageExtensions
# (oven-sh/bun#40053): bits-ui for vaul-svelte (huntabyte/vaul-svelte#130).
# drizzle-kit's bare import() of drizzle-orm (drizzle-team/drizzle-orm#6156) is
# answered by NODE_PATH in packages/hub's db scripts instead, so it reaches the
# hub's own copy on the host and in a workspace alike.
# Inside a CawCo workspace bun's global store is on (its workspace bunfig), and
# a package there realpaths into the cache, with no node_modules of ours above
# it. So the dashboard resolves bits-ui from its own root whatever imports it:
# vite.config.ts `resolve.dedupe`, and tsconfig.json `paths` for its types.
# Bun's bundles do the same for react, which tunnel-rat imports undeclared
# (pmndrs/tunnel-rat#24): core agent-react.ts resolves it from the agent package
# in every Bun.build, so the root declares no react.
#
# A checkout bun install has not run in has no node_modules, and bun then
# auto-installs every import into its global cache, where a package's peer is
# never linked: core's bun-plugin-svelte loads from <cache>/bun-plugin-svelte@
# 0.0.6@@@1 and its own import of svelte/compiler fails from there. `auto =
# "disable"` makes such a run stop at its first import, "Cannot find package",
# which `bun install` answers. It counts only in the directory bun starts in.
# https://bun.com/docs/runtime/auto-install
[install]
hoist = false
auto = "disable"
