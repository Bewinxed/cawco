    --focus-ring: light-dark(oklch(55% 0.165 33), oklch(76% 0.12 34));
    /* Selection: coral tint. */
    --selection: light-dark(
      oklch(64.5% 0.175 33 / 0.2),
      oklch(64.5% 0.175 33 / 0.3)
    );
    /* Status: four hues and a hueless idle (idle carries no fill). Needs-you is spark yellow, the one status that asks for a person. */
    --status-live-bg: color-mix(in oklab, var(--info-3) 76%, var(--info-9));
    --status-attn-bg: light-dark(oklch(91% 0.115 95), oklch(37% 0.07 92));
    /* A task's needs section (TaskNeeds): the attention tint at a little under half, laid on the raised surface the task stands on. */
    --needs-ground: color-mix(
      in oklab,
      var(--status-attn-bg) 45%,
      var(--surface-raised)
    );
    /* The picked card among an account's routing strategies (StrategyPicker): the selection's tint at a little under half, laid on the raised surface. */
    --strategy-card-picked: color-mix(
      in oklab,
      var(--selected-bg) 45%,
      var(--surface-raised)
    );
    --status-done-bg: color-mix(
      in oklab,
      var(--success-3) 76%,
      var(--success-9)
    );
    --status-fail-bg: light-dark(
      color-mix(in oklab, var(--error-3) 76%, var(--error-9)),
      color-mix(in oklab, var(--error-3) 68%, var(--error-9))
    );
    --status-idle-bg: transparent;
    --status-live-ink: color-mix(
      in oklab,
      var(--info-11) 76%,
      var(--neutral-12)
    );
    --status-attn-ink: light-dark(oklch(35% 0.075 88), oklch(90% 0.115 95));
    --status-done-ink: color-mix(
      in oklab,
      var(--success-11) 76%,
      var(--neutral-12)
    );
    --status-fail-ink: color-mix(
      in oklab,
      var(--error-11) 76%,
      var(--neutral-12)
    );
    --status-idle-ink: var(--neutral-11);
    /* Status glyphs: the hue itself, not the near-black text ink, so a row's state reads in colour at a glance. Each holds 3:1 or more (non-text) on raised, page, fill, hover, the selected wash and the needs-you wash, in both themes; idle stays neutral. */
    --status-live-glyph: light-dark(oklch(50% 0.15 252), oklch(74% 0.12 245));
    --status-attn-glyph: light-dark(oklch(57% 0.125 78), oklch(87% 0.14 92));
    /* A session tab's rim when it needs you: the attention glyph's hue and chroma, darker by day, where the glyph's own tone holds only 3.2:1 against the shelf even whole, so a rim mixed from it cannot hold 3:1 and stay quieter than the chosen tab's. By night the glyph's own. */
    --tab-rim-attn: light-dark(oklch(48% 0.125 78), oklch(87% 0.14 92));
    --status-done-glyph: light-dark(oklch(52% 0.14 140), oklch(76% 0.15 135));
    --status-fail-glyph: light-dark(oklch(53% 0.19 22), oklch(71% 0.16 20));
    --status-idle-glyph: var(--neutral-11);
    /* The nesting lines' ink (.kit-nest, WorkflowRail): one opaque neutral, about 2.3:1 to 2.5:1 against the sidebar and the phone home in both themes (a little past step 8 in light, between steps 7 and 8 in dark). A step lighter than the 3:1 it stood at, which read as heavy; never a faint hairline, and never an alpha, so two strokes that cross are the colour of one. */
    --nest-ink: light-dark(
      color-mix(in oklch, var(--neutral-8) 85%, var(--neutral-9)),
      color-mix(in oklch, var(--neutral-7) 50%, var(--neutral-8))
    );
    /* Usage meters (DESIGN.md, Limit bar: a fill in the window's state colour): a window with room is the muted ink on the control-edge groove (a quiet reading is a healthy one, and coral is the action's, never data: DESIGN.md The Coral Is Where You Act Rule), spark yellow one near its limit (70% used, or a run-out under an hour away), crimson one from 90%. The calm fill holds about 4.7:1 on its track by day and 5:1 at night. */
    --meter-calm: var(--neutral-11);
    /* The calm meter's groove: the ring's empty track (border-control). */
    --meter-calm-track: var(--border-control);
    --meter-near: light-dark(oklch(62% 0.135 88), oklch(86% 0.14 95));
    --meter-near-track: light-dark(oklch(69.5% 0.095 90), oklch(53% 0.08 92));
    --meter-over: light-dark(oklch(50% 0.17 15), oklch(68% 0.16 15));
    --meter-over-track: light-dark(oklch(72% 0.08 15), oklch(53% 0.09 15));
    --meter-stale: light-dark(oklch(56% 0.012 265), oklch(64% 0.01 265));
    --meter-stale-track: light-dark(oklch(75% 0.008 265), oklch(45% 0.008 265));
    /* The one neutral the usage breakdown and history bars draw in. */
    --meter-share: light-dark(oklch(55% 0.012 265), oklch(72% 0.01 265));
    /* A near or over row's only tint: a faint wash of its status ink (owner: "the tints for yellow/red are too overwhelming"). */
    --meter-wash-near: light-dark(
      color-mix(in oklch, var(--status-attn-ink) 6%, transparent),
      color-mix(in oklch, var(--status-attn-ink) 10%, transparent)
    );
    --meter-wash-over: light-dark(
      color-mix(in oklch, var(--status-fail-ink) 6%, transparent),
      color-mix(in oklch, var(--status-fail-ink) 10%, transparent)
    );
    --presence-online: light-dark(oklch(62.7% 0.17 149), oklch(74% 0.17 149));
    --presence-away: light-dark(oklch(70.5% 0.187 47.6), oklch(76% 0.187 47.6));
    --presence-off: var(--neutral-8);
    /* Every scrollbar's thumb, inherited from the root. */
    --scrollbar-thumb: oklch(from var(--muted-foreground) l c h / 0.35);
    /* The band of raised surface that crosses a skeleton once per loop. */
    --skeleton-sheen: oklch(from var(--surface-raised) l c h / 0.6);
    /* List bullets in rendered markdown. */
    --prose-bullet: oklch(from var(--muted-foreground) l c h / 0.55);
    /* Project identity ink at hue 0; the identity-ink utility turns it to the project's --identity-h. 48%, not 50%: on a row's hover surface the cyan end of the wheel fell to 4.39:1 at 50%, and 48% holds every one of the ten hues above 4.5:1. */
    --identity-ink: light-dark(oklch(48% 0.12 0), oklch(74% 0.11 0));
    /* A machine that is not online: between the mid and muted neutrals. */
    --machine-offline: color-mix(
      in oklab,
      var(--neutral-8) 62%,
      var(--neutral-11)
    );
    /* Data colour: chroma survives in numerals. */
    --data-ok: light-dark(
      oklch(from var(--success-9) 46% 0.125 h),
      oklch(from var(--success-9) 78% 0.135 h)
    );
    --data-warn: light-dark(
      oklch(from var(--warning-9) 46% 0.125 h),
      oklch(from var(--warning-9) 80% 0.13 h)
    );
    --data-bad: light-dark(
      oklch(from var(--error-9) 46% 0.135 h),
      oklch(from var(--error-9) 81% 0.13 h)
    );
    /* A diff's added row, over code-bg. */
    --diff-add-bg: oklch(from var(--success-9) l c h / 0.15);
    /* A diff's removed row, over code-bg. */
    --diff-del-bg: oklch(from var(--error-9) l c h / 0.15);
    /* The words an added row changed, over diff-add-bg. */
    --diff-add-emphasis: oklch(from var(--success-9) l c h / 0.1);
    /* The words a removed row changed, over diff-del-bg. */
    --diff-del-emphasis: oklch(from var(--error-9) l c h / 0.1);
    /* Release-note section labels (ReleaseNotes): New green, Improved cyan, Fixed amber. Each ink sits on its own faint fill at 4.5:1 or more in both themes. */
    --note-new-ink: light-dark(oklch(44% 0.11 149), oklch(86% 0.12 149));
    --note-new-bg: light-dark(oklch(95% 0.04 149), oklch(31% 0.055 149));
    --note-improved-ink: light-dark(oklch(44% 0.1 225), oklch(86% 0.1 225));
    --note-improved-bg: light-dark(oklch(95% 0.035 225), oklch(31% 0.05 225));
    --note-fixed-ink: light-dark(oklch(46% 0.1 70), oklch(87% 0.13 79));
    --note-fixed-bg: light-dark(oklch(95% 0.05 85), oklch(32% 0.055 79));
    --chart-1: light-dark(var(--neutral-12), var(--neutral-11));
    --chart-brand: var(--coral-9);
    --chart-2: var(--info-9);
    --chart-3: var(--mark-7);
    --chart-4: var(--warning-9);
    --chart-5: var(--neutral-9);
    /* Syntax (code blocks and diffs). Every syntax token holds 4.5:1 or more on every ground a code surface draws: code-bg, a diff's added and removed rows (diff-add-bg, diff-del-bg) and their word emphasis over them (diff-add-emphasis, diff-del-emphasis), in both themes. */
    --code-ink: var(--ink-strong);
    --code-keyword: light-dark(oklch(45% 0.15 33), oklch(76% 0.12 34));
    --code-fn: light-dark(oklch(43% 0.1 245), oklch(80% 0.07 240));
    --code-string: light-dark(oklch(42% 0.105 122), oklch(84% 0.1 118));
    --code-number: light-dark(oklch(44% 0.115 55), oklch(84% 0.1 70));
    /* By day a step under ink-subtle's lightness, which reads 4.3:1 on a diff's tinted row; at night ink-subtle itself. */
    --code-comment: light-dark(oklch(43% 0.014 74), var(--ink-subtle));
    /* The transcript rail: one flat 2px line down a run of tool rows. An image, not a colour: rows paint it as a sized background layer (2px wide), and a colour would fill the whole row. Head and continuing rows paint the same, so no seam shows between them. */
    --rail: linear-gradient(
      oklch(from var(--neutral-11) l c h / 0.4),
      oklch(from var(--neutral-11) l c h / 0.4)
    );
    --rail-body: var(--rail);
    /* The transcript head's colour ramp, a mask over c-head-fade: how much of the chosen tab's sheet (tab-sheet) stands over the rows, inOutCubic(x) at each tenth of the band from its foot (x = 0, the gradient's end) to the strip's edge (x = 1, its start), the curve the head blur's slices are bounded on, so the blur and the colour arrive together. Flat at both ends: no line where the band starts on the rows, and none where it meets the tab's foot, where it is the sheet whole. */
    --head-tint-ramp: linear-gradient(
      rgb(0 0 0 / 1),
      rgb(0 0 0 / 0.996),
      rgb(0 0 0 / 0.968),
      rgb(0 0 0 / 0.892),
      rgb(0 0 0 / 0.744),
      rgb(0 0 0 / 0.5),
      rgb(0 0 0 / 0.256),
      rgb(0 0 0 / 0.108),
      rgb(0 0 0 / 0.032),
      rgb(0 0 0 / 0.004),
      rgb(0 0 0 / 0)
    );
    /* Chrome materials: structural translucency, never decoration. */
    --material-panel: oklch(from var(--surface-raised) l c h / 0.72);
    /* What a dialog's backdrop paints: the page itself, translucent. */
    --scrim: oklch(from var(--background) l c h / var(--scrim-mix));
    /* The 1px edge drawn inside a raster image (the brand row's icon), so it keeps its shape on any surface. Pure black by day and pure white at night, never a tinted neutral: a tint picks up the surface under it and reads as dirt on the image's edge. An image whose own edge is darker than the surface it sits on (the paywall's night film band on the raised sheet) takes it one width outside instead: inside, 10% white over its near-black edge comes out the surface's own colour and parts nothing. */
    --image-outline: light-dark(oklch(0 0 0 / 0.1), oklch(1 0 0 / 0.1));
    /* Elevation tints: warm ink by day, the deepest surface at night, never rgba black. */
    --shadow-tint: light-dark(
      oklch(from var(--neutral-12) l c h / 0.09),
      oklch(from var(--neutral-1) l c h / 0.55)
    );
    --shadow-tint-2: light-dark(
      oklch(from var(--neutral-12) l c h / 0.14),
      oklch(from var(--neutral-1) l c h / 0.66)
    );
    --shadow-tint-3: light-dark(
      oklch(from var(--neutral-12) l c h / 0.2),
      oklch(from var(--neutral-1) l c h / 0.76)
    );
    /* What a folder tab casts on the tab behind it (shadow-tab-start, shadow-tab-end): warm ink by day; at night the ink lit, since the tabs are the darkest surfaces and no shadow shows on them. */
    --tab-shade: light-dark(
      oklch(from var(--neutral-12) l c h / 0.24),
      oklch(from var(--neutral-12) l c h / 0.14)
    );
    /* What the chosen folder tab casts on the tabs behind it: tab-shade by day; nothing at night, where its sheet is the lightest of them and lit ink beside it would only blur its edge (its rim draws it). */
    --tab-shade-chosen: light-dark(var(--tab-shade), transparent);
    /* At night every raised shadow adds a 1px inner ring of ink. */
    --night-ring: light-dark(
      transparent,
      oklch(from var(--neutral-12) l c h / 0.07)
    );
    --shadow-xs: 0 1px 2px var(--shadow-tint);
    --shadow-tile:
      0 1px 2px
        light-dark(
          oklch(from var(--neutral-12) l c h / 0.07),
          oklch(0% 0 0 / 0.3)
        ),
      0 0 0 1px
        light-dark(
          oklch(from var(--neutral-12) l c h / 0.035),
          oklch(from var(--neutral-12) l c h / 0.06)
        );
    --shadow-raised:
      0 1px 3px var(--shadow-tint), 0 1px 1px var(--shadow-tint),
      inset 0 0 0 1px var(--night-ring);
    --shadow-hairline: 0 3px 7px -2px var(--shadow-tint-2);
    /* A stat tile's lift: drawn below the card, not around it; ringed at night. */
    --shadow-stat:
      0 3px 7px -2px var(--shadow-tint-2), inset 0 0 0 1px var(--night-ring);
    --shadow-md:
      0 3px 10px var(--shadow-tint-2), 0 1px 2px var(--shadow-tint),
      inset 0 0 0 1px var(--night-ring);
    --shadow-lg:
      0 10px 30px var(--shadow-tint-2), 0 3px 8px var(--shadow-tint),
      inset 0 0 0 1px var(--night-ring);
    --shadow-xl:
      0 24px 64px var(--shadow-tint-3), 0 6px 16px var(--shadow-tint),
      inset 0 0 0 1px var(--night-ring);
    --shadow-overlay:
      0 18px 48px var(--shadow-tint-3), 0 2px 6px var(--shadow-tint),
      inset 0 0 0 1px var(--night-ring);
    /* A hanging surface whose top shows its own surface across the cut into its anchor (Caw's panel, kit-hang): the overlay's drop without the night ring, which would draw across the cut as a seam. */
    --shadow-overlay-hung:
      0 18px 48px var(--shadow-tint-3), 0 2px 6px var(--shadow-tint);
    --shadow-modal: var(--shadow-overlay);
    --shadow-drawer: 0 12px 40px var(--shadow-tint-3);
    /* A drawn shape's drop (the grown composer), drawn as the SVG's own feDropShadow filters so it follows the shape, not a box, and is painted once rather than reapplied as the shape moves (grown.ts): this far layer, then shadow-drop-near. */
    --shadow-drop: 0 14px 28px var(--shadow-tint-2);
    --shadow-drop-near: 0 2px 4px var(--shadow-tint);
    /* A folder tab's edge on the tab behind it, at its leading side: one-sided, never above its top (PaneTabs .shade). */
    --shadow-tab-start: -2px 0 5px -1px var(--tab-shade);
    /* A folder tab's edge on the tab behind it, at its trailing side (PaneTabs .shade). */
    --shadow-tab-end: 2px 0 5px -1px var(--tab-shade);
    /* The chosen folder tab's edge on the tab behind it, at its leading side (PaneTabs .shade). */
    --shadow-tab-start-chosen: -2px 0 5px -1px var(--tab-shade-chosen);
    /* The chosen folder tab's edge on the tab behind it, at its trailing side (PaneTabs .shade). */
    --shadow-tab-end-chosen: 2px 0 5px -1px var(--tab-shade-chosen);
    --shadow-inset-sel: inset 0 1px 1px var(--shadow-tint);
    /* Shadow per surface level, paired with --surface-1…8. */
    --surface-shadow-1: none;
    --surface-shadow-2: var(--shadow-tile);
    --surface-shadow-3:
      0 1px 3px var(--shadow-tint), 0 1px 1px var(--shadow-tint),
      inset 0 0 0 1px var(--night-ring);
    --surface-shadow-4: var(--shadow-md);
    --surface-shadow-5:
      0 6px 18px var(--shadow-tint-2), 0 2px 4px var(--shadow-tint),
      inset 0 0 0 1px var(--night-ring);
    --surface-shadow-6: var(--shadow-lg);
    --surface-shadow-7:
      0 14px 40px var(--shadow-tint-3), 0 2px 6px var(--shadow-tint),
      inset 0 0 0 1px var(--night-ring);
    --surface-shadow-8: var(--shadow-overlay);
    /* The action's edge: a white top hairline and a coral-tinted drop. */
    --action-ring:
      inset 0 1px 0 oklch(100% 0 0 / 0.18),
      0 1px 2px light-dark(oklch(45% 0.12 33 / 0.25), oklch(0% 0 0 / 0.4));
    /* Inner vermillion ring and soft inner glow on code blocks. */
    --code-ring:
      inset 0 0 0 1px
        light-dark(oklch(58.5% 0.17 33 / 0.28), oklch(66% 0.16 34 / 0.32)),
      inset 0 1px 6px
        light-dark(oklch(58.5% 0.17 33 / 0.06), oklch(66% 0.16 34 / 0.1));
    --selected-shadow: none;
    /* The effort knob's and Browse's lifted block: a neutral-8 inner edge over shadow-raised's layers (DESIGN.md Effort chip). */
    --shadow-knob:
      inset 0 0 0 1px var(--neutral-8), 0 1px 3px var(--shadow-tint),
      0 1px 1px var(--shadow-tint), inset 0 0 0 1px var(--night-ring);
    /* Caw&Co wordmark: the approved landing's Nunito Variable face. */
    --font-wordmark: "Nunito Variable", ui-rounded, system-ui, sans-serif;
    /* Figtree for UI and transcript prose, 400 and 500 only. */
    --font-sans:
      "Figtree Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI",
      sans-serif;
    --font-body: var(--font-sans);
    /* JetBrains Mono for code, paths, IDs and measurements; ligatures off. */
    --font-mono: "JetBrains Mono Variable", ui-monospace, "SF Mono", monospace;
    /* Fredoka 600: brand display only. */
    --font-display:
      "Fredoka", "Figtree Variable", ui-rounded, system-ui, sans-serif;
    /* Figtree's cap height (0.703em). JetBrains Mono figures set beside Figtree words take it as `font-size-adjust: cap-height`, so their digits stand as tall as Figtree's at the same size step (unadjusted, Mono's stand 4% taller). */
    --mono-figure-cap: 0.703;
    /* The landing wordmark's variable-font weight. Brand only. */
    --weight-wordmark: 1000;
    /* The landing wordmark's tracking; the ampersand shares its face and size. */
    --track-wordmark: -0.045em;
    /* The six sizes text takes. Dense roles hold one size at every width; title and kpi scale with the viewport between 390 and 1024px. */
    --text-meta: 0.75rem;
    --text-label: 0.8125rem;
    --text-body: 0.875rem;
    /* Code runs a step under body: JetBrains Mono sets large. */
    --text-code: 0.75rem;
    --text-title: clamp(1.125rem, 1.048rem + 0.3155vi, 1.25rem);
    --text-kpi: clamp(1.25rem, 1.0962rem + 0.6309vi, 1.5rem);
    /* Brand and marketing only. */
    --text-display: 2.5rem;
    --leading-meta: 1.35;
    --leading-label: 1.3;
    --leading-tight: 1.2;
    --leading-ui: 1.25;
    --leading-body: 1.45;
    --leading-prose: 1.55;
    --leading-code: 1.6;
    --leading-kpi: 1;
    /* Tailwind preflight's root line height: what a row that sets no leading of its own inherits (the transcript's rail lines). */
    --leading-root: 1.5;
    /* A rendered document's running text (@tailwindcss/typography prose-sm, the project page's docs card): 24/14. */
    --leading-prose-sm: 1.7142857;
    /* The permission rule tester's preview of what a rule matches (RuleTester, Tailwind's relaxed). */
    --leading-relaxed: 1.625;
    /* prose-sm: above an h2, in the heading's own ems. */
    --prose-sm-title-before: 1.6;
    /* prose-sm: below an h1 or h2, in the heading's own ems. */
    --prose-sm-title-after: 0.8;
    /* prose-sm: above an h3, in the heading's own ems. */
    --prose-sm-h3-before: 1.5555556;
    /* prose-sm: below an h3, in the heading's own ems. */
    --prose-sm-h3-after: 0.4444444;
    /* prose-sm: above an h4 to h6, in the heading's own ems. */
    --prose-sm-h4-before: 1.4285714;
    /* prose-sm: below an h4 to h6, in the heading's own ems. */
    --prose-sm-h4-after: 0.5714286;
    /* prose-sm: above and below a blockquote, in the body's ems. */
    --prose-sm-quote: 1.3333333;
    /* prose-sm: a blockquote's text inset from its rule, in the body's ems. */
    --prose-sm-quote-inset: 1.1111111;
    /* prose-sm: above and below a horizontal rule, in the body's ems. */
    --prose-sm-rule: 2.8571429;
    /* prose-sm: a table's font size, in the body's ems. A hair over 12px of 14px, which is what makes a browser take the face's 3px descent up to 4. */
    --prose-sm-table-size: 0.8571429;
    --weight-body: 400;
    /* Nothing in product UI goes above 500. */
    --weight-strong: 500;
    --track-display: -0.008em;
    --track-title: -0.01em;
    --track-caps: 0.06em;
    /* A menu item's keyboard shortcut (the kit's command, dropdown and context menu shortcuts, Tailwind's widest). */
    --track-widest: 0.1em;
    /* How far under its words a text link's underline stands, when it is drawn (its hover). */
    --underline-offset: 3px;
    /* Role shorthands (font: var(--type-label)). A kpi figure is always .num: the shorthand resets font-variant-numeric. */
    --type-meta: 400 var(--text-meta) / 1.35 var(--font-body);
    --type-label: 500 var(--text-label) / 1.3 var(--font-body);
    --type-body: 400 var(--text-body) / 1.45 var(--font-body);
    --type-prose: 400 var(--text-body) / 1.55 var(--font-body);
    --type-button: 500 var(--text-body) / 1 var(--font-body);
    /* Set with its tracking: the web's `text-title` utility carries it (app.css @theme, `--text-title--letter-spacing`), and the native role carries the same token. */
    --type-title: 500 var(--text-title) / 1.25 var(--font-body);
    --type-kpi: 500 var(--text-kpi) / 1 var(--font-body);
    --type-code: 400 var(--text-code) / 1.6 var(--font-mono);
    --type-caps: 500 11px / 1 var(--font-body);
    /* The 16px Field Rule's floor: no field's text under it on a phone, so iOS Safari never zooms into one. */
    --text-field-floor: 16px;
    /* Measured off the comps, deliberately not a 4px ladder. Keep the odd values. */
    --space-1: 4px;
    --space-2: 7px;
    --space-3: 11px;
    --space-4: 14px;
    --space-5: 18px;
    --space-6: 21px;
    --space-7: 25px;
    --space-8: 32px;
    /* Between the groups of a page (stat row, queue, a card). */
    --space-group: var(--space-5);
    /* Between the rows of one list in the rail (the home's Working and Finished, a tree's children there): rows of one list, not separate things. */
    --space-row: 2px;
    /* Hair: chart swatches, a tooltip's arrow. */
    --radius-hair: 2px;
    /* Marks, tiles, badges, kbd; a menu's items, concentric in its 12px surface (less its 1px edge and 6px pad). */
    --radius-xs: 5px;

    --tab-rim-mix-chosen: 0.97;

    --tab-rim-mix-idle: 0.86;

    --tab-rim-mix-subtle: 0.5;

    --dur-exit: 160ms;

    /* The grown composer folding back into its pill, shorter than its growth. */
    --dur-grow-exit: 220ms;

      background-color var(--dur-control) var(--ease-out),
      color var(--dur-control) var(--ease-out);
    /* The connection band (HubBand) sliding down from under the bar: its travel, fade and visibility on the panel's beat and the drawer curve, its tint and ink on the control's. */
    --transition-band-slide-show:
      translate var(--dur-panel) var(--ease-drawer),
      opacity var(--dur-panel) var(--ease-drawer), visibility var(--dur-panel),
      background-color var(--dur-control) var(--ease-out),
      color var(--dur-control) var(--ease-out);
    /* The connection band's row (HubBand) shutting as the band goes back up: its grid row on the exit's beat. */
    --transition-band-row-shut: grid-template-rows var(--dur-exit)
      var(--ease-out);
    /* The connection band's row (HubBand) opening from nothing as the band slides down: its grid row on the panel's beat and the drawer curve. */
    --transition-band-row-open: grid-template-rows var(--dur-panel)
      var(--ease-drawer);
  }

    --account-week-mix: 0.63;
  }

      --c-tray-chip: 34px;
      --c-peek-glyph: var(--icon-lg);
      --c-tray-gap: var(--space-3);
      --c-menu-item-h: 44px;
    }
  }

  @media (pointer: coarse), (width < 640px) {
    :root {
      --c-nav-h: 44px;
      --c-rail-row-h: 44px;
    }
  }

   design/tokens). Every size, ink, radius, duration and curve is a token. The values in :root below are the
   designs' own and have no token yet; each is listed as a finding in the report. */
@layer mockup {
:root {
  color-scheme: light dark;
  -webkit-tap-highlight-color: transparent;
  /* resize-handle-design.md, "New, in the JSON first". */
  /* The drawer's grabber (its head's top edge), the one rest mark left from the pills. */
  --c-edge-grip-len: 36px;
  --c-edge-hit: var(--space-3);
  /* A lit arm's taper at each end. */
  --c-edge-lit-fade: 36px;
  /* Round 27, the designer's report: the handle designs' own sizes, the kind-of-change hues on the tool-family
     formula (50% L / 0.12 C by day, 74% / 0.11 at night, none of the four status hues), and the kept
     region's band. */
  --c-arc-run: 8px;
  --c-arc-stroke: 3px;
  --c-arc-stroke-touch: 4px;
  --c-handle-bead: 10px;
  --c-section-band-h: 24px;
  --motion-enter: light-dark(oklch(50% 0.12 176), oklch(74% 0.11 176));
  --motion-change: light-dark(oklch(50% 0.12 253), oklch(74% 0.11 253));
  --motion-exit: light-dark(oklch(50% 0.12 330), oklch(74% 0.11 330));
  /* fable-timeline-design.md: "Name column 280px". */
  --dock-name-w: 280px;
  /* fable-timeline-design.md: "ew-resize on the 8px handle zones". */
  --bar-handle-zone: 8px;
  /* responsive-design.md, "Proposed tokens". The breakpoints (bp-short 560, bp-desk-wide 1800, bp-ultra
     2450) live in app.js's BP, which sets html[data-screen]; a media query can't read a custom property. */
  --c-graph-panel-w: 448px;
  --c-graph-panel-w-wide: 800px;
  /* r22 ruling call 3: the dock's ceiling leaves the page this much, its head and first field readable. */
  --c-page-h-floor: 240px;
  /* The kit's floating-surface pad (its menu), and One Target's gap round a bare element (the r21 ruling);
     neither has a token yet. */
  --c-floating-pad: 6px;
  --c-target-gap: 2px;
  --c-graph-drawer-stop: 45dvh;
  --c-review-max-w: 2000px;
  /* Phone landscape's collapsed sheet: "Hide collapses it to a 32px edge tab". */
  --c-edge-tab-w: 32px;
  /* The panel's width; a dragged width is set on html's own style and wins. */
  --panel-w: var(--c-graph-panel-w);
  /* One component from bp-ultra up: the whole layout stands in a 2000px column, centred, the gutter either
     side. A percentage, so each fixed box resolves it against the viewport it stands in. */
  --gutter: max(0px, (100% - var(--c-review-max-w)) / 2);
  --gutter-start: var(--gutter);
  --gutter-end: var(--gutter);
}
/* One component under review: the wide panel from bp-desk-wide. Two or more on screen at once: the 448 panel
   with the graphs stacked, or twice it with them side by side, and no 2000 cap (all-components-design.md). */
html:is([data-screen="wide"], [data-screen="ultrawide"]):not([data-multi]) { --panel-w: var(--c-graph-panel-w-wide); }
html[data-multi] { --panel-default: var(--c-graph-panel-w); --panel-w: var(--panel-default); }
html[data-multi][data-graphs="row"] { --panel-default: calc(2 * var(--c-graph-panel-w)); }
/* Every component at once (the r23 values ruling, call 2): the review block (the pages row and its margins,
   the panel and its margins) stands centred. The end gutter is fixed by the panel's default width, so a
   dragged panel keeps its trailing edge and the pages shift by the drag, wrapping only once the start gutter
   is spent. --row-w (the pages' row, from app.js) and its 18px margins either side; the panel's likewise. */
html[data-multi] {
  --gutter-end: max(0px, (100% - (var(--row-w) + 2 * var(--space-5)) - (var(--panel-default) + 2 * var(--space-5))) / 2);
  --gutter-start: max(0px, 100% - var(--gutter-end) - (var(--row-w) + 2 * var(--space-5)) - (var(--panel-w) + 2 * var(--space-5)));
}
/* More components than fit a row: the pages wrap and the block fills the pane. */
html[data-multi][data-wrapped] { --gutter-end: 0px; --gutter-start: 0px; }
* { box-sizing: border-box; }
body { margin: 0; min-block-size: 100dvh; font: var(--type-body); background: var(--surface-recess); color: var(--ink-strong); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
button { font: inherit; color: inherit; }

/* ---- The page under the tool: the component being judged ----
   It owns the room left of the panel and above the dock, and scrolls inside it, so the dock never covers it
   and nothing the tool does moves it. */
.page { position: fixed; inset-block: 0 var(--dock-room, 0px); inset-inline: var(--gutter-start) calc(var(--gutter-end) + var(--panel-w) + 2 * var(--space-5)); overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; padding: max(var(--space-8), env(safe-area-inset-top, 0px)) var(--space-5) var(--space-8); display: grid; justify-items: center; align-content: start; }
/* The pages: one row of 600px pages a margin apart, the spare width the recess; more than fit wrap. */
.pages { inline-size: 100%; display: flex; flex-wrap: wrap; justify-content: center; align-items: start; gap: var(--space-5); }
.stage-wrap { position: relative; flex: 0 1 auto; inline-size: min(100%, 600px); container: page / inline-size; }
.stage-wrap[hidden] { display: none; }
.frame { padding: var(--space-6); border: 1px solid var(--border-control); border-radius: calc(var(--mock-radius, 8px) + var(--space-1)); background: var(--surface-raised); box-shadow: var(--shadow-tile); }
.frame label { display: block; margin: 0 0 var(--space-1); font: var(--type-meta); color: var(--ink-muted); }
.field { margin-block-end: var(--space-3); min-inline-size: 0; }
.input { min-block-size: var(--c-input-h); padding: var(--space-2) var(--space-3); border: 1px solid var(--border-control); border-radius: var(--mock-radius, 8px); background: var(--surface-raised); overflow-wrap: anywhere; }
.input.tall { min-block-size: calc(2 * var(--c-input-h) - var(--space-2)); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); }
.line { margin: 0 0 var(--space-3); text-wrap: pretty; }
.line.read { font-weight: var(--weight-strong); }
.line.muted { color: var(--ink-muted); }
.line.fail { color: var(--status-fail-ink); }
.field .line { margin: var(--space-1) 0 0; }
.actions { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: var(--space-2); }
.actions .note { font: var(--type-meta); color: var(--ink-muted); text-wrap: pretty; }
/* A narrow page (a phone) gives the caption its own line over the buttons, rather than two squeezed beside
   them (the r24 review). */

/* Change marks (clarity §3 B, the owner's pick): while a hover previews a state that differs from the kept one,
   a wash over every value that came in or changed, and one where a value went, at its old box. */
.marks { position: absolute; inset: 0; pointer-events: none; }

  transform: translateY(var(--panel-translate-y));
  opacity: 0;
  filter: blur(var(--panel-blur));
  pointer-events: none;
  transition:
    transform var(--panel-close-dur) var(--panel-ease),
    opacity   var(--panel-close-dur) var(--panel-ease),
    filter    var(--panel-close-dur) var(--panel-ease);

   thumb (--radius-well) stands 3px (--c-segmented-pad) in a 10px groove (The Concentric Rule); segments are 30px, label weight at line-height 1, muted until chosen; a press tints, never scales.

.t-tabs[data-fade="start"] { mask-image: linear-gradient(to left, #000 calc(100% - var(--c-edge-fade-len-phone)), transparent); }
.t-tabs[data-fade="both"] { mask-image: linear-gradient(to right, transparent, #000 var(--c-edge-fade-len-phone), #000 calc(100% - var(--c-edge-fade-len-phone)), transparent); }

/* Text swap soft (34-text-swap-soft.md): the cross-fade alone, its width transition dropped, so a readout
   changing never moves what stands beside it. */

.t-text-soft > span { grid-area: 1 / 1; white-space: pre; transition: filter var(--text-soft-dur) var(--text-soft-ease), opacity var(--text-soft-dur) var(--text-soft-ease); }

/* ---- Every screen (responsive-design.md). app.js measures the pane, not the device, and sets three
   attributes on html: data-screen (the class), data-layout (desk | drawer | sheet) and data-input (fine |
   touch | touch-hover). ---- */

.tools { display: contents; }
.sheet-head { display: none; }

html:is([data-input="touch"], [data-input="touch-hover"]) .lane { touch-action: pan-y; }

html:is([data-screen="phone-portrait"], [data-screen="phone-landscape"]) .zoom { display: none; }

/* ---- Compact: the drawer (phone and tablet portrait) and the side sheet (short panes). One surface, two
   faces under the segmented control; no grips. ---- */
html:not([data-layout="desk"]) .tools { position: fixed; z-index: var(--layer-dock); display: flex; flex-direction: column; color: var(--ink-strong); background: var(--surface-raised); border: 1px solid var(--border-control); font: var(--type-label); font-weight: var(--weight-body); }

html:not([data-layout="desk"]) :is(.graphs, .gsec[data-current], .graph) { flex: 1 1 auto; }

html:not([data-layout="desk"]) .dock { padding-block-start: 0; }

/* The drawer: the house bottom drawer, three stops (head, peek, full). The page takes the room above it. */
html[data-layout="drawer"] .tools { inset-inline: 0; inset-block-end: 0; block-size: var(--drawer-h, var(--c-graph-drawer-stop)); border-block-end: 0; border-start-start-radius: var(--radius-panel); border-start-end-radius: var(--radius-panel); box-shadow: var(--shadow-drawer); padding-block-end: env(safe-area-inset-bottom, 0px); transition: block-size var(--dur-panel) var(--ease-drawer); }
html[data-layout="drawer"] .page { inset: 0 0 var(--dock-room, 0px) 0; padding: max(var(--space-5), env(safe-area-inset-top, 0px)) var(--c-screen-margin) var(--space-5); transition: inset-block-end var(--dur-panel) var(--ease-drawer); }
html[data-layout="drawer"][data-drawer-drag] :is(.tools, .page) { transition: none; }
html[data-layout="drawer"] .sheet-head { cursor: grab; touch-action: none; }
html[data-layout="drawer"] :is(#sheetHide, .show) { display: none; }
@media (prefers-reduced-motion: reduce) { html[data-layout="drawer"] :is(.tools, .page) { transition: none; } }

/* The side sheet: from the trailing edge at half the pane. Hide folds it to an edge tab. */
html[data-layout="sheet"] .tools { inset-block: var(--c-screen-margin); inset-inline-end: max(var(--c-screen-margin), env(safe-area-inset-right, 0px)); inline-size: calc(50% - var(--c-screen-margin)); border-radius: var(--radius-panel); box-shadow: var(--shadow-overlay); overflow: hidden; }
html[data-layout="sheet"] .page { inset: 0 50% 0 0; padding: var(--space-5) var(--space-5) var(--space-5) max(var(--space-5), env(safe-area-inset-left, 0px)); }
html[data-layout="sheet"] .edge-pill-top { display: none; }
html[data-layout="sheet"][data-tools="hidden"] .tools { display: none; }
html[data-layout="sheet"][data-tools="hidden"] .page { inset-inline-end: var(--c-edge-tab-w); }
/* Physical insets: in vertical writing the tab's own inline axis runs down the screen. */
html[data-layout="sheet"] .show { writing-mode: vertical-rl; inset: 50% 0 auto auto; translate: 0 -50%; block-size: var(--c-edge-tab-w); padding: var(--space-3) 0; border-inline-end: 0; border-start-end-radius: 0; border-end-end-radius: 0; }
}
</style>
<style>
/* The demo's stage: one card option wide, the panel and the dock where the mockup puts them. */
body { min-block-size: 0; background: var(--surface-recess); overflow: hidden; }
.stage { position: relative; inline-size: 100%; block-size: 300px; }
.say { position: absolute; inset-block-start: var(--space-3); inset-inline-start: var(--space-3); margin: 0; font: var(--type-meta); color: var(--ink-muted); }
html[data-layout="desk"] .stage .panel { position: absolute; inset: 44px var(--space-5) auto auto; inline-size: var(--w, 172px); block-size: var(--h, 140px); max-block-size: none; clip-path: none; }
.stage .panel .graph { flex: 1 1 auto; block-size: auto; cursor: default; }
.stage .dock { position: absolute; inset: auto var(--space-5) var(--space-5) var(--space-3); block-size: var(--dh, 64px); padding: var(--space-3); opacity: 1; transform: none; filter: none; pointer-events: auto; }
.stage .dock .row { block-size: var(--c-pill-h); border-radius: var(--radius-xs); background: var(--surface-fill); box-shadow: inset 0 0 0 1px var(--border-row-outline); inline-size: 60%; }
</style></head>
<body><div class="stage" id="stage">
<p class="say" id="say">At rest</p>
<aside class="tool panel" id="panel" data-open="true" aria-label="A resizable panel">
  <div class="graph"></div>
  <div class="sash sash-w" data-edge="w"></div><div class="sash sash-h" data-edge="h"></div><div class="sash sash-c" data-edge="wh"></div>
  <span class="lit" data-arm="w"></span><span class="lit" data-arm="h"></span>
  <span class="bead" data-arm="w"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg></span><span class="bead" data-arm="h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M9 6l3-3 3 3M9 18l3 3 3-3"/></svg></span><span class="bead" data-arm="wh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L19 5M5 14v5h5M14 5h5v5"/></svg></span>
</aside>
<section class="tool dock" id="dock" data-open="true" aria-label="A resizable dock">
  <div class="sash sash-d" data-edge="d"></div><span class="lit" data-arm="d"></span><span class="bead" data-arm="d"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M9 6l3-3 3 3M9 18l3 3 3-3"/></svg></span>
  <div class="row"></div>
</section>
</div>
<script>
const $ = (id) => document.getElementById(id), root = document.documentElement, panel = $("panel"), dock = $("dock");
const px = (n) => parseFloat(getComputedStyle(root).getPropertyValue(n)) || 0;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const W0 = 172, H0 = 140, D0 = 64;
let w = W0, h = H0, d = D0;
const size = () => { root.style.setProperty("--w", w + "px"); root.style.setProperty("--h", h + "px"); root.style.setProperty("--dh", d + "px"); };
// Where along an arm the light (and the bead's knob) stands: the pointer's place, 16px clear of the corners.
function aim(owner, edge, y, x) {
  const b = owner.getBoundingClientRect(), R = px("--radius-panel"), clear = px("--c-edge-pull");
  for (const arm of edge === "wh" ? ["w", "h"] : [edge]) {
    const lit = owner.querySelector('.lit[data-arm="' + arm + '"]'), bead = owner.querySelector('.bead[data-arm="' + arm + '"]');
    const len = arm === "w" ? b.height : b.width;
    const along = edge === "wh" ? (arm === "w" ? len - R : R) : arm === "w" ? y - b.top : x - b.left;
    const at = clamp(along, R + clear, len - R - clear);
    lit.style.setProperty("--at", Math.round(at) + "px");
    if (bead && edge !== "wh") bead.style.translate = arm === "w" ? "0 " + Math.round(at - len / 2) + "px" : Math.round(at - len / 2) + "px 0";
  }
}
// The loop: rest, pointing at the width edge, dragging it wider, letting go; then the dock's top edge.
const steps = [
  ["rest", 1100, () => {}],
  ["hover", 1300, () => { const s = panel.querySelector(".sash-w"), b = s.getBoundingClientRect(); aim(panel, "w", b.top + b.height * 0.45, 0); s.classList.add("demo-hover"); }],
  ["drag", 1100, () => { panel.dataset.resizing = "w"; let t0 = null; const go = (t) => { t0 ??= t; const k = Math.min(1, (t - t0) / 700); w = Math.round(W0 + 44 * k); size(); if (k < 1 && loop) requestAnimationFrame(go); }; requestAnimationFrame(go); }],
  ["release", 1200, () => { delete panel.dataset.resizing; panel.querySelector(".sash-w").classList.remove("demo-hover"); }],
  ["hover", 1100, () => { const s = dock.querySelector(".sash-d"), b = s.getBoundingClientRect(); aim(dock, "d", 0, b.left + b.width * 0.5); s.classList.add("demo-hover"); }],
  ["drag", 900, () => { dock.dataset.resizing = "d"; let t0 = null; const go = (t) => { t0 ??= t; const k = Math.min(1, (t - t0) / 600); d = Math.round(D0 + 28 * k); size(); if (k < 1 && loop) requestAnimationFrame(go); }; requestAnimationFrame(go); }],
  ["release", 1300, () => { delete dock.dataset.resizing; dock.querySelector(".sash-d").classList.remove("demo-hover"); w = W0; d = D0; setTimeout(size, 600); }],
];
let loop = true, i = 0, timer = null;
const say = (k) => { $("say").textContent = {"rest":"At rest","hover":"Pointing at the edge","drag":"Dragging it wider","release":"Let go","yours":"Your turn: point at an edge, then drag it"}[k]; };
function next() { if (!loop) return; const [k, ms, fn] = steps[i]; say(k); fn(); i = (i + 1) % steps.length; timer = setTimeout(next, ms); }
next();
// The pointer comes in: the loop stops where it is, and the edges are the person's.
$("stage").addEventListener("pointerenter", () => {
  if (!loop) return;
  loop = false; clearTimeout(timer);
  for (const s of document.querySelectorAll(".demo-hover")) s.classList.remove("demo-hover");
  delete panel.dataset.resizing; delete dock.dataset.resizing; w = W0; h = H0; d = D0; size(); say("yours");
});
for (const sash of document.querySelectorAll(".sash")) {
  const edge = sash.dataset.edge, owner = sash.closest(".tool");
  sash.addEventListener("pointermove", (e) => { if (!owner.dataset.resizing) aim(owner, edge, e.clientY, e.clientX); });
  sash.addEventListener("pointerdown", (e) => {
    if (loop) return;
    e.preventDefault(); sash.setPointerCapture(e.pointerId);
    const x0 = e.clientX, y0 = e.clientY, w0 = w, h0 = h, d0 = d;
    owner.dataset.resizing = edge; root.dataset.resizing = edge;
    sash.onpointermove = (ev) => { if (edge === "d") d = clamp(d0 - (ev.clientY - y0), 48, 140); else { if (edge.includes("w")) w = clamp(w0 + x0 - ev.clientX, 120, 240); if (edge.includes("h")) h = clamp(h0 + ev.clientY - y0, 90, 170); } size(); };
    sash.onpointerup = sash.onpointercancel = () => { sash.onpointermove = null; delete owner.dataset.resizing; delete root.dataset.resizing; };
  });
}
size();
</script></body></html>
