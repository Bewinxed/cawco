<body>
  <!-- The pages under review: one per component, drawn by app.js. Below the line where they all fit, the tabs
       show one; from there they stand in one row (all-components-design.md). Over them, the round's one open
       choice for the owner (round 29): how a clip's kind is dressed. -->
  <main class="page" id="page">
    <div class="review-bar" role="group" aria-labelledby="kindsLabel">
      <span class="review-label" id="kindsLabel">Clip kinds</span>
      <div class="t-tabs" id="kinds" role="tablist" aria-labelledby="kindsLabel"><span class="t-tabs-pill" aria-hidden="true"></span><button class="t-tab" role="tab" type="button" data-kinds="hue" aria-selected="true" aria-describedby="kindsNote" title="In their own hue"><span class="t-label">In their own hue</span><span class="badge proposal">Proposed</span></button><button class="t-tab" role="tab" type="button" data-kinds="ink" aria-selected="false" title="In ink only"><span class="t-label">In ink only</span></button></div>
      <!-- The six kind hues are the mockup's own, not the house's: picking hue is picking them too. -->
      <p class="review-note" id="kindsNote">Own hue uses six proposed colours, one per kind. Picking it adds them to the design tokens.</p>
    </div>
    <div class="pages" id="pages"></div>
  </main>

  <!-- The tool. At a desk its two surfaces stand apart (the panel at the side, the dock at the foot) and this
       wrapper draws nothing; on a phone, a portrait tablet or a short window it is one drawer or side sheet,
       its head naming the kept state and switching between the two faces. -->
  <div class="tools" id="tools" data-face="graph" data-stop="peek">
    <header class="sheet-head" id="sheetHead">
      <span class="edge-pill edge-pill-top" aria-hidden="true"></span>
      <button class="sheet-title" id="sheetTitle" type="button"><span class="sheet-title-text"><b>Design graph</b> · <span id="sheetState"></span></span></button>
      <div class="t-tabs faces" id="faces" role="tablist" aria-label="Show"><span class="t-tabs-pill" aria-hidden="true"></span><button class="t-tab" role="tab" data-face="graph" title="Graph"><span class="t-label">Graph</span></button><button class="t-tab" role="tab" data-face="move" title="Timeline"><span class="t-label">Timeline</span></button></div>
      <button class="icon-btn hide-btn" id="sheetHide" type="button" aria-label="Hide graph"></button>
    </header>

    <aside class="tool panel" id="panel" data-open="true" aria-label="Design graph">
      <!-- The panel's surface (round 29, section D): its fill, edge and shadow. Hide folds this one box into
           the 36px tab tucked at the screen's trailing edge, and then it is the tab: a press on it is Show. -->
      <button class="panel-shell" id="shell" type="button" tabindex="-1" aria-hidden="true" aria-label="Show graph" data-tip="Show graph (H)"><span class="tab-glyph" data-icon="graph"></span></button>
      <div class="toolbar">
        <div class="t-tabs" id="tabs" role="tablist" aria-label="Components"><span class="t-tabs-pill" aria-hidden="true"></span></div>
        <div class="bar-end" id="barEnd"></div>
      </div>
      <!-- One section per component: its name, its own zoom and Outline, its graph and its dials. -->
      <div class="graphs" id="graphs"></div>
      <!-- Resizing (round 29, section A): 8px bands on the leading edge and the foot take a pointer; the corner
           square is the one separator a key reaches. The arc is drawn in the corner that resizes. -->
      <div class="sash sash-w" id="sashW" aria-hidden="true" data-edge="w"></div>
      <div class="sash sash-h" id="sashH" aria-hidden="true" data-edge="h"></div>
      <div class="sash sash-c" id="sashC" role="separator" aria-label="Resize the graph panel" tabindex="0" data-edge="wh"></div>
      <svg class="arc" id="arcP" data-corner="bl" aria-hidden="true" focusable="false"><defs><linearGradient id="arcP-a" gradientUnits="userSpaceOnUse"></linearGradient><linearGradient id="arcP-b" gradientUnits="userSpaceOnUse"></linearGradient></defs><g><path class="arc-leg" data-leg="a" stroke="url(#arcP-a)"/><path class="arc-body"/><path class="arc-leg" data-leg="b" stroke="url(#arcP-b)"/></g></svg>
      <!-- Two graphs stacked: the foot edge between them splits their heights. -->
      <div class="sash sash-s" id="sashS" role="separator" aria-orientation="horizontal" aria-label="Split the graphs' heights" tabindex="0" data-edge="s"></div>
      <span class="lit" data-arm="s" aria-hidden="true"></span>
    </aside>

    <section class="tool dock t-panel-slide" id="dock" data-open="false" aria-label="The timeline">
      <div class="sash sash-d" id="sashD" aria-hidden="true" data-edge="d"></div>
      <div class="sash sash-dc" id="sashDC" role="separator" aria-orientation="horizontal" aria-label="Resize the timeline" tabindex="0" data-edge="d"></div>
      <svg class="arc" id="arcD" data-corner="tr" aria-hidden="true" focusable="false"><defs><linearGradient id="arcD-a" gradientUnits="userSpaceOnUse"></linearGradient><linearGradient id="arcD-b" gradientUnits="userSpaceOnUse"></linearGradient></defs><g transform="scale(-1 -1)"><path class="arc-leg" data-leg="a" stroke="url(#arcD-a)"/><path class="arc-body"/><path class="arc-leg" data-leg="b" stroke="url(#arcD-b)"/></g></svg>
      <div class="dock-body" id="dockBody"></div>
    </section>
  </div>
  <!-- The side sheet's way back once folded: the same tucked tab, at the screen's trailing edge. -->
  <button class="show" id="show" type="button" aria-label="Show graph" data-tip="Show graph (H)" hidden><span data-icon="graph"></span></button>

  <div class="tip" id="tip" role="tooltip"></div>
<script>
