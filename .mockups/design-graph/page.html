    --ink-solid: var(--neutral-12);

    /* Focus: one 2px coral ring, keyboard focus only. */
    --focus-ring: light-dark(oklch(55% 0.165 33), oklch(76% 0.12 34));
    /* Selection: coral tint. */
    --selection: light-dark(
      oklch(64.5% 0.175 33 / 0.2),
      oklch(64.5% 0.175 33 / 0.3)
    );
    /* Status: four hues and a hueless idle (idle carries no fill). Needs-you is spark yellow, the one status that asks for a person. */
    --status-live-bg: color-mix(in oklab, var(--info-3) 76%, var(--info-9));
    --status-attn-bg: light-dark(oklch(91% 0.115 95), oklch(37% 0.07 92));
    /* A task's needs section (TaskNeeds): the attention tint at a little under half, laid on the raised surface the task stands on. */
    --needs-ground: color-mix(
      in oklab,
      var(--status-attn-bg) 45%,
      var(--surface-raised)
    );
    /* The picked card among an account's routing strategies (StrategyPicker): the selection's tint at a little under half, laid on the raised surface. */
    --strategy-card-picked: color-mix(
      in oklab,
      var(--selected-bg) 45%,
      var(--surface-raised)
    );
    --status-done-bg: color-mix(
      in oklab,
      var(--success-3) 76%,
      var(--success-9)
    );
    --status-fail-bg: light-dark(
      color-mix(in oklab, var(--error-3) 76%, var(--error-9)),
      color-mix(in oklab, var(--error-3) 68%, var(--error-9))
    );
    --status-idle-bg: transparent;
    --status-live-ink: color-mix(
      in oklab,
      var(--info-11) 76%,
      var(--neutral-12)
    );
    --status-attn-ink: light-dark(oklch(35% 0.075 88), oklch(90% 0.115 95));
    --status-done-ink: color-mix(
      in oklab,
      var(--success-11) 76%,
      var(--neutral-12)
    );
    --status-fail-ink: color-mix(
      in oklab,
      var(--error-11) 76%,
      var(--neutral-12)
    );
    --status-idle-ink: var(--neutral-11);
    /* Status glyphs: the hue itself, not the near-black text ink, so a row's state reads in colour at a glance. Each holds 3:1 or more (non-text) on raised, page, fill, hover, the selected wash and the needs-you wash, in both themes; idle stays neutral. */
    --status-live-glyph: light-dark(oklch(50% 0.15 252), oklch(74% 0.12 245));
    --status-attn-glyph: light-dark(oklch(57% 0.125 78), oklch(87% 0.14 92));
    /* A session tab's rim when it needs you: the attention glyph's hue and chroma, darker by day, where the glyph's own tone holds only 3.2:1 against the shelf even whole, so a rim mixed from it cannot hold 3:1 and stay quieter than the chosen tab's. By night the glyph's own. */
    --tab-rim-attn: light-dark(oklch(48% 0.125 78), oklch(87% 0.14 92));
    --status-done-glyph: light-dark(oklch(52% 0.14 140), oklch(76% 0.15 135));
    --status-fail-glyph: light-dark(oklch(53% 0.19 22), oklch(71% 0.16 20));
    --status-idle-glyph: var(--neutral-11);
    /* The nesting lines' ink (.kit-nest, WorkflowRail): one opaque neutral, about 2.3:1 to 2.5:1 against the sidebar and the phone home in both themes (a little past step 8 in light, between steps 7 and 8 in dark). A step lighter than the 3:1 it stood at, which read as heavy; never a faint hairline, and never an alpha, so two strokes that cross are the colour of one. */
    --nest-ink: light-dark(
      color-mix(in oklch, var(--neutral-8) 85%, var(--neutral-9)),
      color-mix(in oklch, var(--neutral-7) 50%, var(--neutral-8))
    );
    /* Usage meters (DESIGN.md, Limit bar: a fill in the window's state colour): a window with room is the muted ink on the control-edge groove (a quiet reading is a healthy one, and coral is the action's, never data: DESIGN.md The Coral Is Where You Act Rule), spark yellow one near its limit (70% used, or a run-out under an hour away), crimson one from 90%. The calm fill holds about 4.7:1 on its track by day and 5:1 at night. */
    --meter-calm: var(--neutral-11);
    /* The calm meter's groove: the ring's empty track (border-control). */
    --meter-calm-track: var(--border-control);
    --meter-near: light-dark(oklch(62% 0.135 88), oklch(86% 0.14 95));
    --meter-near-track: light-dark(oklch(69.5% 0.095 90), oklch(53% 0.08 92));
    --meter-over: light-dark(oklch(50% 0.17 15), oklch(68% 0.16 15));
    --meter-over-track: light-dark(oklch(72% 0.08 15), oklch(53% 0.09 15));
    --meter-stale: light-dark(oklch(56% 0.012 265), oklch(64% 0.01 265));
    --meter-stale-track: light-dark(oklch(75% 0.008 265), oklch(45% 0.008 265));
    /* The one neutral the usage breakdown and history bars draw in. */
    --meter-share: light-dark(oklch(55% 0.012 265), oklch(72% 0.01 265));
    /* A near or over row's only tint: a faint wash of its status ink (owner: "the tints for yellow/red are too overwhelming"). */
    --meter-wash-near: light-dark(
      color-mix(in oklch, var(--status-attn-ink) 6%, transparent),
      color-mix(in oklch, var(--status-attn-ink) 10%, transparent)
    );
    --meter-wash-over: light-dark(
      color-mix(in oklch, var(--status-fail-ink) 6%, transparent),
      color-mix(in oklch, var(--status-fail-ink) 10%, transparent)
    );
    --presence-online: light-dark(oklch(62.7% 0.17 149), oklch(74% 0.17 149));
    --presence-away: light-dark(oklch(70.5% 0.187 47.6), oklch(76% 0.187 47.6));
    --presence-off: var(--neutral-8);
    /* Every scrollbar's thumb, inherited from the root. */
    --scrollbar-thumb: oklch(from var(--muted-foreground) l c h / 0.35);
    /* The band of raised surface that crosses a skeleton once per loop. */
    --skeleton-sheen: oklch(from var(--surface-raised) l c h / 0.6);
    /* List bullets in rendered markdown. */
    --prose-bullet: oklch(from var(--muted-foreground) l c h / 0.55);
    /* Project identity ink at hue 0; the identity-ink utility turns it to the project's --identity-h. 48%, not 50%: on a row's hover surface the cyan end of the wheel fell to 4.39:1 at 50%, and 48% holds every one of the ten hues above 4.5:1. */
    --identity-ink: light-dark(oklch(48% 0.12 0), oklch(74% 0.11 0));
    /* A machine that is not online: between the mid and muted neutrals. */
    --machine-offline: color-mix(
      in oklab,
      var(--neutral-8) 62%,
      var(--neutral-11)
    );
    /* Data colour: chroma survives in numerals. */
    --data-ok: light-dark(
      oklch(from var(--success-9) 46% 0.125 h),
      oklch(from var(--success-9) 78% 0.135 h)
    );
    --data-warn: light-dark(
      oklch(from var(--warning-9) 46% 0.125 h),
      oklch(from var(--warning-9) 80% 0.13 h)
    );
    --data-bad: light-dark(
      oklch(from var(--error-9) 46% 0.135 h),
      oklch(from var(--error-9) 81% 0.13 h)
    );
    /* A diff's added row, over code-bg. */
    --diff-add-bg: oklch(from var(--success-9) l c h / 0.15);
    /* A diff's removed row, over code-bg. */
    --diff-del-bg: oklch(from var(--error-9) l c h / 0.15);
    /* The words an added row changed, over diff-add-bg. */
    --diff-add-emphasis: oklch(from var(--success-9) l c h / 0.1);
    /* The words a removed row changed, over diff-del-bg. */
    --diff-del-emphasis: oklch(from var(--error-9) l c h / 0.1);
    /* Release-note section labels (ReleaseNotes): New green, Improved cyan, Fixed amber. Each ink sits on its own faint fill at 4.5:1 or more in both themes. */
    --note-new-ink: light-dark(oklch(44% 0.11 149), oklch(86% 0.12 149));
    --note-new-bg: light-dark(oklch(95% 0.04 149), oklch(31% 0.055 149));
    --note-improved-ink: light-dark(oklch(44% 0.1 225), oklch(86% 0.1 225));
    --note-improved-bg: light-dark(oklch(95% 0.035 225), oklch(31% 0.05 225));
    --note-fixed-ink: light-dark(oklch(46% 0.1 70), oklch(87% 0.13 79));
    --note-fixed-bg: light-dark(oklch(95% 0.05 85), oklch(32% 0.055 79));
    --chart-1: light-dark(var(--neutral-12), var(--neutral-11));
    --chart-brand: var(--coral-9);
    --chart-2: var(--info-9);
    --chart-3: var(--mark-7);
    --chart-4: var(--warning-9);
    --chart-5: var(--neutral-9);
    /* Syntax (code blocks and diffs). Every syntax token holds 4.5:1 or more on every ground a code surface draws: code-bg, a diff's added and removed rows (diff-add-bg, diff-del-bg) and their word emphasis over them (diff-add-emphasis, diff-del-emphasis), in both themes. */
    --code-ink: var(--ink-strong);
    --code-keyword: light-dark(oklch(45% 0.15 33), oklch(76% 0.12 34));
    --code-fn: light-dark(oklch(43% 0.1 245), oklch(80% 0.07 240));
    --code-string: light-dark(oklch(42% 0.105 122), oklch(84% 0.1 118));
    --code-number: light-dark(oklch(44% 0.115 55), oklch(84% 0.1 70));
    /* By day a step under ink-subtle's lightness, which reads 4.3:1 on a diff's tinted row; at night ink-subtle itself. */
    --code-comment: light-dark(oklch(43% 0.014 74), var(--ink-subtle));
    /* The transcript rail: one flat 2px line down a run of tool rows. An image, not a colour: rows paint it as a sized background layer (2px wide), and a colour would fill the whole row. Head and continuing rows paint the same, so no seam shows between them. */
    --rail: linear-gradient(
      oklch(from var(--neutral-11) l c h / 0.4),
      oklch(from var(--neutral-11) l c h / 0.4)
    );
    --rail-body: var(--rail);
    /* The transcript head's colour ramp, a mask over c-head-fade: how much of the chosen tab's sheet (tab-sheet) stands over the rows, inOutCubic(x) at each tenth of the band from its foot (x = 0, the gradient's end) to the strip's edge (x = 1, its start), the curve the head blur's slices are bounded on, so the blur and the colour arrive together. Flat at both ends: no line where the band starts on the rows, and none where it meets the tab's foot, where it is the sheet whole. */
    --head-tint-ramp: linear-gradient(
      rgb(0 0 0 / 1),
      rgb(0 0 0 / 0.996),
      rgb(0 0 0 / 0.968),
      rgb(0 0 0 / 0.892),
      rgb(0 0 0 / 0.744),
      rgb(0 0 0 / 0.5),
      rgb(0 0 0 / 0.256),
      rgb(0 0 0 / 0.108),
      rgb(0 0 0 / 0.032),
      rgb(0 0 0 / 0.004),
      rgb(0 0 0 / 0)
    );
    /* Chrome materials: structural translucency, never decoration. */
    --material-panel: oklch(from var(--surface-raised) l c h / 0.72);
    /* What a dialog's backdrop paints: the page itself, translucent. */
    --scrim: oklch(from var(--background) l c h / var(--scrim-mix));
    /* The 1px edge drawn inside a raster image (the brand row's icon), so it keeps its shape on any surface. Pure black by day and pure white at night, never a tinted neutral: a tint picks up the surface under it and reads as dirt on the image's edge. An image whose own edge is darker than the surface it sits on (the paywall's night film band on the raised sheet) takes it one width outside instead: inside, 10% white over its near-black edge comes out the surface's own colour and parts nothing. */
    --image-outline: light-dark(oklch(0 0 0 / 0.1), oklch(1 0 0 / 0.1));
    /* Elevation tints: warm ink by day, the deepest surface at night, never rgba black. */
    --shadow-tint: light-dark(
      oklch(from var(--neutral-12) l c h / 0.09),
      oklch(from var(--neutral-1) l c h / 0.55)
    );
    --shadow-tint-2: light-dark(
      oklch(from var(--neutral-12) l c h / 0.14),
      oklch(from var(--neutral-1) l c h / 0.66)
    );
    --shadow-tint-3: light-dark(
      oklch(from var(--neutral-12) l c h / 0.2),
      oklch(from var(--neutral-1) l c h / 0.76)
    );
    /* What a folder tab casts on the tab behind it (shadow-tab-start, shadow-tab-end): warm ink by day; at night the ink lit, since the tabs are the darkest surfaces and no shadow shows on them. */
    --tab-shade: light-dark(
      oklch(from var(--neutral-12) l c h / 0.24),
      oklch(from var(--neutral-12) l c h / 0.14)
    );
    /* What the chosen folder tab casts on the tabs behind it: tab-shade by day; nothing at night, where its sheet is the lightest of them and lit ink beside it would only blur its edge (its rim draws it). */
    --tab-shade-chosen: light-dark(var(--tab-shade), transparent);
    /* At night every raised shadow adds a 1px inner ring of ink. */
    --night-ring: light-dark(
      transparent,
      oklch(from var(--neutral-12) l c h / 0.07)
    );
    --shadow-xs: 0 1px 2px var(--shadow-tint);
    --shadow-tile:
      0 1px 2px
        light-dark(
          oklch(from var(--neutral-12) l c h / 0.07),
          oklch(0% 0 0 / 0.3)
        ),
      0 0 0 1px
        light-dark(
          oklch(from var(--neutral-12) l c h / 0.035),
          oklch(from var(--neutral-12) l c h / 0.06)
        );
    --shadow-raised:
      0 1px 3px var(--shadow-tint), 0 1px 1px var(--shadow-tint),
      inset 0 0 0 1px var(--night-ring);
    --shadow-hairline: 0 3px 7px -2px var(--shadow-tint-2);
    /* A stat tile's lift: drawn below the card, not around it; ringed at night. */
    --shadow-stat:
      0 3px 7px -2px var(--shadow-tint-2), inset 0 0 0 1px var(--night-ring);
    --shadow-md:
      0 3px 10px var(--shadow-tint-2), 0 1px 2px var(--shadow-tint),
      inset 0 0 0 1px var(--night-ring);
    --shadow-lg:
      0 10px 30px var(--shadow-tint-2), 0 3px 8px var(--shadow-tint),
      inset 0 0 0 1px var(--night-ring);
    --shadow-xl:
      0 24px 64px var(--shadow-tint-3), 0 6px 16px var(--shadow-tint),
      inset 0 0 0 1px var(--night-ring);
    --shadow-overlay:
      0 18px 48px var(--shadow-tint-3), 0 2px 6px var(--shadow-tint),
      inset 0 0 0 1px var(--night-ring);
    /* A hanging surface whose top shows its own surface across the cut into its anchor (Caw's panel, kit-hang): the overlay's drop without the night ring, which would draw across the cut as a seam. */
    --shadow-overlay-hung:
      0 18px 48px var(--shadow-tint-3), 0 2px 6px var(--shadow-tint);
    --shadow-modal: var(--shadow-overlay);
    --shadow-drawer: 0 12px 40px var(--shadow-tint-3);
    /* A drawn shape's drop (the grown composer), drawn as the SVG's own feDropShadow filters so it follows the shape, not a box, and is painted once rather than reapplied as the shape moves (grown.ts): this far layer, then shadow-drop-near. */
    --shadow-drop: 0 14px 28px var(--shadow-tint-2);
    --shadow-drop-near: 0 2px 4px var(--shadow-tint);
    /* A folder tab's edge on the tab behind it, at its leading side: one-sided, never above its top (PaneTabs .shade). */
    --shadow-tab-start: -2px 0 5px -1px var(--tab-shade);
    /* A folder tab's edge on the tab behind it, at its trailing side (PaneTabs .shade). */
    --shadow-tab-end: 2px 0 5px -1px var(--tab-shade);
    /* The chosen folder tab's edge on the tab behind it, at its leading side (PaneTabs .shade). */
    --shadow-tab-start-chosen: -2px 0 5px -1px var(--tab-shade-chosen);
    /* The chosen folder tab's edge on the tab behind it, at its trailing side (PaneTabs .shade). */
    --shadow-tab-end-chosen: 2px 0 5px -1px var(--tab-shade-chosen);
    --shadow-inset-sel: inset 0 1px 1px var(--shadow-tint);
    /* Shadow per surface level, paired with --surface-1…8. */
    --surface-shadow-1: none;
    --surface-shadow-2: var(--shadow-tile);
    --surface-shadow-3:
      0 1px 3px var(--shadow-tint), 0 1px 1px var(--shadow-tint),
      inset 0 0 0 1px var(--night-ring);
    --surface-shadow-4: var(--shadow-md);
    --surface-shadow-5:
      0 6px 18px var(--shadow-tint-2), 0 2px 4px var(--shadow-tint),
      inset 0 0 0 1px var(--night-ring);
    --surface-shadow-6: var(--shadow-lg);
    --surface-shadow-7:
      0 14px 40px var(--shadow-tint-3), 0 2px 6px var(--shadow-tint),
      inset 0 0 0 1px var(--night-ring);
    --surface-shadow-8: var(--shadow-overlay);
    /* The action's edge: a white top hairline and a coral-tinted drop. */
    --action-ring:
      inset 0 1px 0 oklch(100% 0 0 / 0.18),
      0 1px 2px light-dark(oklch(45% 0.12 33 / 0.25), oklch(0% 0 0 / 0.4));
    /* Inner vermillion ring and soft inner glow on code blocks. */
    --code-ring:
      inset 0 0 0 1px
        light-dark(oklch(58.5% 0.17 33 / 0.28), oklch(66% 0.16 34 / 0.32)),
      inset 0 1px 6px
        light-dark(oklch(58.5% 0.17 33 / 0.06), oklch(66% 0.16 34 / 0.1));
    --selected-shadow: none;
    /* The effort knob's and Browse's lifted block: a neutral-8 inner edge over shadow-raised's layers (DESIGN.md Effort chip). */
    --shadow-knob:
      inset 0 0 0 1px var(--neutral-8), 0 1px 3px var(--shadow-tint),
      0 1px 1px var(--shadow-tint), inset 0 0 0 1px var(--night-ring);
    /* Caw&Co wordmark: the approved landing's Nunito Variable face. */
    --font-wordmark: "Nunito Variable", ui-rounded, system-ui, sans-serif;
    /* Figtree for UI and transcript prose, 400 and 500 only. */
    --font-sans:
      "Figtree Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI",
      sans-serif;
    --font-body: var(--font-sans);
    /* JetBrains Mono for code, paths, IDs and measurements; ligatures off. */
    --font-mono: "JetBrains Mono Variable", ui-monospace, "SF Mono", monospace;
    /* Fredoka 600: brand display only. */
    --font-display:
      "Fredoka", "Figtree Variable", ui-rounded, system-ui, sans-serif;
    /* Figtree's cap height (0.703em). JetBrains Mono figures set beside Figtree words take it as `font-size-adjust: cap-height`, so their digits stand as tall as Figtree's at the same size step (unadjusted, Mono's stand 4% taller). */
    --mono-figure-cap: 0.703;
    /* The landing wordmark's variable-font weight. Brand only. */
    --weight-wordmark: 1000;
    /* The landing wordmark's tracking; the ampersand shares its face and size. */
    --track-wordmark: -0.045em;
    /* The six sizes text takes. Dense roles hold one size at every width; title and kpi scale with the viewport between 390 and 1024px. */
    --text-meta: 0.75rem;
    --text-label: 0.8125rem;
    --text-body: 0.875rem;
    /* Code runs a step under body: JetBrains Mono sets large. */
    --text-code: 0.75rem;
    --text-title: clamp(1.125rem, 1.048rem + 0.3155vi, 1.25rem);
    --text-kpi: clamp(1.25rem, 1.0962rem + 0.6309vi, 1.5rem);
    /* Brand and marketing only. */
    --text-display: 2.5rem;
    --leading-meta: 1.35;
    --leading-label: 1.3;
    --leading-tight: 1.2;
    --leading-ui: 1.25;
    --leading-body: 1.45;
    --leading-prose: 1.55;
    --leading-code: 1.6;
    --leading-kpi: 1;
    /* Tailwind preflight's root line height: what a row that sets no leading of its own inherits (the transcript's rail lines). */
    --leading-root: 1.5;
    /* A rendered document's running text (@tailwindcss/typography prose-sm, the project page's docs card): 24/14. */
    --leading-prose-sm: 1.7142857;
    /* The permission rule tester's preview of what a rule matches (RuleTester, Tailwind's relaxed). */
    --leading-relaxed: 1.625;
    /* prose-sm: above an h2, in the heading's own ems. */
    --prose-sm-title-before: 1.6;
    /* prose-sm: below an h1 or h2, in the heading's own ems. */
    --prose-sm-title-after: 0.8;
    /* prose-sm: above an h3, in the heading's own ems. */
    --prose-sm-h3-before: 1.5555556;
    /* prose-sm: below an h3, in the heading's own ems. */
    --prose-sm-h3-after: 0.4444444;
    /* prose-sm: above an h4 to h6, in the heading's own ems. */
    --prose-sm-h4-before: 1.4285714;
    /* prose-sm: below an h4 to h6, in the heading's own ems. */
    --prose-sm-h4-after: 0.5714286;
    /* prose-sm: above and below a blockquote, in the body's ems. */
    --prose-sm-quote: 1.3333333;
    /* prose-sm: a blockquote's text inset from its rule, in the body's ems. */
    --prose-sm-quote-inset: 1.1111111;
    /* prose-sm: above and below a horizontal rule, in the body's ems. */
    --prose-sm-rule: 2.8571429;
    /* prose-sm: a table's font size, in the body's ems. A hair over 12px of 14px, which is what makes a browser take the face's 3px descent up to 4. */
    --prose-sm-table-size: 0.8571429;
    --weight-body: 400;
    /* Nothing in product UI goes above 500. */
    --weight-strong: 500;
    --track-display: -0.008em;
    --track-title: -0.01em;
    --track-caps: 0.06em;
    /* A menu item's keyboard shortcut (the kit's command, dropdown and context menu shortcuts, Tailwind's widest). */
    --track-widest: 0.1em;
    /* How far under its words a text link's underline stands, when it is drawn (its hover). */
    --underline-offset: 3px;
    /* Role shorthands (font: var(--type-label)). A kpi figure is always .num: the shorthand resets font-variant-numeric. */
    --type-meta: 400 var(--text-meta) / 1.35 var(--font-body);
    --type-label: 500 var(--text-label) / 1.3 var(--font-body);
    --type-body: 400 var(--text-body) / 1.45 var(--font-body);
    --type-prose: 400 var(--text-body) / 1.55 var(--font-body);
    --type-button: 500 var(--text-body) / 1 var(--font-body);
    /* Set with its tracking: the web's `text-title` utility carries it (app.css @theme, `--text-title--letter-spacing`), and the native role carries the same token. */
    --type-title: 500 var(--text-title) / 1.25 var(--font-body);
    --type-kpi: 500 var(--text-kpi) / 1 var(--font-body);
    --type-code: 400 var(--text-code) / 1.6 var(--font-mono);
    --type-caps: 500 11px / 1 var(--font-body);
    /* The 16px Field Rule's floor: no field's text under it on a phone, so iOS Safari never zooms into one. */
    --text-field-floor: 16px;
    /* Measured off the comps, deliberately not a 4px ladder. Keep the odd values. */
    --space-1: 4px;
    --space-2: 7px;
    --space-3: 11px;
    --space-4: 14px;
    --space-5: 18px;
    --space-6: 21px;
    --space-7: 25px;
    --space-8: 32px;
    /* Between the groups of a page (stat row, queue, a card). */
    --space-group: var(--space-5);
    /* Between the rows of one list in the rail (the home's Working and Finished, a tree's children there): rows of one list, not separate things. */
    --space-row: 2px;
    /* Hair: chart swatches, a tooltip's arrow. */
    --radius-hair: 2px;
    /* Marks, tiles, badges, kbd; a menu's items, concentric in its 12px surface (less its 1px edge and 6px pad). */

    --tab-rim-mix-chosen: 0.97;

    --tab-rim-mix-idle: 0.86;

    --tab-rim-mix-subtle: 0.5;

    --dur-exit: 160ms;

    /* The grown composer folding back into its pill, shorter than its growth. */
    --dur-grow-exit: 220ms;

      background-color var(--dur-control) var(--ease-out),
      color var(--dur-control) var(--ease-out);
    /* The connection band (HubBand) sliding down from under the bar: its travel, fade and visibility on the panel's beat and the drawer curve, its tint and ink on the control's. */
    --transition-band-slide-show:
      translate var(--dur-panel) var(--ease-drawer),
      opacity var(--dur-panel) var(--ease-drawer), visibility var(--dur-panel),
      background-color var(--dur-control) var(--ease-out),
      color var(--dur-control) var(--ease-out);
    /* The connection band's row (HubBand) shutting as the band goes back up: its grid row on the exit's beat. */
    --transition-band-row-shut: grid-template-rows var(--dur-exit)
      var(--ease-out);
    /* The connection band's row (HubBand) opening from nothing as the band slides down: its grid row on the panel's beat and the drawer curve. */
    --transition-band-row-open: grid-template-rows var(--dur-panel)
      var(--ease-drawer);
  }

  :root.dark {
    --tab-rim-mix-chosen: 0.78;
    --tab-rim-mix-idle: 0.54;
    --breath-floor: 0.58;
    --glyph-duo-status-opacity: 0.46;
    --account-week-mix: 0.63;
  }

  @media (pointer: coarse) {
    :root {
      --c-tray-chip: 34px;
      --c-peek-glyph: var(--icon-lg);
      --c-tray-gap: var(--space-3);
      --c-menu-item-h: 44px;
    }
  }

  @media (pointer: coarse), (width < 640px) {
    :root {
      --c-nav-h: 44px;
      --c-rail-row-h: 44px;
    }
  }
}

<style>
/* The design graph mockup, round 22 (every screen), on CawCo's tokens (tokens.css above it, built from
   design/tokens). Every size, ink, radius, duration and curve is a token. The values in :root below are the
   designs' own and have no token yet; each is listed as a finding in the report. */
@layer mockup {
:root {
  color-scheme: light dark;
  -webkit-tap-highlight-color: transparent;
  /* resize-handle-design.md, "New, in the JSON first". */
  /* The drawer's grabber (its head's top edge), the one rest mark left from the pills. */
  --c-edge-grip-len: 36px;
  --c-edge-hit: var(--space-3);
  /* The split line's taper at each end. */
  --c-edge-lit-fade: 36px;
  /* Round 28: iPadOS 26's window handle, measured on Apple's own picture of it (support.apple.com 125309,
     its magnified corner) against that window's corner radius, then scaled to ours: an arc concentric with
     the corner, its centreline 0.198 R in from the edge, 0.111 R thick, sweeping 72.8° about the corner's
     diagonal, round caps. */
  --c-grip-inset: calc(var(--radius-panel) * 0.198);
  --c-grip-stroke: calc(var(--radius-panel) * 0.111);
  --c-grip-sweep: 72.8deg;
  /* Apple's handle is an opaque near-black (24, 24, 24) on its window, 8.7:1 against it. At rest ours stands
     at that same contrast on the raised surface, a mix of the strong ink into it; under the pointer and in a
     drag it brightens to the strong ink itself. (Apple: white on a dark window; the same 8.7:1 at night.) */
  /* 84% of the strong ink into the raised surface by day, 81% at night: both 8.7:1. */
  --c-grip-ink-rest: light-dark(color-mix(in oklab, var(--ink-strong) 84%, var(--surface-raised)), color-mix(in oklab, var(--ink-strong) 81%, var(--surface-raised)));
  /* My call: how far the held handle runs out along each edge before it has thinned to nothing. */
  --c-grip-run: 120px;
  /* Round 27, the designer's report: the kind-of-change hues on the tool-family formula (50% L / 0.12 C by
     day, 74% / 0.11 at night, none of the four status hues), and the kept region's band. */
  --c-section-band-h: 24px;
  --motion-enter: light-dark(oklch(50% 0.12 176), oklch(74% 0.11 176));
  --motion-change: light-dark(oklch(50% 0.12 253), oklch(74% 0.11 253));
  --motion-exit: light-dark(oklch(50% 0.12 330), oklch(74% 0.11 330));
  /* fable-timeline-design.md: "Name column 280px". */
  --dock-name-w: 280px;
  /* fable-timeline-design.md: "ew-resize on the 8px handle zones". */
  --bar-handle-zone: 8px;
  /* responsive-design.md, "Proposed tokens". The breakpoints (bp-short 560, bp-desk-wide 1800, bp-ultra
     2450) live in app.js's BP, which sets html[data-screen]; a media query can't read a custom property. */
  --c-graph-panel-w: 448px;
  --c-graph-panel-w-wide: 800px;
  /* r22 ruling call 3: the dock's ceiling leaves the page this much, its head and first field readable. */
  --c-page-h-floor: 240px;
  /* The kit's floating-surface pad (its menu), and One Target's gap round a bare element (the r21 ruling);
     neither has a token yet. */
  --c-floating-pad: 6px;
  --c-target-gap: 2px;
  --c-graph-drawer-stop: 45dvh;
  --c-review-max-w: 2000px;
  /* Phone landscape's collapsed sheet: "Hide collapses it to a 32px edge tab". */
  --c-edge-tab-w: 32px;
  /* The panel's width; a dragged width is set on html's own style and wins. */
  --panel-w: var(--c-graph-panel-w);
  /* One component from bp-ultra up: the whole layout stands in a 2000px column, centred, the gutter either
     side. A percentage, so each fixed box resolves it against the viewport it stands in. */
  --gutter: max(0px, (100% - var(--c-review-max-w)) / 2);
  --gutter-start: var(--gutter);
  --gutter-end: var(--gutter);
}
/* One component under review: the wide panel from bp-desk-wide. Two or more on screen at once: the 448 panel
   with the graphs stacked, or twice it with them side by side, and no 2000 cap (all-components-design.md). */
html:is([data-screen="wide"], [data-screen="ultrawide"]):not([data-multi]) { --panel-w: var(--c-graph-panel-w-wide); }
html[data-multi] { --panel-default: var(--c-graph-panel-w); --panel-w: var(--panel-default); }
html[data-multi][data-graphs="row"] { --panel-default: calc(2 * var(--c-graph-panel-w)); }
/* Every component at once (the r23 values ruling, call 2): the review block (the pages row and its margins,
   the panel and its margins) stands centred. The end gutter is fixed by the panel's default width, so a
   dragged panel keeps its trailing edge and the pages shift by the drag, wrapping only once the start gutter
   is spent. --row-w (the pages' row, from app.js) and its 18px margins either side; the panel's likewise. */
html[data-multi] {
  --gutter-end: max(0px, (100% - (var(--row-w) + 2 * var(--space-5)) - (var(--panel-default) + 2 * var(--space-5))) / 2);
  --gutter-start: max(0px, 100% - var(--gutter-end) - (var(--row-w) + 2 * var(--space-5)) - (var(--panel-w) + 2 * var(--space-5)));
}
/* More components than fit a row: the pages wrap and the block fills the pane. */
html[data-multi][data-wrapped] { --gutter-end: 0px; --gutter-start: 0px; }
* { box-sizing: border-box; }
body { margin: 0; min-block-size: 100dvh; font: var(--type-body); background: var(--surface-recess); color: var(--ink-strong); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
button { font: inherit; color: inherit; }

/* ---- The page under the tool: the component being judged ----
   It owns the room left of the panel and above the dock, and scrolls inside it, so the dock never covers it
   and nothing the tool does moves it. */
.page { position: fixed; inset-block: 0 var(--dock-room, 0px); inset-inline: var(--gutter-start) calc(var(--gutter-end) + var(--panel-w) + 2 * var(--space-5)); overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; padding: max(var(--space-8), env(safe-area-inset-top, 0px)) var(--space-5) var(--space-8); display: grid; justify-items: center; align-content: start; }
/* The pages: one row of 600px pages a margin apart, the spare width the recess; more than fit wrap. */
.pages { inline-size: 100%; display: flex; flex-wrap: wrap; justify-content: center; align-items: start; gap: var(--space-5); }
.stage-wrap { position: relative; flex: 0 1 auto; inline-size: min(100%, 600px); container: page / inline-size; }
.stage-wrap[hidden] { display: none; }
.frame { padding: var(--space-6); border: 1px solid var(--border-control); border-radius: calc(var(--mock-radius, 8px) + var(--space-1)); background: var(--surface-raised); box-shadow: var(--shadow-tile); }

.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); }
.line { margin: 0 0 var(--space-3); text-wrap: pretty; }

.actions { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: var(--space-2); }

/* A narrow page (a phone) gives the caption its own line over the buttons, rather than two squeezed beside
   them (the r24 review). */
@container page (width < 440px) { .actions .note { grid-column: 1 / -1; } .actions .btn { grid-row: 2; grid-column: 2; } .actions .btn.primary { grid-column: 3; } }
.btn { display: inline-flex; align-items: center; min-block-size: var(--c-btn-h-sm); padding: 0 var(--space-4); border: 1px solid var(--border-control); border-radius: var(--mock-radius, 8px); background: var(--surface-raised); color: var(--ink-strong); font: var(--type-button); white-space: nowrap; }
.btn.primary { background: var(--action-solid); border-color: var(--action-solid); color: var(--on-action); }
.done { padding: var(--space-5); border-radius: var(--radius-md); background: var(--surface-recess); }
.rlist { border: 1px solid var(--border-control); border-radius: calc(var(--mock-radius, 8px) + var(--space-1)); background: var(--surface-raised); box-shadow: var(--shadow-tile); }
.rrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-row) var(--space-3); align-items: center; padding: var(--mock-row-pad, 12px) var(--space-4); border-block-end: 1px solid var(--border-hairline); }
.rrow:last-child { border-block-end: 0; }

.rmeta { grid-column: 1; font: var(--type-meta); color: var(--ink-muted); }
.rstatus { grid-column: 1; font: var(--type-label); font-weight: var(--weight-body); }

/* Change marks (clarity §3 B, the owner's pick): while a hover previews a state that differs from the kept one,
   a wash over every value that came in or changed, and one where a value went, at its old box. */
.marks { position: absolute; inset: 0; pointer-events: none; }
.wash { position: absolute; opacity: 0; transition: opacity var(--dur-control) var(--ease-out); }
/* The wash is the fill; a 1px edge in its own hue's mark ink carries it at 3:1 against the field (the diff
   tints alone are 1.2:1). data-ok and data-bad are success-9's and error-9's hues; error-9 itself measures
   2.99:1 on its wash at night. */
.wash.add { background: var(--diff-add-bg); box-shadow: inset 0 0 0 1px var(--data-ok); }
.wash.del { background: var(--diff-del-bg); box-shadow: inset 0 0 0 1px var(--data-bad); }
.wash.in { opacity: 1; }

/* ---- The tool: the house floating panel ---- */
.tool { position: fixed; z-index: var(--layer-dock); color: var(--ink-strong); background: var(--surface-raised); border: 1px solid var(--border-control); box-shadow: var(--shadow-overlay); font: var(--type-label); font-weight: var(--weight-body); }

.panel { inset-block-start: max(var(--space-5), env(safe-area-inset-top, 0px)); inset-inline-end: calc(var(--gutter-end) + var(--space-5)); inline-size: var(--panel-w); max-block-size: calc(100dvh - 2 * var(--space-5)); display: flex; flex-direction: column; border-radius: var(--radius-panel); padding: var(--space-2); }
/* One row over the graph: the components' tabs, then the graph's zoom and Hide at the trailing end. */
/* It wraps (zoom and Hide to a line of their own, at the end) before the tabs would be cut. */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin-block-end: var(--space-2); }
.bar-end { display: flex; align-items: center; gap: var(--space-1); margin-inline-start: auto; flex: none; }
.graph { position: relative; flex: 0 1 auto; min-block-size: 0; block-size: var(--graph-h, 520px); overflow: auto; overscroll-behavior: contain; cursor: grab; border-radius: calc(var(--radius-panel) - var(--space-2)); background: var(--surface-well); border: 1px solid var(--border-well); }
.graph.panning { cursor: grabbing; }
.zoomer { position: relative; margin: 0 auto; }
.world { position: absolute; inset-inline-start: 0; inset-block-start: 0; transform-origin: 0 0; }
/* A machine: a statechart's parallel region, now a filled section (round 27, pin 30; Figma's labelled sections):
   the recess, a hairline, its name a header band in the label role. Its corner holds a node 8px in, so its
   radius is the node's plus that gap (The Concentric Rule). No dash: dashes mean "free" alone (finding 2). */

.region-name { display: flex; align-items: center; inline-size: 0; min-inline-size: calc(100% + 2 * var(--space-2)); min-block-size: var(--c-section-band-h); margin: calc(-1 * var(--space-2)) calc(-1 * var(--space-2)) var(--space-2); padding: 0 calc(var(--space-2) + var(--space-1)); border-start-start-radius: calc(var(--radius-panel) - 1px); border-start-end-radius: calc(var(--radius-panel) - 1px); font: var(--type-label); color: var(--ink-row); text-wrap: pretty; transition: background-color var(--dur-control) var(--ease-out); }
/* The machine that holds the kept state reads first: its band on the brand wash. */
.region.kept-region .region-name { background: var(--brand-wash); color: var(--brand-ink); }
.regionBody { position: relative; }
.world svg { position: absolute; inset-inline-start: 0; inset-block-start: 0; overflow: visible; pointer-events: none; }
.world svg path.edge { fill: none; stroke: var(--border-contrast); stroke-width: var(--c-graph-edge); stroke-linecap: round; stroke-linejoin: round; transition: stroke var(--dur-control) var(--ease-out), stroke-width var(--dur-control) var(--ease-out); }

/* Between machines: a dependency, a hairline with no head. */
.world svg.between path.edge { stroke: var(--border-hairline); }
/* An edge's label on its chip, on the path. */
.world svg .lchip { fill: var(--surface-raised); stroke: var(--border-hairline); stroke-width: 1; }
.world svg text { font: var(--type-label); font-weight: var(--weight-body); fill: var(--ink-row); }
/* The section strip: one chip per machine, standing right over the well (pin 30; outside its scroll, my call,
   so it never takes the view's room or rides the height edge). Edge fades inside the well say there is more. */
.secstrip { flex: none; display: flex; gap: var(--space-1); padding: 0 0 var(--space-1); overflow-x: auto; scrollbar-width: none; }
.gtop { position: sticky; inset-block-start: 0; inset-inline-start: 0; z-index: 2; block-size: var(--c-edge-fade-len); margin-block-end: calc(-1 * var(--c-edge-fade-len)); background: linear-gradient(var(--surface-well), transparent); pointer-events: none; opacity: 0; transition: opacity var(--dur-control) var(--ease-out); }

.secchip:focus-visible { outline: var(--focus-ring-width) solid var(--focus-ring); outline-offset: var(--focus-ring-inset); }
.gfoot { position: sticky; inset-block-end: 0; inset-inline-start: 0; block-size: var(--c-edge-fade-len); margin-block-start: calc(-1 * var(--c-edge-fade-len)); background: linear-gradient(transparent, var(--surface-well)); pointer-events: none; opacity: 0; transition: opacity var(--dur-control) var(--ease-out); }
.graph[data-fade~="foot"] .gfoot { opacity: 1; }
.world svg .disc { fill: var(--brand-ink-strong); }
/* A state: three tiers and one meaning for coral (clarity §1). */
.node { position: absolute; inline-size: var(--node-w, 168px); display: flex; flex-direction: column; gap: var(--space-row); padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); background: var(--surface-raised); border: 1px solid var(--border-control); box-shadow: var(--shadow-tile); cursor: pointer; transition: var(--transition-control); }
.node b { font: var(--type-label); color: var(--ink-strong); }
.node p { margin: 0; font: var(--type-meta); color: var(--ink-muted); text-wrap: pretty; }

.node.peek:not(.kept, .cur) { background: var(--surface-hover); }
.node.cur { background: var(--surface-pressed); border-color: var(--border-contrast); }
.node.kept { background: var(--selected-bg); border-color: var(--brand-solid); box-shadow: var(--selected-shadow); }
.node.kept b { color: var(--selected-ink); }

   once the fill has finished, so no frame sets an ink on a fill it doesn't hold 4.5:1 on. */
.node b, .node p { transition: color 0s linear var(--dur-control); }
.node.cur b, .node:is(.kept, .cur) p { transition: color 0s; }
.world[data-instant] :is(.node b, .node p) { transition: none; }
@media (prefers-reduced-motion: reduce) { .node b, .node p { transition: none; } }
.node.kept p, .node.cur p { color: var(--ink-row); }
.vars { display: flex; flex-direction: column; gap: var(--space-1); margin-block-start: var(--space-2); }
.var { all: unset; display: block; padding: var(--space-row) var(--space-2); border-radius: var(--radius-xs); font: var(--type-meta); color: var(--ink-row); border: 1px solid var(--border-control); background: var(--surface-raised); cursor: pointer; transition: var(--transition-control); }
@media (hover: hover) { .var:not(.kept, .cur):hover { background: var(--surface-hover); } }
.var.peek:not(.kept, .cur) { background: var(--surface-hover); }
/* A chip's tier is the chip's own fill, edge and ink, faded over --transition-control (the ruling: the
   mid-fade frame is accepted house-wide; no clip-path wipe). */
.var.kept { background: var(--chip-chosen-bg); border-color: var(--chip-chosen-bg); color: var(--chip-chosen-ink); }
.var.cur { background: var(--surface-pressed); border-color: var(--border-contrast); color: var(--ink-strong); }

   already drawn fades between them. */
.world[data-instant] :is(.node, .var) { transition: none; }
.var:focus-visible { outline: var(--focus-ring-width) solid var(--focus-ring); outline-offset: var(--focus-ring-offset); }

/* The zoom group: 24px items 2px in, so 5px + 2px + the 1px edge = the group's 8px (The Concentric Rule);
   the pad is derived, never --space-row. */
.zoom { display: flex; align-items: center; gap: var(--space-row); padding: calc(var(--radius-sm) - var(--radius-xs) - 1px); border-radius: var(--radius-sm); background: var(--surface-raised); border: 1px solid var(--border-control); }
.zoom output { min-inline-size: 4ch; text-align: center; }
.icon-btn { all: unset; box-sizing: border-box; display: grid; place-items: center; inline-size: var(--c-btn-h-xs); block-size: var(--c-btn-h-xs); border-radius: var(--radius-xs); color: var(--ink-row); cursor: pointer; transition: var(--transition-control); }
.icon-btn svg { inline-size: var(--icon-sm); block-size: var(--icon-sm); }
/* Hide: the kit's sm icon button (30px, the input's radius, the button outline), its glyph at --icon-md. */
.hide-btn { inline-size: var(--c-btn-h-sm); block-size: var(--c-btn-h-sm); border-radius: var(--radius-md); border: 1px solid var(--border-button-outline); color: var(--ink-row); }
.hide-btn svg { inline-size: var(--icon-md); block-size: var(--icon-md); }
@media (hover: hover) { .icon-btn:hover { background: var(--surface-hover); } }
.icon-btn:focus-visible { outline: var(--focus-ring-width) solid var(--focus-ring); outline-offset: var(--focus-ring-inset); }

/* A graph's section: its name in the label role and its own zoom group over it (shown with every graph on
   screen); below the line, the toolbar's tabs pick the one section shown. */
.graphs { display: flex; flex-direction: column; flex: 0 1 auto; min-block-size: 0; }
.gsec { display: flex; flex-direction: column; min-block-size: 0; }
html:not([data-multi]) .gsec:not([data-current]) { display: none; }
html:not([data-multi]) .gsec-head { display: none; }
.gsec-head { display: flex; align-items: center; gap: var(--space-2); margin-block-end: var(--space-2); }
.gsec-name { flex: 1 1 auto; min-inline-size: 0; margin: 0; padding-inline-start: var(--space-1); font: var(--type-label); color: var(--ink-strong); overflow-wrap: anywhere; text-wrap: balance; }
html[data-multi] .toolbar :is(#tabs, .bar-end > .zoom) { display: none; }
html[data-multi] .graphs { gap: var(--space-4); }
/* Stacked: the panel stands the pane's height and the two graphs share it, split by the first one's foot. */
html[data-graphs="stack"] .panel { block-size: calc(100dvh - 2 * var(--space-5)); }
html[data-graphs="stack"] .graphs { flex: 1 1 auto; }
html[data-graphs="stack"] .gsec:first-child { flex: none; }
html[data-graphs="stack"] .gsec:first-child .graph { flex: none; block-size: var(--split-h, 240px); }
html[data-graphs="stack"] .gsec:last-child { flex: 1 1 0; }
html[data-graphs="stack"] .gsec:last-child .graph { flex: 1 1 auto; block-size: auto; }
/* Its grips are the width edge and the split edge: no foot edge, no corner (the r23 values ruling, call 3). */
html[data-graphs="stack"] :is(.sash-h, .sash-c) { display: none; }
/* Side by side past bp-ultra: each graph its own column at the panel's graph height. */
html[data-graphs="row"] .graphs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--space-3); }
/* No handle stands inside the panel's corner any more, so the dials start a step in like everything else
   (round 27, finding 1). */
/* (My call over the designer's --space-1: the corner's hit square reaches 16px in on a fine pointer and 22px
   under a finger; the dials start just clear of it, so no label stands under the corner grip.) */
.dials { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; column-gap: var(--space-3); row-gap: var(--space-1); align-items: center; padding: var(--space-2) 0 0 calc(var(--c-side-divider-hit) / 2 - var(--space-2)); }
.dial { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; align-items: center; }
.dial > span:first-child { color: var(--ink-row); }
/* A dial's value is a Measured figure in full ink, its unit after it in meta (pin 27). */
.dial output { text-align: end; white-space: nowrap; }
.dial input[type="range"] { inline-size: 100%; margin: 0; accent-color: var(--ink-solid); }

/* ---- Resizing the panel: marked edges (resize-handle-design.md) ----
   Hit bands straddle the edge and take no room: 4px outside, the 1px border, 6px of the 7px padding. */
.sash { position: absolute; z-index: 4; touch-action: none; }
.sash:focus-visible { outline: none; }
.sash-w { inset-block: var(--radius-panel); inset-inline-start: calc(-1 * (var(--space-1) + 1px)); inline-size: var(--c-edge-hit); cursor: ew-resize; }
.sash-h { inset-inline: var(--radius-panel); inset-block-end: calc(-1 * (var(--space-1) + 1px)); block-size: var(--c-edge-hit); cursor: ns-resize; }
.sash-c { inset-inline-start: calc(-1 * (var(--space-1) + 1px)); inset-block-end: calc(-1 * (var(--space-1) + 1px)); inline-size: calc(var(--radius-panel) + var(--space-1)); block-size: calc(var(--radius-panel) + var(--space-1)); cursor: nesw-resize; }
/* The split between stacked graphs: a band across the panel in the gap under the first graph (top set by
   app.js), its pill centred on it. */
.sash-s { inset-inline: var(--radius-panel); block-size: var(--c-edge-hit); cursor: ns-resize; }
html:is([data-input="touch"], [data-input="touch-hover"]) .sash-s { block-size: var(--c-side-divider-hit); }
/* The dock's height edge: the same band on its top border. */
.sash-d { inset-inline: var(--radius-panel); inset-block-start: calc(-1 * (var(--space-1) + 1px)); block-size: var(--c-edge-hit); cursor: ns-resize; }
/* Touch (any-pointer: coarse, set by app.js as html[data-input]): 44px bands straddling each edge. */
html:is([data-input="touch"], [data-input="touch-hover"]) .sash-w { inset-block: calc(var(--c-side-divider-hit) / 2); inset-inline-start: calc(-0.5px - var(--c-side-divider-hit) / 2); inline-size: var(--c-side-divider-hit); }
html:is([data-input="touch"], [data-input="touch-hover"]) .sash-h { inset-inline: calc(var(--c-side-divider-hit) / 2); inset-block-end: calc(-0.5px - var(--c-side-divider-hit) / 2); block-size: var(--c-side-divider-hit); }
html:is([data-input="touch"], [data-input="touch-hover"]) .sash-d { inset-inline: calc(var(--c-side-divider-hit) / 2); inset-block-start: calc(-0.5px - var(--c-side-divider-hit) / 2); block-size: var(--c-side-divider-hit); }
html:is([data-input="touch"], [data-input="touch-hover"]) .sash-c { inset-inline-start: calc(-0.5px - var(--c-side-divider-hit) / 2); inset-block-end: calc(-0.5px - var(--c-side-divider-hit) / 2); inline-size: var(--c-side-divider-hit); block-size: var(--c-side-divider-hit); }
/* Under a finger too the corner is a grip, its handle drawn (round 28: iPadOS's handle is a finger's first;
   the r23 "no corner on touch" ruling falls with the handle it served). */

/* ---- The resize handle (round 28): iPadOS 26's window handle ----
   One path per handle (app.js draws it as a filled ribbon round its centreline: every shape is the same
   list of points, so `d` interpolates point for point). At rest, the panel's is the short arc concentric with
   its resizing corner (iPadOS puts it at the corner that resizes: bottom-right on a window, bottom-left on
   one snapped right, as this panel stands); the dock's, the same stroke as a short capsule on its top edge.
   Pointing at an edge or the corner brightens it to the strong ink. A drag runs its stroke out along the
   edges it moves, thinning to nothing at the ends (pin 26), on one clock: out over --dur-reveal, back over
   --dur-exit (The Fast Exit Rule), both on --ease-out. No side edge carries a mark of its own (pin 25). */
@property --c-grip-inset { syntax: "<length>"; inherits: true; initial-value: 0px; }
@property --c-grip-stroke { syntax: "<length>"; inherits: true; initial-value: 0px; }
@property --c-grip-sweep { syntax: "<angle>"; inherits: true; initial-value: 0deg; }

/* The panel's at its border box's bottom-start corner, the dock's at the middle of its top edge. */
#gripC { inset-inline-start: -1px; inset-block-end: -1px; }
#gripD { inset-inline-start: 50%; inset-block-start: -1px; translate: -50% 0; }
@media (hover: hover) {
  .panel:has(.sash-w:hover, .sash-h:hover, .sash-c:hover) #gripC path,
  .dock:has(.sash-d:hover) #gripD path { fill: var(--ink-strong); }
}
/* The demo's pointer (#demo, handle-demo.html) is the hover's own state. */
.panel[data-pointing] #gripC path, .dock[data-pointing] #gripD path { fill: var(--ink-strong); }
.panel:is([data-resizing="w"], [data-resizing="h"], [data-resizing="wh"]) #gripC path,
.dock[data-resizing] #gripD path { fill: var(--ink-strong); transition: d var(--dur-reveal) var(--ease-out), fill var(--dur-control) var(--ease-out); }
.panel[data-resizing="w"] #gripC path { d: var(--grip-w); }

   nothing animates on a key). */
.panel:has(.sash-w:focus-visible) #gripC path { d: var(--grip-w); fill: var(--focus-ring); transition: none; }
.panel:has(.sash-h:focus-visible) #gripC path { d: var(--grip-h); fill: var(--focus-ring); transition: none; }
.panel:has(.sash-c:focus-visible) #gripC path { d: var(--grip-wh); fill: var(--focus-ring); transition: none; }

        </div>

  if (open && layoutIs("desk")) { for (const c of shownComps()) drawGraph(c.id); mark(); for (const c of shownComps()) showKept(c.id); placeSplit(); }
}
const toolsOpen = () => (layoutIs("drawer") ? stop !== "head" : panelOpen());
// At a desk the one button toggles: Hide folds the panel into it, Show opens it back out; its focus stays.
$("hide").onclick = () => { if (layoutIs("desk")) { setOpen(!panelOpen()); return; } setOpen(false); $("show").focus(); };
$("sheetHide").onclick = () => { setOpen(false); $("show").focus(); };
$("show").onclick = () => { setOpen(true); (layoutIs("sheet") ? $("sheetHide") : $("hide")).focus(); };

// ---- Keys ----
const typing = (el) => el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);
addEventListener("keydown", (e) => {
  const km = keptMove();
  if ((e.metaKey || e.ctrlKey) && (e.key === "z" || e.key === "Z") && km && !typing(document.activeElement)) {
    e.preventDefault();
    const st = e.shiftKey ? km.e.future : km.e.past, other = e.shiftKey ? km.e.past : km.e.future;
    if (!st.length) return;
    other.push(clone(km.e.cur)); km.e.cur = st.pop();
    afterEdit(km, { replay: false });
    return;
  }
  if (e.metaKey || e.ctrlKey || typing(document.activeElement)) return;
  if (e.key === "Escape" && pop && !menu) { e.preventDefault(); closeAndFocusBar(); return; }
  if ((e.key === "h" || e.key === "H") && !e.altKey) { setOpen(!toolsOpen()); return; }
  if (!km || !tl) return;
  if (e.key === " " && !(document.activeElement && (document.activeElement.tagName === "BUTTON" || (document.activeElement.closest && document.activeElement.closest(".panel, .pop, .menu, .show"))))) { e.preventDefault(); playing ? stopPlay() : play(); }
  else if (e.key === "Home" && !e.target.closest(".sash")) { stopPlayKeepTime(); time = 0; drawStage(); updateTime(); }
  else if (e.key === "End" && !e.target.closest(".sash")) { stopPlayKeepTime(); time = null; drawStage(); updateTime(); }
  else if (e.key === "," || e.key === ".") { stopPlayKeepTime(); const len = playLengthOf(km.r); time = clamp((time ?? lengthOf(km.r)) + (e.key === "." ? 10 : -10), 0, len); drawStage(); updateTime(); }
});

new ResizeObserver(() => sizeDockRoom()).observe($("dock"));
// A new size can be a new class: its layout is set first, then everything draws at it. A dragged dock height
// stays inside the new room; the drawer's stop is re-measured on the new height.
function onResize() {
  if (applyScreen()) { closePop(true); stopPlay(); if (layoutIs("desk")) $("tools").dataset.face = face = "graph"; }
  if (layoutIs("drawer")) setStop(stop);
  if (layoutIs("desk") && rootEl.style.getPropertyValue("--dock-h")) setDockH(parseFloat(rootEl.style.getPropertyValue("--dock-h")));
  if (layoutIs("drawer")) panel.dataset.open = "true";
  rootEl.dataset.tools = panelOpen() ? "open" : "hidden";
  $("show").hidden = panelOpen() || layoutIs("desk");
  if (!panelOpen() && layoutIs("desk")) panel.style.setProperty("--pill-clip", pillClip());
  render();
}
addEventListener("resize", onResize);
rootEl.dataset.tools = "open";
if (layoutIs("drawer")) setStop("peek");
setFace("graph");

// ---- The handle's demo (round 28) ----
// #demo=corner or #demo=dock (with &theme=dark for the night) plays the handle on this page's own elements on
// a loop for handle-demo.html, which shows it cropped at 1:1: at rest, the pointer arrives (data-pointing, the
// hover's own rule), a drag wider (the real data-resizing and the real setSize/setDockH), let go. The first
// real pointer on the page stops it where it is, and the page is the person's.
const demoOf = location.hash.match(/demo=(corner|dock)/);
if (demoOf) {
  const which = demoOf[1];
  rootEl.style.colorScheme = /theme=dark/.test(location.hash) ? "dark" : "light";
  // The dock stands once a state is kept: keep the first one, as a press on it would.
  if (which === "dock") { const n = document.querySelector(".node:not(.kept)"); if (n) n.click(); }
  const owner = which === "corner" ? panel : $("dock");
  let on = true, timer = null;
  const anchor = () => { const b = owner.getBoundingClientRect(); return which === "corner" ? { x: b.left, y: b.bottom } : { x: b.left + b.width / 2, y: b.top }; };
  const say = (step) => parent.postMessage({ demo: which, step, ...anchor() }, "*");
  const tween = (dur, set) => new Promise((done) => { let t0 = null; const go = (now) => { t0 ??= now; const k = Math.min(1, (now - t0) / dur); set(1 - (1 - k) ** 3); if (k < 1 && on) requestAnimationFrame(go); else done(); }; requestAnimationFrame(go); });
  const w0 = panel.offsetWidth, h0 = graphOf(tab).offsetHeight, d0 = () => $("dock").offsetHeight;
  let dock0 = null;
  const steps = [
    ["rest", 1200, () => {}],
    ["pointing", 1000, () => { owner.dataset.pointing = ""; }],
    ["drag", 1300, () => {
      if (which === "corner") { panel.dataset.resizing = rootEl.dataset.resizing = "wh"; tween(800, (e) => setSize(w0 + 40 * e, h0 + 30 * e)); }
      else { dock0 ??= d0(); $("dock").dataset.resizing = rootEl.dataset.resizing = "d"; tween(800, (e) => setDockH(dock0 + 40 * e)); }
    }],
    ["release", 1400, () => { delete owner.dataset.resizing; delete rootEl.dataset.resizing; delete owner.dataset.pointing; }],
    ["reset", 700, () => { if (which === "corner") tween(500, (e) => setSize(w0 + 40 * (1 - e), h0 + 30 * (1 - e))); else tween(500, (e) => setDockH(dock0 + 40 * (1 - e))); }],
  ];
  let i = 0;
  const next = () => { if (!on) return; const [k, ms_, fn] = steps[i]; fn(); say(k); i = (i + 1) % steps.length; timer = setTimeout(next, ms_); };
  setTimeout(next, 300);
  addEventListener("pointerover", () => {
    if (!on) return;
    on = false; clearTimeout(timer);
    delete owner.dataset.pointing; delete owner.dataset.resizing; delete rootEl.dataset.resizing;
    if (which === "corner") setSize(w0, h0); else if (dock0) setDockH(dock0);
    relayoutAfterResize(); say("yours");
  }, { once: true });
}
render();
document.fonts.ready.then(() => { if (layoutIs("drawer")) setStop(stop); render(); });

</script></body></html>
