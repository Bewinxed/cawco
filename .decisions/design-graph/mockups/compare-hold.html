<style>
/* Its true width: below this the drawing keeps its size and its pane scrolls sideways. */
.mk-compare-hold { min-inline-size: 640px; }
.mk-compare-hold { padding-block-end: var(--space-2); }
</style>
<div class="mk mk-compare-hold gd" role="img" aria-label="With two edits made, holding the Original button plays the agent's timing and turns the edited bars to outlines; letting go returns to the edit."></div>
<script>
(() => {
  const root = document.querySelector(".mk-compare-hold");
  if (!root) return;
  const G = window.GD;
  const dock = G.dock({
    clips: [{ ...G.MOVE[0] }, { ...G.MOVE[1], at: "--dur-control", diffAt: true }, { ...G.MOVE[2], dur: "--dur-grow", diffDur: true }],
    headExtra: '<span class="dk-hold">Original</span><span class="dk-badge">2 edits</span><span class="dk-text">Reset</span>',
  });
  root.append(dock.el);
  dock.ghost("reveal", 60, 260); dock.ghost("fade", 60, 260);
  const cur = G.cursor(root), hold = dock.el.querySelector(".dk-hold");
  const within = (t, a, b) => t >= a && t < b, SLOW = 4;
  G.run(root, 6500, (t) => {
    const held = within(t, 1500, 4500);
    hold.classList.toggle("down", held);
    dock.el.querySelectorAll(".dk-bar").forEach((b) => b.classList.toggle("orig", held && b.closest('[data-key="reveal"], [data-key="fade"]')));
    dock.el.querySelectorAll(".dk-ghost").forEach((g) => g.classList.toggle("play", held));
    const ms = held ? Math.min(320, Math.max(0, (t - 1700) / SLOW)) : dock.total;
    dock.setT(ms, held ? 320 : dock.total); dock.playing(held && t >= 1700 && t < 1700 + 320 * SLOW);
    // The cursor shows only while it holds the button, its tip in the trailing corner, clear of the word.
    const [x, y] = G.at(root, hold, 0.92, 0.8);
    cur.set(x, y, "arrow", held, within(t, 1300, 4700));
  }, 2400);
  root.gdKeys = [600, 2400, 5000];
})();
</script>
