<style>
.mk-verdict-pins { display: grid; justify-items: center; gap: var(--space-3); }
/* A Comments row: your words, and under them the kept path the pin recorded. */
.mk-verdict-pins .vp { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-1) var(--space-2); inline-size: 100%; padding: var(--space-2) var(--space-3); border: 1px solid var(--border-hairline); border-radius: var(--radius-md); background: var(--surface-raised); }
.mk-verdict-pins .vp .gd-ic { inline-size: var(--icon-md); block-size: var(--icon-md); color: var(--ink-muted); margin-block-start: 1px; }
.mk-verdict-pins .vp p { margin: 0; min-inline-size: 0; text-wrap: pretty; }
.mk-verdict-pins .vp-w { font: 400 var(--text-label) / 1.3 var(--font-body); }
.mk-verdict-pins .vp-p { grid-column: 2; font: var(--type-meta); color: var(--ink-muted); }
</style>
<div class="mk mk-verdict-pins gd" role="img" aria-label="A pin placed while Save failed is kept: the Comments row shows your words, and under them the kept path, Saving it, Save failed, The hub didn't answer."></div>
<script>
(() => {
  const root = document.querySelector(".mk-verdict-pins");
  if (!root) return;
  const G = window.GD, n = G.M.save.nodes[3];
  root.append(
    G.node(`<div class="graph gd-side"><div class="world"><div class="node on"><b>${n.name}</b><p>${n.note}</p><div class="vars"><span class="var on">${n.vars[0]}</span><span class="var">${n.vars[1]}</span></div></div></div></div>`),
    G.node(`<div class="vp">${G.icon("chat")}<p class="vp-w">Wrong: the reason belongs under Delegate type.</p><p class="vp-p">Saving it › Save failed › The hub didn't answer</p></div>`),
  );
  G.run(root, 0, () => {}, 0);
})();
</script>
