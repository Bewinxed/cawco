; GTK_IM_MODULE: Chromium's input method is ibus's GTK module (ibus-gtk3, in
; the Dockerfile) with no ibus daemon, whatever the image's locale or other
; modules would pick. The view types every character no key of neko's layout
; has as GTK's Unicode entry, Ctrl+Shift+U, the hex code and Return
; (dashboard browser-stream.ts `unicodeEntry`). With no daemon the module
; hands each key to GTK's simple input method, which does the entry, and
; shows Chromium none of its preedit ("u", "ue9"), so Chromium holds the
; entry's keys back from the page (ibusimcontext.c
; `ibus_im_context_get_preedit_string`; Chromium input_method_auralinux.cc,
; "filtered && !HasInputMethodResult()"). GTK's simple input method alone
; shows its preedit, and the page gets a "Process" keydown for U and each
; digit. Held by scripts/browser-image-check.ts.
[program:chromium]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s",GTK_IM_MODULE="ibus"
command=/bin/sh -c 'rm -f /home/neko/.config/chromium/Singleton*; exec /usr/bin/chromium --no-sandbox --window-position=0,0 --display=%(ENV_DISPLAY)s --user-data-dir=/home/neko/.config/chromium --no-first-run --no-default-browser-check --start-maximized --disable-file-system --disable-gpu --disable-software-rasterizer --disable-dev-shm-usage --remote-debugging-port=9223 --remote-allow-origins=* --proxy-pac-url="$CAWCO_PAC_URL" ${CAWCO_HOST_RULES:+"--host-resolver-rules=$CAWCO_HOST_RULES"}'
stopsignal=INT
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/chromium.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true

[program:devtools]
command=/usr/bin/socat TCP-LISTEN:9222,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:9223
autorestart=true
priority=850
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/devtools.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=1
redirect_stderr=true

[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox --config-file /etc/neko/openbox.xml
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/openbox.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true
