<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Comments on a tablet · preview</title>
    <link href="./house.css" rel="stylesheet" />
    <link href="./preview.css" rel="stylesheet" />
    <script src="./preview.js" type="module"></script>
  </head>
  <body>
    <header class="bar">
      <h1>Comments on a tablet</h1>
      <p class="rule" data-slot="rule"></p>
    </header>

    <main class="stage">
      <p aria-live="polite" class="readout" data-slot="readout"></p>
      <div class="fit" data-slot="fit">
        <div class="frame" data-slot="frame"></div>
      </div>
      <p class="note">
        The page in the well is the comment-sizing preview, and its two
        comments are the real ones, read from the hub. Press a row or a pin to
        open its thread; Close, Back and Esc put it away. Resolve, Delete,
        More, Sort, + and Reply are drawn, not wired.
      </p>
    </main>
  </body>
</html>
