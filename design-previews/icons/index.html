<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover"
      name="viewport"
    />
    <title>Pick</title>
    <link href="data:," rel="icon" />
    <!-- The house tokens, copied from apps/dashboard/src/lib/tokens/tokens.css
         (generated from design/tokens/cawco.tokens.json). -->
    <link href="tokens.css" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--surface-recess);
        color: var(--ink-strong);
        font-family: var(--font-sans);
        font-size: var(--text-body);
        line-height: var(--leading-body);
        -webkit-tap-highlight-color: transparent;
      }
      button {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
      }
      main {
        /* Wide enough for three options side by side (3 × 342 + 2 gaps + pads). */
        max-width: 1100px;
        margin: 0 auto;
        padding: calc(var(--space-3) + env(safe-area-inset-top))
          var(--space-4) calc(var(--space-7) + env(safe-area-inset-bottom));
      }
      /* One row: Back, a bare chevron in its glass, then where he is. */
      .bar {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        min-height: 36px;
        margin: 0 0 var(--space-2);
      }
      /* Back: the chevron alone, no disc or fill at rest or under the
         pointer; its 44px tap area is the button's own box, unpainted, the
         chevron's ink alone answering hover. Its start pulls back by what
         the box holds round the chevron, so the glyph stands on the text edge. */
      .back {
        display: grid;
        place-items: center;
        inline-size: 44px;
        block-size: 44px;
        flex: none;
        margin-inline-start: -12px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--ink-muted);
      }
      @media (hover: hover) {
        .back:hover {
          color: var(--ink-strong);
        }
      }
      .back svg {
        inline-size: 20px;
        block-size: 20px;
      }
      .step {
        margin: 0;
        color: var(--ink-muted);
        font-size: var(--text-label);
        line-height: var(--leading-label);
        font-variant-numeric: tabular-nums;
      }
      h1 {
        font-size: var(--text-title);
        line-height: var(--leading-tight);
        font-weight: var(--weight-strong);
        margin: 0 0 var(--space-2);
        overflow-wrap: anywhere;
      }
      .how {
        color: var(--ink-muted);
        font-size: var(--text-label);
        line-height: var(--leading-label);
        margin: 0 0 var(--space-4);
        max-width: 68ch;
      }
      /* How many options there are, each one a press away, before any picture. */
      .count {
        margin: 0 0 var(--space-1);
        color: var(--ink-muted);
        font-size: var(--text-meta);
        line-height: var(--leading-meta);
      }
      .ways {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(0, 1fr);
        gap: 2px;
        padding: 2px;
        margin: 0 0 var(--space-4);
        border-radius: var(--radius-md);
        background: var(--surface-recess-deep);
        max-width: 560px;
      }
      .way {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        min-width: 0;
        padding: var(--space-1) var(--space-2);
        border: 0;
        border-radius: calc(var(--radius-md) - 2px);
        background: transparent;
        color: var(--ink-muted);
        font-size: var(--text-label);
        line-height: var(--leading-label);
        text-align: center;
      }
      .way:focus-visible {
        outline-offset: -2px;
      }
      @media (hover: hover) {
        .way:hover {
          color: var(--ink-strong);
        }
      }
      .way[aria-current="true"] {
        background: var(--surface-lift);
        color: var(--ink-strong);
        box-shadow: var(--shadow-xs);
      }
      .way .n {
        font-variant-numeric: tabular-nums;
      }
      .way .w {
        display: inline-flex;
        align-items: center;
        gap: var(--space-1);
        max-width: 100%;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-weight: var(--weight-strong);
      }
      /* The options, side by side: all of them at a desk, the next one at the
         edge on a phone, a swipe or a press on its number away. */
      .strip {
        display: flex;
        align-items: flex-start;
        gap: var(--space-3);
        overflow-x: auto;
        overscroll-behavior-x: contain;
        scroll-snap-type: x mandatory;
        scroll-padding-inline: var(--space-4);
        margin-inline: calc(-1 * var(--space-4));
        padding-inline: var(--space-4);
        scrollbar-width: none;
      }
      .strip::-webkit-scrollbar {
        display: none;
      }
      @media (prefers-reduced-motion: no-preference) {
        .strip {
          scroll-behavior: smooth;
        }
      }
      .opt {
        /* A picture is drawn at 1 CSS px to 1 px: 340 plus the card's edges. */
        flex: 0 0 342px;
        scroll-snap-align: start;
        background: var(--surface-raised);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-lg);
        overflow: hidden;
      }
      .opt.chosen {
        border-color: var(--brand-solid);
      }
      .head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: var(--space-1) var(--space-3);
        align-items: start;
        padding: var(--space-3) var(--space-3) var(--space-3) var(--space-4);
      }
      .name {
        font-size: var(--text-body);
        line-height: var(--leading-ui);
        font-weight: var(--weight-strong);
        margin: 0;
        overflow-wrap: anywhere;
      }
      .why {
        grid-column: 1 / -1;
        color: var(--ink-muted);
        font-size: var(--text-label);
        line-height: var(--leading-label);
        margin: 0;
        overflow-wrap: anywhere;
      }
      /* The kit's outline button. */
      .pick {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        min-height: 36px;
        min-inline-size: 72px;
        justify-content: center;
        padding: 0 var(--space-4);
        border: 1px solid var(--border-button-outline);
        border-radius: var(--radius-md);
        background: var(--surface-raised);
        color: var(--ink-strong);
        font-size: var(--text-body);
        font-weight: var(--weight-strong);
        white-space: nowrap;
        transition: scale 150ms ease-out;
      }
      @media (pointer: coarse) {
        .pick {
          min-height: 44px;
        }
      }
      @media (hover: hover) {
        .pick:hover {
          background: var(--surface-hover);
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .pick:active {
          scale: 0.97;
        }
      }
      .opt.chosen .pick {
        border-color: var(--brand-solid);
        background: var(--surface-recess);
      }
      .shots {
        display: grid;
        gap: var(--space-1);
        padding: 0 0 var(--space-1);
      }
      .shot {
        position: relative;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      /* Icons at the size they ship: a picture is drawn at 1 CSS px to 1 px, never stretched. */
      .shot img {
        display: block;
        width: 340px;
        max-width: none;
        height: auto;
      }
      .lbl {
        margin: 0;
        padding: var(--space-1) var(--space-4) var(--space-2);
        color: var(--ink-muted);
        font-size: var(--text-meta);
        line-height: var(--leading-meta);
      }
      .orig {
        position: absolute;
        inset-inline-end: var(--space-2);
        top: var(--space-2);
        padding: 1px var(--space-2);
        border-radius: var(--radius-xs);
        background: var(--ink-solid);
        color: var(--on-ink);
        font-size: var(--text-meta);
        line-height: var(--leading-meta);
        display: none;
      }
      .shot.held .orig {
        display: block;
      }
      .done ul {
        padding: 0;
        margin: 0 0 var(--space-6);
        max-width: 560px;
      }
      .done li {
        margin: 0 0 var(--space-3);
        list-style: none;
      }
      .done .q {
        color: var(--ink-muted);
        font-size: var(--text-label);
      }
      .done .a {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-2);
        font-weight: var(--weight-strong);
      }
      .done .a button {
        min-height: 30px;
        padding: 0 var(--space-3);
        border: 1px solid var(--border-button-outline);
        border-radius: var(--radius-md);
        background: var(--surface-raised);
        font-size: var(--text-label);
        font-weight: var(--weight-body);
      }
      /* The page's one prominent act: the coral action. */
      .big {
        display: block;
        width: 100%;
        max-width: 560px;
        min-height: 44px;
        border: 0;
        border-radius: var(--radius-md);
        background: var(--action-surface, var(--action-solid));
        color: var(--on-action);
        font-size: var(--text-body);
        font-weight: var(--weight-strong);
      }
      @media (hover: hover) {
        .big:hover {
          background: var(--action-surface-hover, var(--action-hover));
        }
      }
      .err {
        color: var(--status-fail-ink);
      }
    </style>
  </head>
  <body>
    <main id="main"><p class="how">Loading…</p></main>
    <script>
      "use strict";
      // One decision per screen. Its options stand side by side under a count
      // and one press each on their numbers: every option is in the first view
      // at a desk, and on a phone the count says how many and the next one
      // shows at the edge. Each option holds its pictures (hold one to see
      // today's) and its own Pick, which records the choice and moves on. The
      // last screen copies the picks for chat.
      // Manifest schema: scripts/probe-review/README.md.
      const main = document.getElementById("main");
      let manifest;
      let picks = {};
      let at = 0;
      const storeKey = () => `probe-review:${manifest.id ?? manifest.title}`;
      const save = () =>
        localStorage.setItem(storeKey(), JSON.stringify(picks));
      // Solar's linear chevron.
      const chevronLeft = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5L9 12L15 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      const words = ["", "one", "two", "three", "four", "five", "six"];

      function shot(item) {
        const el = document.createElement("figure");
        el.className = "shot";
        el.style.margin = "0";
        el.innerHTML = `<img alt="" width="340"><span class="orig">Today</span><figcaption class="lbl"></figcaption>`;
        const img = el.querySelector("img");
        img.src = item.after;
        img.alt = item.label;
        el.querySelector(".lbl").textContent = item.label;
        if (item.before && item.before !== item.after) {
          let timer;
          const show = () => {
            img.src = item.before;
            el.classList.add("held");
          };
          const hide = () => {
            clearTimeout(timer);
            if (el.classList.contains("held")) {
              img.src = item.after;
              el.classList.remove("held");
            }
          };
          el.addEventListener("pointerdown", () => {
            timer = setTimeout(show, 220);
          });
          for (const ev of ["pointerup", "pointerleave", "pointercancel"]) {
            el.addEventListener(ev, hide);
          }
          el.addEventListener("contextmenu", (e) => e.preventDefault());
        }
        return el;
      }

      function option(d, c, i) {
        const el = document.createElement("section");
        el.className = `opt${picks[d.id] === c.id ? " chosen" : ""}`;
        el.id = `opt-${c.id}`;
        el.dataset.option = c.id;
        el.setAttribute("aria-label", `Option ${i + 1}: ${c.label}`);
        el.innerHTML = `<div class="head"><div><p class="name"></p></div><button class="pick" type="button"></button><p class="why"></p></div><div class="shots"></div>`;
        el.querySelector(".name").textContent = c.label;
        el.querySelector(".why").textContent = c.result ?? "";
        const shots = el.querySelector(".shots");
        for (const item of c.items) {
          shots.append(shot(item));
        }
        const btn = el.querySelector(".pick");
        const chosen = picks[d.id] === c.id;
        btn.textContent = chosen ? "Picked" : "Pick";
        btn.setAttribute(
          "aria-label",
          chosen ? `Picked ${c.label}` : `Pick ${c.label}`
        );
        btn.onclick = () => {
          picks[d.id] = c.id;
          save();
          render();
          setTimeout(() => {
            at += 1;
            render();
            window.scrollTo(0, 0);
          }, 350);
        };
        return el;
      }

      function decisionScreen(d) {
        const n = manifest.decisions.length;
        const k = d.candidates.length;
        main.innerHTML = `<div class="bar"><p class="step"></p></div><h1></h1><p class="how"></p><p class="count"></p><div class="ways"></div><div class="strip"></div>`;
        main.querySelector(".step").textContent =
          n > 1 ? `Question ${at + 1} of ${n}` : manifest.title;
        if (at > 0) {
          const back = document.createElement("button");
          back.type = "button";
          back.className = "back";
          back.innerHTML = chevronLeft;
          const where = `Back to question ${at}`;
          back.setAttribute("aria-label", where);
          back.title = where;
          back.onclick = () => {
            at -= 1;
            render();
            window.scrollTo(0, 0);
          };
          main.querySelector(".bar").prepend(back);
        }
        main.querySelector("h1").textContent = d.question;
        main.querySelector(".how").textContent = d.bar
          ? `Tap the one that looks best. ${d.bar}`
          : "Tap the one that looks best.";
        main.querySelector(".count").textContent =
          `${words[k] ? words[k][0].toUpperCase() + words[k].slice(1) : k} options, side by side`;
        const ways = main.querySelector(".ways");
        ways.setAttribute("aria-label", `${k} options`);
        const strip = main.querySelector(".strip");
        const cards = d.candidates.map((c, i) => option(d, c, i));
        d.candidates.forEach((c, i) => {
          const w = document.createElement("button");
          w.type = "button";
          w.className = "way";
          w.dataset.option = c.id;
          w.setAttribute("aria-controls", `opt-${c.id}`);
          const picked = picks[d.id] === c.id;
          w.innerHTML = `<span class="w"><span class="n"></span></span>`;
          w.querySelector(".n").textContent = `${i + 1} ${c.short ?? c.label}`;
          w.setAttribute(
            "aria-label",
            `Option ${i + 1}: ${c.label}${picked ? ", picked" : ""}`
          );
          w.onclick = () => {
            strip.scrollTo({
              left: cards[i].offsetLeft - strip.offsetLeft - Number.parseFloat(getComputedStyle(strip).scrollPaddingInlineStart || "0"),
            });
            cards[i].querySelector(".pick").focus({ preventScroll: true });
          };
          ways.append(w);
        });
        for (const card of cards) {
          strip.append(card);
        }
        // The option in front, where the options are wider than the view.
        const mark = () => {
          const overflows = strip.scrollWidth > strip.clientWidth + 1;
          const pad = Number.parseFloat(getComputedStyle(strip).scrollPaddingInlineStart) || 0;
          const left = strip.getBoundingClientRect().left + pad;
          let near = 0;
          let best = Number.POSITIVE_INFINITY;
          cards.forEach((card, i) => {
            const dx = Math.abs(card.getBoundingClientRect().left - left);
            if (dx < best) {
              best = dx;
              near = i;
            }
          });
          for (const [i, w] of [...ways.children].entries()) {
            if (overflows && i === near) {
              w.setAttribute("aria-current", "true");
            } else {
              w.removeAttribute("aria-current");
            }
          }
        };
        strip.addEventListener("scroll", mark, { passive: true });
        new ResizeObserver(mark).observe(strip);
        mark();
      }

      function doneScreen() {
        main.innerHTML = `<div class="done"><h1>Your picks</h1><p class="how">Copy them and paste them in the chat.</p><ul></ul><button class="big" type="button">Copy picks</button></div>`;
        const ul = main.querySelector("ul");
        manifest.decisions.forEach((d, i) => {
          const c = d.candidates.find((x) => x.id === picks[d.id]);
          const li = document.createElement("li");
          li.innerHTML = `<div class="q"></div><div class="a"><span></span><button type="button">Change</button></div>`;
          li.querySelector(".q").textContent = d.question;
          li.querySelector(".a span").textContent = c ? c.label : "Not picked";
          li.querySelector("button").onclick = () => {
            at = i;
            render();
            window.scrollTo(0, 0);
          };
          ul.append(li);
        });
        const btn = main.querySelector(".big");
        btn.onclick = async () => {
          const text = `${manifest.title}\n${manifest.decisions.map((d) => `${d.question} → ${d.candidates.find((x) => x.id === picks[d.id])?.label ?? "no pick"}`).join("\n")}`;
          try {
            await navigator.clipboard.writeText(text);
            btn.textContent = "Copied, paste it in the chat";
          } catch {
            // biome-ignore lint/suspicious/noAlert: where the phone refuses clipboard access, a prompt box is the only way to hand the owner the picks to copy
            window.prompt("Copy this:", text);
          }
        };
      }

      function render() {
        if (at >= manifest.decisions.length) {
          doneScreen();
        } else {
          decisionScreen(manifest.decisions[at]);
        }
      }

      fetch("manifest.json")
        .then((r) => {
          if (!r.ok) {
            throw new Error(`manifest.json: HTTP ${r.status}`);
          }
          return r.json();
        })
        .then((m) => {
          manifest = m;
          document.title = m.title;
          picks = JSON.parse(localStorage.getItem(storeKey()) ?? "{}");
          render();
        })
        .catch((e) => {
          main.innerHTML = `<p class="err"></p>`;
          main.querySelector(".err").textContent = String(e);
        });
    </script>
  </body>
</html>
