<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Pairing · preview</title>
    <link
      as="font"
      crossorigin
      href="./fonts/Figtree.ttf"
      rel="preload"
      type="font/ttf"
    />
    <link
      as="font"
      crossorigin
      href="./fonts/JetBrainsMono.ttf"
      rel="preload"
      type="font/ttf"
    />
    <link href="./preview.css" rel="stylesheet" />
    <script src="./preview.js" type="module"></script>
  </head>
  <body>
    <header class="bar">
      <h1>Pairing a browser</h1>
      <div class="row">
        <button class="btn" data-size="sm" data-slot="replay" type="button">
          Replay
        </button>
      </div>
      <p class="note">
        Approve, Deny, Remove device, New code and Retry in the cards play the
        flow on from where it stands. Open Devices has no page yet.
      </p>
    </header>

    <main class="frames">
      <figure class="frame">
        <figcaption>Desk</figcaption>
        <div class="fit">
          <div
            class="viewport"
            data-layout="desk"
            style="--frame-w: 544px"
          ></div>
        </div>
      </figure>
      <figure class="frame">
        <figcaption>Phone</figcaption>
        <div class="fit">
          <div
            class="viewport"
            data-layout="phone"
            style="--frame-w: 390px"
          ></div>
        </div>
      </figure>
    </main>

    <template id="stage">
      <div class="stage">
        <img alt="" class="caw" height="80" src="./caw/asking.png" width="80" />
        <h2 class="title">Scan with the CawCo app</h2>
        <div class="card-wrap">
          <div aria-hidden="true" class="ping"></div>
          <section aria-live="polite" class="card">
            <div class="scene scene-code">
              <div class="well">
                <div aria-label="Pairing QR code" class="code" role="img">
                  <svg aria-hidden="true" class="eyes"></svg>
                </div>
                <img alt="" class="badge" src="./caw/badge.png" />
              </div>
              <div class="letters"></div>
              <p class="readout">
                <span aria-hidden="true" class="live"></span
                ><span class="words">Getting a code…</span>
              </p>
            </div>
            <div class="scene scene-device">
              <div aria-label="iPhone" class="wire" role="img"></div>
              <div class="facts">
                <p class="name">Bewin's iPhone</p>
                <p class="kind">iPhone · iOS 26.1</p>
                <p class="addr"></p>
                <p class="second"></p>
                <p class="meta">
                  CawCo 1.4 · asked <span class="ago">8s</span> ago
                </p>
              </div>
              <div class="actions">
                <button class="btn" data-act="deny" type="button">Deny</button>
                <button
                  class="btn"
                  data-act="approve"
                  data-tone="primary"
                  type="button"
                >
                  Approve
                </button>
              </div>
            </div>
            <div class="scene scene-outcome">
              <span aria-hidden="true" class="mark" data-glyph="check">
                <svg class="g g-check" viewBox="0 0 24 24">
                  <circle cx="12" cy="12" fill="currentColor" opacity=".5" r="10" />
                  <path
                    class="tick"
                    d="M8.5 12.5l2 2l5-5"
                    fill="none"
                    pathLength="1"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.5"
                  />
                </svg>
                <svg class="g g-close" viewBox="0 0 24 24">
                  <circle cx="12" cy="12" fill="currentColor" opacity=".5" r="10" />
                  <path
                    d="M8.96967 8.96967C9.26256 8.67678 9.73744 8.67678 10.0303 8.96967L12 10.9394L13.9697 8.96969C14.2626 8.6768 14.7374 8.6768 15.0303 8.96969C15.3232 9.26258 15.3232 9.73746 15.0303 10.0304L13.0607 12L15.0303 13.9696C15.3232 14.2625 15.3232 14.7374 15.0303 15.0303C14.7374 15.3232 14.2625 15.3232 13.9696 15.0303L12 13.0607L10.0304 15.0303C9.73746 15.3232 9.26258 15.3232 8.96969 15.0303C8.6768 14.7374 8.6768 14.2626 8.96969 13.9697L10.9394 12L8.96967 10.0303C8.67678 9.73744 8.67678 9.26256 8.96967 8.96967Z"
                    fill="currentColor"
                  />
                </svg>
                <svg class="g g-clock" viewBox="0 0 24 24">
                  <circle cx="12" cy="12" fill="currentColor" opacity=".5" r="10" />
                  <path
                    clip-rule="evenodd"
                    d="M12 7.25C12.4142 7.25 12.75 7.58579 12.75 8V11.6893L15.0303 13.9697C15.3232 14.2626 15.3232 14.7374 15.0303 15.0303C14.7374 15.3232 14.2626 15.3232 13.9697 15.0303L11.4697 12.5303C11.329 12.3897 11.25 12.1989 11.25 12V8C11.25 7.58579 11.5858 7.25 12 7.25Z"
                    fill="currentColor"
                    fill-rule="evenodd"
                  />
                </svg>
              </span>
              <p class="said">
                <span class="w lead"></span
                ><span class="spent" hidden
                  ><span class="strike"></span></span
                ><span class="w tail"></span>
              </p>
              <p class="record"></p>
              <p class="means"></p>
              <div class="acts">
                <button
                  class="btn"
                  data-slot="ghost"
                  data-tone="ghost"
                  type="button"
                >
                  Remove device
                </button>
                <button
                  class="btn"
                  data-slot="primary"
                  data-tone="primary"
                  type="button"
                >
                  Open Devices
                </button>
              </div>
            </div>
          </section>
        </div>
      </div>
    </template>
  </body>
</html>
