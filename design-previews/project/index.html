<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The project page · preview</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="index.css" />
    <script src="index.js" type="module"></script>
  </head>
  <body>
    <header class="intro">
      <h1>The project page</h1>
      <p>
        A head that says the state in one line, a board whose cards are the glance, a pane that answers and reviews,
        and Caw where his words are. Pick a state; each frame is the page, live.
      </p>
    </header>

    <div class="controls">
      <button class="replay" type="button" data-act="replay">Replay the state</button>
    </div>
    <p class="hint" data-slot="hint" aria-live="polite"></p>

    <div class="frames">
      <figure class="frame" data-frame="desk">
        <figcaption>Desk</figcaption>
        <div class="screen" style="--w: 1440; --h: 900">
          <iframe title="The project page at 1440 wide" src="frame.html?state=rest" width="1440" height="900"></iframe>
        </div>
      </figure>
      <figure class="frame" data-frame="phone" data-shown>
        <figcaption>Phone</figcaption>
        <div class="screen" style="--w: 390; --h: 844">
          <iframe title="The project page at 390 wide" src="frame.html?state=rest" width="390" height="844"></iframe>
        </div>
      </figure>
    </div>
  </body>
</html>
