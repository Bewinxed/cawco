<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover"
      name="viewport"
    />
    <meta content="light dark" name="color-scheme" />
    <title>Hero film: pick one</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --ink: #1c1b18;
        --muted: #6b675e;
        --edge: #e3dfd5;
        --tile: #f3f1ec;
        --action: #c9452f;
        --on-action: #ffffff;
        --chosen: #c9452f;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121110;
          --ink: #ece8df;
          --muted: #a29d92;
          --edge: #2e2b27;
          --tile: #1c1a18;
          --action: #e2604a;
          --chosen: #e2604a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: max(16px, env(safe-area-inset-top)) 14px
          calc(96px + env(safe-area-inset-bottom));
      }
      h1 {
        font-size: 20px;
        font-weight: 500;
        margin: 4px 0 4px;
      }
      .lede {
        font-size: 14px;
        line-height: 1.45;
        color: var(--muted);
        margin: 0 0 16px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      @media (min-width: 720px) {
        .grid {
          gap: 18px;
        }
      }
      .option {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px;
        border: 1.5px solid var(--edge);
        border-radius: 12px;
        background: var(--bg);
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      .option[aria-checked="true"] {
        border-color: var(--chosen);
        box-shadow: 0 0 0 1.5px var(--chosen);
      }
      .frame {
        position: relative;
        aspect-ratio: 16 / 10;
        border-radius: 6px;
        overflow: hidden;
        background: var(--tile);
      }
      .frame video,
      .frame img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }
      .frame .none {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 12px;
        text-align: center;
        font-size: 13px;
        color: var(--muted);
      }
      .label {
        font-size: 14px;
        font-weight: 500;
        line-height: 1.3;
      }
      .detail {
        font-size: 12px;
        line-height: 1.4;
        color: var(--muted);
      }
      .facts {
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .night {
        align-self: flex-start;
        font: inherit;
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid var(--edge);
        background: var(--tile);
        color: var(--ink);
      }
      .night[aria-pressed="true"] {
        border-color: var(--ink);
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        margin: 14px 0 0;
      }
      /* The pick, kept to hand at the foot. */
      .bar {
        position: fixed;
        inset: auto 0 0 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
        background: var(--bg);
        border-top: 1px solid var(--edge);
      }
      .bar output {
        flex: 1;
        font-size: 14px;
        min-width: 0;
      }
      .bar button {
        font: inherit;
        font-size: 15px;
        font-weight: 500;
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: var(--action);
        color: var(--on-action);
      }
      .bar button:disabled {
        opacity: 0.4;
      }
      /* Press and hold: the candidate at full size. */
      .full {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        background: #000;
        z-index: 10;
      }
      .full[data-open] {
        display: grid;
      }
      .full video {
        width: 100vw;
        max-height: 100vh;
        object-fit: contain;
      }
      @media (orientation: portrait) {
        .full video {
          width: 100vh;
          max-width: none;
          transform: rotate(90deg);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="question">Which hero film?</h1>
      <p class="lede" id="lede"></p>
      <div
        aria-labelledby="question"
        class="grid"
        id="grid"
        role="radiogroup"
      ></div>
      <p class="hint">
        Press and hold a film to see it at full size. Tap to pick it.
      </p>
    </main>
    <div class="bar">
      <output id="pick">Nothing picked yet</output>
      <button disabled id="copy" type="button">Copy pick</button>
    </div>
    <div class="full" id="full"><video loop muted playsinline></video></div>
    <script type="module">
      const manifest = await (await fetch("manifest.json")).json();
      const [decision] = manifest.decisions;
      document.getElementById("question").textContent = decision.question;
      document.getElementById("lede").textContent = decision.context;

      const grid = document.getElementById("grid");
      const full = document.getElementById("full");
      const fullVideo = full.querySelector("video");
      const pickOut = document.getElementById("pick");
      const copy = document.getElementById("copy");
      let chosen = null;

      const sourcesOf = (video, take) => {
        video.replaceChildren(
          ...[
            ["webm", "video/webm"],
            ["mp4", "video/mp4"],
          ]
            .filter(([kind]) => take[kind])
            .map(([kind, type]) => {
              const source = document.createElement("source");
              source.src = take[kind];
              source.type = type;
              return source;
            })
        );
        video.poster = take.poster ?? "";
        video.load();
      };

      const choose = (option, tile) => {
        chosen = option;
        for (const one of grid.children) {
          one.setAttribute("aria-checked", String(one === tile));
        }
        pickOut.textContent = `${decision.id}: ${option.id}`;
        copy.disabled = false;
      };

      for (const option of decision.options) {
        const tile = document.createElement("div");
        tile.className = "option";
        tile.setAttribute("role", "radio");
        tile.setAttribute("aria-checked", "false");
        tile.tabIndex = 0;
        const frame = document.createElement("div");
        frame.className = "frame";
        let video = null;
        let take = option.light;
        if (take) {
          video = document.createElement("video");
          video.muted = true;
          video.loop = true;
          video.autoplay = true;
          video.playsInline = true;
          video.preload = "auto";
          sourcesOf(video, take);
          frame.append(video);
        } else {
          const none = document.createElement("div");
          none.className = "none";
          none.textContent = option.label;
          frame.append(none);
        }
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = option.label;
        const detail = document.createElement("div");
        detail.className = "detail";
        detail.textContent = option.detail;
        tile.append(frame, label, detail);
        if (option.facts) {
          const facts = document.createElement("div");
          facts.className = "facts";
          facts.textContent = option.facts;
          tile.append(facts);
        }
        if (option.night && video) {
          // The night render beside the paper one: the same film, the
          // site's coming dark mode.
          const night = document.createElement("button");
          night.type = "button";
          night.className = "night";
          night.textContent = "Show at night";
          night.setAttribute("aria-pressed", "false");
          night.addEventListener("click", (event) => {
            event.stopPropagation();
            const dark = night.getAttribute("aria-pressed") !== "true";
            night.setAttribute("aria-pressed", String(dark));
            night.textContent = dark ? "Show by day" : "Show at night";
            take = dark ? option.night : option.light;
            sourcesOf(video, take);
            video.play();
          });
          tile.append(night);
        }

        // Tap picks; press and hold (400ms) shows it at full size until
        // the finger lifts.
        let holdTimer = null;
        let held = false;
        // The night switch is its own control: it neither picks nor holds.
        const onSwitch = (event) => event.target.closest(".night") !== null;
        tile.addEventListener("pointerdown", (event) => {
          held = false;
          if (!video || onSwitch(event)) {
            return;
          }
          holdTimer = setTimeout(() => {
            held = true;
            sourcesOf(fullVideo, take);
            fullVideo.currentTime = video.currentTime;
            full.setAttribute("data-open", "");
            fullVideo.play();
          }, 400);
        });
        const release = () => {
          clearTimeout(holdTimer);
          if (held) {
            full.removeAttribute("data-open");
            fullVideo.pause();
          }
        };
        tile.addEventListener("pointerup", (event) => {
          release();
          if (!(held || onSwitch(event))) {
            choose(option, tile);
          }
        });
        tile.addEventListener("pointercancel", release);
        tile.addEventListener("pointerleave", release);
        tile.addEventListener("contextmenu", (event) => event.preventDefault());
        tile.addEventListener("keydown", (event) => {
          if (event.key === " " || event.key === "Enter") {
            event.preventDefault();
            choose(option, tile);
          }
        });
        grid.append(tile);
      }
      full.addEventListener("pointerup", () => {
        full.removeAttribute("data-open");
        fullVideo.pause();
      });

      copy.addEventListener("click", async () => {
        if (!chosen) {
          return;
        }
        await navigator.clipboard.writeText(`${decision.id}: ${chosen.id}`);
        copy.textContent = "Copied";
        setTimeout(() => {
          copy.textContent = "Copy pick";
        }, 1600);
      });
    </script>
  </body>
</html>
