<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover"
      name="viewport"
    />
    <meta content="light dark" name="color-scheme" />
    <title>Hero film: pick one</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --ink: #1c1b18;
        --muted: #6b675e;
        --edge: #e3dfd5;
        --tile: #f3f1ec;
        --action: #c9452f;
        --on-action: #ffffff;
        --chosen: #c9452f;
        --focus: #c9452f;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121110;
          --ink: #ece8df;
          --muted: #a29d92;
          --edge: #2e2b27;
          --tile: #1c1a18;
          --action: #e2604a;
          --chosen: #e2604a;
          --focus: #e2604a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: max(16px, env(safe-area-inset-top)) 14px
          calc(96px + env(safe-area-inset-bottom));
      }
      h1 {
        font-size: 20px;
        font-weight: 500;
        margin: 4px 0 4px;
      }
      .lede {
        max-width: 72ch;
        font-size: 14px;
        line-height: 1.45;
        color: var(--muted);
        margin: 0 0 16px;
      }
      /* A phone: two small tiles to a row. */
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .option {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px;
        border: 1.5px solid var(--edge);
        border-radius: 12px;
        background: var(--bg);
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      .option[data-checked] {
        border-color: var(--chosen);
        box-shadow: 0 0 0 1.5px var(--chosen);
      }
      .frame {
        position: relative;
        aspect-ratio: 16 / 10;
        border-radius: 6px;
        overflow: hidden;
        background: var(--tile);
      }
      .frame video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
      }
      video:fullscreen {
        object-fit: contain;
      }
      .frame .none {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 12px;
        text-align: center;
        font-size: 13px;
        color: var(--muted);
      }
      .label {
        font-size: 14px;
        font-weight: 500;
        line-height: 1.3;
      }
      .detail {
        font-size: 12px;
        line-height: 1.4;
        color: var(--muted);
      }
      .facts {
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: auto;
      }
      .actions button {
        font: inherit;
        font-size: 13px;
        min-height: 36px;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid var(--edge);
        background: var(--tile);
        color: var(--ink);
        cursor: pointer;
      }
      .actions button:focus-visible,
      .bar button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .actions .pick[aria-checked="true"] {
        border-color: var(--action);
        background: var(--action);
        color: var(--on-action);
      }
      .actions .night[aria-pressed="true"] {
        border-color: var(--ink);
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        margin: 14px 0 0;
      }
      .hint .desk {
        display: none;
      }
      /* A desk: large tiles, two to a row at most, each film with its
         controls. */
      @media (min-width: 900px) {
        main {
          max-width: 1440px;
          padding: 32px 32px 112px;
        }
        h1 {
          font-size: 24px;
        }
        .lede {
          font-size: 15px;
          margin-bottom: 24px;
        }
        .grid {
          grid-template-columns: repeat(
            auto-fill,
            minmax(min(100%, 600px), 1fr)
          );
          gap: 24px;
        }
        .option {
          padding: 12px;
          gap: 10px;
        }
        .label {
          font-size: 17px;
        }
        .detail {
          font-size: 14px;
        }
        .facts {
          font-size: 13px;
        }
        .actions button {
          font-size: 14px;
        }
        .hint .desk {
          display: inline;
        }
        .hint .phone {
          display: none;
        }
      }
      /* The pick, kept to hand at the foot. */
      .bar {
        position: fixed;
        inset: auto 0 0 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
        background: var(--bg);
        border-top: 1px solid var(--edge);
      }
      .bar output {
        flex: 1;
        font-size: 14px;
        min-width: 0;
      }
      .bar button {
        font: inherit;
        font-size: 15px;
        font-weight: 500;
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: var(--action);
        color: var(--on-action);
        cursor: pointer;
      }
      .bar button:disabled {
        opacity: 0.4;
      }
      /* Press and hold on a phone: the candidate at full size. */
      .full {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        background: #000;
        z-index: 10;
      }
      .full[data-open] {
        display: grid;
      }
      .full video {
        width: 100vw;
        max-height: 100vh;
        object-fit: contain;
      }
      @media (orientation: portrait) {
        .full video {
          width: 100vh;
          max-width: none;
          transform: rotate(90deg);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="question">Which hero film?</h1>
      <p class="lede" id="lede"></p>
      <div
        aria-labelledby="question"
        class="grid"
        id="grid"
        role="radiogroup"
      ></div>
      <p class="hint">
        <span class="desk"
          >Full size (or a click on a film) shows it at full size; Esc leaves.
          Pick one, then copy your pick.</span
        ><span class="phone"
          >Press and hold a film to see it at full size. Tap to pick it.</span
        >
      </p>
    </main>
    <div class="bar">
      <output id="pick">Nothing picked yet</output>
      <button disabled id="copy" type="button">Copy pick</button>
    </div>
    <div class="full" id="full"><video loop muted playsinline></video></div>
    <script type="module">
      const manifest = await (await fetch("manifest.json")).json();
      const [decision] = manifest.decisions;
      document.getElementById("question").textContent = decision.question;
      document.getElementById("lede").textContent = decision.context;

      const grid = document.getElementById("grid");
      const full = document.getElementById("full");
      const fullVideo = full.querySelector("video");
      const pickOut = document.getElementById("pick");
      const copy = document.getElementById("copy");
      /** A desk's width: the films carry their native controls. */
      const desk = window.matchMedia("(min-width: 900px)");
      /** The height of a video's native control bar, which a click on keeps for itself. */
      const CONTROL_BAR = 56;
      const tiles = [];
      let chosen = null;

      const sourcesOf = (video, take) => {
        video.replaceChildren(
          ...[
            ["webm", "video/webm"],
            ["mp4", "video/mp4"],
          ]
            .filter(([kind]) => take[kind])
            .map(([kind, type]) => {
              const source = document.createElement("source");
              source.src = take[kind];
              source.type = type;
              return source;
            })
        );
        video.poster = take.poster ?? "";
        video.load();
      };

      const button = (className, text) => {
        const made = document.createElement("button");
        made.type = "button";
        made.className = className;
        made.textContent = text;
        return made;
      };

      const choose = (option) => {
        chosen = option;
        for (const tile of tiles) {
          const mine = tile.option === option;
          tile.element.toggleAttribute("data-checked", mine);
          tile.pick.setAttribute("aria-checked", String(mine));
          tile.pick.textContent = mine ? "Picked" : "Pick";
        }
        pickOut.textContent = `${decision.id}: ${option.id}`;
        copy.disabled = false;
      };

      for (const option of decision.options) {
        const element = document.createElement("article");
        element.className = "option";
        const frame = document.createElement("div");
        frame.className = "frame";
        let video = null;
        let take = option.light;
        if (take) {
          video = document.createElement("video");
          video.muted = true;
          video.loop = true;
          video.autoplay = true;
          video.playsInline = true;
          video.preload = "auto";
          video.setAttribute("aria-label", option.label);
          sourcesOf(video, take);
          frame.append(video);
        } else {
          const none = document.createElement("div");
          none.className = "none";
          none.textContent = option.label;
          frame.append(none);
        }
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = option.label;
        const detail = document.createElement("div");
        detail.className = "detail";
        detail.textContent = option.detail;
        element.append(frame, label, detail);
        if (option.facts) {
          const facts = document.createElement("div");
          facts.className = "facts";
          facts.textContent = option.facts;
          element.append(facts);
        }

        const actions = document.createElement("div");
        actions.className = "actions";
        const pick = button("pick", "Pick");
        pick.setAttribute("role", "radio");
        pick.setAttribute("aria-checked", "false");
        pick.setAttribute("aria-label", `Pick ${option.label}`);
        pick.addEventListener("click", () => choose(option));
        actions.append(pick);
        if (video) {
          const fullSize = button("full-size", "Full size");
          fullSize.setAttribute("aria-label", `Full size: ${option.label}`);
          fullSize.addEventListener("click", () => video.requestFullscreen());
          actions.append(fullSize);
        }
        if (option.night && video) {
          // The night render beside the paper one: the same film, the
          // site's coming dark mode.
          const night = button("night", "Show at night");
          night.setAttribute("aria-pressed", "false");
          night.addEventListener("click", () => {
            const dark = night.getAttribute("aria-pressed") !== "true";
            night.setAttribute("aria-pressed", String(dark));
            night.textContent = dark ? "Show by day" : "Show at night";
            take = dark ? option.night : option.light;
            sourcesOf(video, take);
            video.play();
          });
          actions.append(night);
        }
        element.append(actions);
        tiles.push({ element, option, pick });

        /** Whether a press landed on a control of the tile's own. */
        const onControl = (event) => event.target.closest("button") !== null;

        // A mouse on the film opens it at full size; its control bar keeps
        // its own clicks. A press anywhere else on the tile picks it.
        element.addEventListener("click", (event) => {
          if (onControl(event) || touchPress) {
            return;
          }
          if (video && event.target === video) {
            const bar = video.getBoundingClientRect().bottom - CONTROL_BAR;
            if (video.controls && event.clientY >= bar) {
              return;
            }
            event.preventDefault();
            video.requestFullscreen();
            return;
          }
          choose(option);
        });

        // A finger: a tap picks; a press held 400ms shows the film at full
        // size until the finger lifts.
        let touchPress = false;
        let holdTimer = null;
        let held = false;
        element.addEventListener("pointerdown", (event) => {
          touchPress = event.pointerType === "touch";
          held = false;
          if (!(touchPress && video) || onControl(event)) {
            return;
          }
          holdTimer = setTimeout(() => {
            held = true;
            sourcesOf(fullVideo, take);
            fullVideo.currentTime = video.currentTime;
            full.setAttribute("data-open", "");
            fullVideo.play();
          }, 400);
        });
        const release = () => {
          clearTimeout(holdTimer);
          if (held) {
            full.removeAttribute("data-open");
            fullVideo.pause();
          }
        };
        element.addEventListener("pointerup", (event) => {
          release();
          if (touchPress && !held && !onControl(event)) {
            event.preventDefault();
            choose(option);
          }
        });
        element.addEventListener("pointercancel", release);
        element.addEventListener("pointerleave", release);
        element.addEventListener("contextmenu", (event) => {
          if (touchPress) {
            event.preventDefault();
          }
        });

        if (video) {
          const showControls = () => {
            video.controls = desk.matches;
          };
          showControls();
          desk.addEventListener("change", showControls);
        }
        grid.append(element);
      }
      // Esc leaves full size, whether or not the browser took the key first.
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && document.fullscreenElement) {
          document.exitFullscreen();
        }
      });
      full.addEventListener("pointerup", () => {
        full.removeAttribute("data-open");
        fullVideo.pause();
      });

      copy.addEventListener("click", async () => {
        if (!chosen) {
          return;
        }
        await navigator.clipboard.writeText(`${decision.id}: ${chosen.id}`);
        copy.textContent = "Copied";
        setTimeout(() => {
          copy.textContent = "Copy pick";
        }, 1600);
      });
    </script>
  </body>
</html>
