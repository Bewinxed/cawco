<style>
.mk-delegates{display:block;width:100%;container-type:inline-size;color:var(--ink);font-family:var(--f-body);font-size:12px;line-height:1.4}
.mk-delegates *,.mk-delegates *::before,.mk-delegates *::after{box-sizing:border-box}
.mk-delegates .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mk-delegates .mkf-bar .mono{font-size:11px}

/* group header */
.mk-delegates .gh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 2px 0}
.mk-delegates .gh-t{min-width:0;display:flex;flex-direction:column}
.mk-delegates .gh-t b{font-size:13.5px;font-weight:700;line-height:1.3}
.mk-delegates .gh-t span{font-size:11.5px;color:var(--muted)}
.mk-delegates .rep{flex:none;gap:6px;line-height:22px;padding:0 9px;font-size:11.5px;font-weight:600;transition:background .3s ease,border-color .3s ease,color .3s ease}
.mk-delegates .rep.code{color:var(--muted)}
.mk-delegates .rep .mono{font-weight:500;font-size:11px}

/* tray */
.mk-delegates .tray{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;transition:opacity .28s ease}
.mk-delegates.is-fading .tray{opacity:.12}
.mk-delegates.nt .tray *{transition:none!important}

.mk-delegates .dr{display:grid;grid-template-columns:10px minmax(0,1fr) auto;column-gap:9px;row-gap:6px;align-items:center;padding:9px 10px 9px 11px;border-top:1px solid var(--line)}
.mk-delegates .dr:first-child{border-top:0}
.mk-delegates .l1{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;min-width:0}
.mk-delegates .id{font-size:10.5px;color:var(--muted);flex:none}
.mk-delegates .ti{font-size:12.5px;font-weight:600;min-width:0;transition:color .3s ease}
.mk-delegates .dr[data-s="queued"] .ti{color:var(--muted);font-weight:500}
.mk-delegates .stc{justify-self:end;transition:background .3s ease,color .3s ease}

@container (max-width:430px){.mk-delegates .l1{flex-direction:column;align-items:flex-start;gap:0}}

/* state dot */
.mk-delegates .dt{width:8px;height:8px;border-radius:50%;background:var(--ok-ink);position:relative;transition:background .3s ease}
.mk-delegates .dr[data-s="queued"] .dt{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.mk-delegates .dr[data-s="running"] .dt::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--ok-ink);opacity:0}

/* second line */
.mk-delegates .l2{grid-column:2;display:grid;min-width:0;align-items:center}
.mk-delegates .l2>*{grid-area:1/1;min-width:0}
.mk-delegates .pg{display:flex;align-items:center;gap:7px;transition:opacity .3s ease}
.mk-delegates .pgb{flex:1 1 24px;max-width:96px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.mk-delegates .pgb i{display:block;height:100%;width:calc(var(--v,0)*100%);background:var(--ink);border-radius:inherit;transition:width .6s cubic-bezier(.2,.8,.2,1),background .3s ease}
.mk-delegates .dr[data-s="done"] .bar i,.mk-delegates .dr[data-s="inq"] .bar i,.mk-delegates .dr[data-s="landed"] .bar i{background:var(--ok-ink)}
.mk-delegates .ckl{font-size:10.5px;color:var(--muted)}
.mk-delegates .pips{display:inline-flex;gap:3px}
.mk-delegates .pips i{width:8px;height:8px;border-radius:2px;border:1px solid var(--line-strong);transition:background .3s ease,border-color .3s ease}
.mk-delegates .pips i.on{background:var(--ok-ink);border-color:var(--ok-ink)}
.mk-delegates .ct{font-size:11px;color:var(--ink)}
.mk-delegates .af{justify-self:start;gap:4px;transition:opacity .35s ease,transform .35s ease}
.mk-delegates .dr[data-s="queued"] .pg{opacity:0}
.mk-delegates .dr:not([data-blocked]) .af{opacity:0;transform:translateX(-6px);pointer-events:none}

/* budget */
.mk-delegates .bud{grid-column:3;display:flex;gap:8px;justify-self:end}
.mk-delegates .bm{display:grid;gap:3px;width:38px}
.mk-delegates .bm .t{display:block;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.mk-delegates .bm .t i{display:block;height:100%;width:calc(var(--v,0)*100%);background:var(--muted);border-radius:inherit;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.mk-delegates .bm b{font:500 10px/1 var(--f-mono);color:var(--muted);white-space:nowrap}

/* landing queue */
.mk-delegates .lq{border-top:1px solid var(--line);background:var(--recess);padding:8px 10px 9px;display:grid;gap:6px}
.mk-delegates .lq-h{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--muted)}
.mk-delegates .lq-h .mkchip{line-height:16px;font-size:10.5px;padding:0 6px}
.mk-delegates .qs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.mk-delegates .qs span{position:relative;text-align:center;font-size:10.5px;color:var(--muted);white-space:nowrap}
.mk-delegates .qs span:not(:last-child)::after{content:"\2192";position:absolute;right:-5px;top:0;color:var(--muted)}
.mk-delegates .qt{position:relative;height:24px}
.mk-delegates .qt::before{content:"";position:absolute;left:16%;right:16%;top:11px;border-top:1px dashed var(--line-strong)}
.mk-delegates .tk{position:absolute;left:0;top:1px;width:33.3333%;display:flex;justify-content:center;transform:translateX(calc(var(--i,0)*100%));transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .35s ease}
.mk-delegates .tk .mkchip{font-size:11px;background:var(--raised)}
.mk-delegates .tk[data-s="hid"]{display:none}
.mk-delegates .tk[data-s="pre"]{opacity:0;transform:translateX(calc(var(--i,0)*100%)) translateY(-14px)}
.mk-delegates .tk[data-s="gone"]{opacity:0}

/* motion: only while on screen */
@keyframes mk-dg-ring{0%{transform:scale(.7);opacity:.75}100%{transform:scale(1.7);opacity:0}}
@keyframes mk-dg-pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.mk-delegates.is-live .dr[data-s="running"] .dt::after{animation:mk-dg-ring 1.6s ease-out infinite}
.mk-delegates.is-live .rep.you{animation:mk-dg-pop .6s cubic-bezier(.2,.8,.2,1) 1}

@media (prefers-reduced-motion:reduce){
  .mk-delegates *,.mk-delegates *::before,.mk-delegates *::after{transition:none!important;animation:none!important}
}
</style>
<div class="mk mk-delegates" role="img" aria-label="A parent session delegates three tasks. Finished work enters a landing queue that rebases, re-runs checks and pushes; the blocked delegate starts when the one it waits for lands, and one combined report arrives when all three settle.">
  <div class="mkf">
    <div class="mkf-bar"><b>site</b><span class="mono">ws-0a1e</span><span class="sp"></span><span>obelisk</span></div>
    <div class="mkf-body">
      <div class="gh">
        <div class="gh-t"><b>auth-rework</b><span>3 delegates · one report when all settle</span></div>
        <span class="mkchip code rep" data-f="rep"><span>Report</span><span class="mono" data-f="repn">1/3</span></span>
      </div>

      <div class="tray">
        <div class="dr" data-r="a" data-s="running">
          <span class="dt"></span>
          <div class="l1"><span class="id mono">ws-4f2a</span><span class="ti">Add session table</span></div>
          <span class="mkchip model stc">running</span>
          <div class="l2">
            <div class="pg"><span class="pgb"><i data-f="pb" style="--v:.55"></i></span><span class="ckl">checks</span><span class="pips"><i class="on"></i><i></i><i></i></span><span class="ct mono" data-f="ct">1/3</span></div>
          </div>
          <div class="bud">
            <span class="bm"><span class="t"><i data-f="uv" style="--v:.28"></i></span><b data-f="ut">$0.42</b></span>
            <span class="bm"><span class="t"><i data-f="mv" style="--v:.3"></i></span><b data-f="mt">6 min</b></span>
          </div>
        </div>

        <div class="dr" data-r="b" data-s="queued" data-blocked="1">
          <span class="dt"></span>
          <div class="l1"><span class="id mono">ws-91c0</span><span class="ti">Board API</span></div>
          <span class="mkchip stc">queued</span>
          <div class="l2">
            <div class="pg"><span class="pgb"><i data-f="pb" style="--v:0"></i></span><span class="ckl">checks</span><span class="pips"><i></i><i></i><i></i></span><span class="ct mono" data-f="ct">0/3</span></div>
            <span class="mkchip code af">after <span class="mono">ws-4f2a</span></span>
          </div>
          <div class="bud">
            <span class="bm"><span class="t"><i data-f="uv" style="--v:0"></i></span><b data-f="ut">$0.00</b></span>
            <span class="bm"><span class="t"><i data-f="mv" style="--v:0"></i></span><b data-f="mt">0 min</b></span>
          </div>
        </div>

        <div class="dr" data-r="c" data-s="done">
          <span class="dt"></span>
          <div class="l1"><span class="id mono">ws-7d13</span><span class="ti">Login copy</span></div>
          <span class="mkchip ok stc">done</span>
          <div class="l2">
            <div class="pg"><span class="pgb"><i data-f="pb" style="--v:1"></i></span><span class="ckl">checks</span><span class="pips"><i class="on"></i><i class="on"></i><i class="on"></i></span><span class="ct mono" data-f="ct">3/3</span></div>
          </div>
          <div class="bud">
            <span class="bm"><span class="t"><i data-f="uv" style="--v:.4"></i></span><b data-f="ut">$0.61</b></span>
            <span class="bm"><span class="t"><i data-f="mv" style="--v:.45"></i></span><b data-f="mt">9 min</b></span>
          </div>
        </div>

        <div class="lq">
          <div class="lq-h"><span>Landing queue</span><span class="mkchip code mono" data-f="qn">1</span></div>
          <div class="qs"><span>rebase</span><span>re-run checks</span><span>push</span></div>
          <div class="qt">
            <span class="tk" data-t="c" data-s="in" style="--i:0"><span class="mkchip code mono">ws-7d13</span></span>
            <span class="tk" data-t="a" data-s="hid" style="--i:0"><span class="mkchip code mono">ws-4f2a</span></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var root=document.querySelector('.mk-delegates');
  if(!root)return;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timers=[];
  var q=function(s){return root.querySelector(s)};
  var rows={a:q('[data-r="a"]'),b:q('[data-r="b"]'),c:q('[data-r="c"]')};
  var tk={a:q('[data-t="a"]'),c:q('[data-t="c"]')};
  var rep=q('[data-f="rep"]'),repn=q('[data-f="repn"]'),qn=q('[data-f="qn"]');
  var CHIP={running:['model','running'],queued:['','queued'],done:['ok','done'],inq:['code','in queue'],landed:['ok','landed']};

  function setRow(k,o){
    var r=rows[k];
    if(o.s){
      r.setAttribute('data-s',o.s);
      var c=r.querySelector('.stc');
      c.className='mkchip stc'+(CHIP[o.s][0]?' '+CHIP[o.s][0]:'');
      c.textContent=CHIP[o.s][1];
    }
    if(o.p!=null)r.querySelector('[data-f="pb"]').style.setProperty('--v',o.p);
    if(o.ck!=null){
      var ps=r.querySelectorAll('.pips i');
      for(var i=0;i<ps.length;i++)ps[i].className=i<o.ck?'on':'';
      r.querySelector('[data-f="ct"]').textContent=o.ck+'/3';
    }
    if(o.u!=null){
      r.querySelector('[data-f="ut"]').textContent='$'+o.u.toFixed(2);
      r.querySelector('[data-f="uv"]').style.setProperty('--v',o.u/1.5);
    }
    if(o.m!=null){
      r.querySelector('[data-f="mt"]').textContent=o.m+' min';
      r.querySelector('[data-f="mv"]').style.setProperty('--v',o.m/20);
    }
  }
  function setRep(n){
    repn.textContent=n+'/3';
    var done=n===3;
    rep.classList.toggle('code',!done);
    rep.classList.toggle('you',done);
    if(done){rep.classList.remove('you');void rep.offsetWidth;rep.classList.add('you')}
  }
  function tok(k,i){tk[k].style.setProperty('--i',i)}
  function tokIn(k){
    var t=tk[k];
    t.style.setProperty('--i',0);
    t.setAttribute('data-s','pre');
    void t.offsetWidth;
    t.setAttribute('data-s','in');
  }
  function tokGone(k){tk[k].style.setProperty('--i',3);tk[k].setAttribute('data-s','gone')}
  function setN(n){qn.textContent=n}

  function reset(){
    setRow('a',{s:'running',p:.55,ck:1,u:.42,m:6});
    setRow('b',{s:'queued',p:0,ck:0,u:0,m:0});
    setRow('c',{s:'done',p:1,ck:3,u:.61,m:9});
    rows.b.setAttribute('data-blocked','1');
    tk.c.style.setProperty('--i',0);tk.c.setAttribute('data-s','in');
    tk.a.style.setProperty('--i',0);tk.a.setAttribute('data-s','hid');
    setRep(1);rep.classList.remove('you');rep.classList.add('code');
    setN(1);
  }
  function quietReset(){
    root.classList.add('nt');
    reset();
    root.classList.remove('is-fading');
    void root.offsetWidth;
    root.classList.remove('nt');
  }

  var steps=[
    [700,function(){setRow('a',{p:.78,ck:2,u:.58,m:9});tok('c',1)}],
    [1400,function(){setRow('a',{p:1,ck:3,u:.71,m:11});tok('c',2)}],
    [2100,function(){setRow('a',{s:'done'});setRow('c',{s:'landed'});tokGone('c');setN(0);setRep(2)}],
    [2800,function(){setRow('a',{s:'inq'});tokIn('a');setN(1)}],
    [3500,function(){tok('a',1)}],
    [4200,function(){tok('a',2)}],
    [4900,function(){
      setRow('a',{s:'landed'});tokGone('a');setN(0);
      rows.b.removeAttribute('data-blocked');
      setRow('b',{s:'running',p:.12,ck:0,u:.08,m:1});
    }],
    [5700,function(){setRow('b',{p:.55,ck:1,u:.31,m:5})}],
    [6500,function(){setRow('b',{s:'done',p:1,ck:3,u:.52,m:8});setRep(3)}],
    [8800,function(){root.classList.add('is-fading')}],
    [9100,function(){quietReset()}],
    [9900,function(){run()}]
  ];
  function run(){
    stop();
    for(var i=0;i<steps.length;i++)timers.push(setTimeout(steps[i][1],steps[i][0]));
  }
  function stop(){
    while(timers.length)clearTimeout(timers.pop());
  }
  function start(){if(reduce)return;run()}
  function halt(){stop();quietReset()}

  root.addEventListener('mk:live',start);
  root.addEventListener('mk:idle',halt);
  if(root.classList.contains('is-live'))start();
})();
</script>
