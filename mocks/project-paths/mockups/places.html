<style>
.mk-places{--pitch:40px;display:block;min-width:0;color:var(--ink);font-family:var(--f-body);font-size:12.5px;line-height:1.4;text-align:left}
.mk-places *,.mk-places *::before,.mk-places *::after{box-sizing:border-box}
.mk-places .mkp-card{background:var(--raised);border:1px solid var(--line-strong);border-radius:var(--r-tray);padding:12px 12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mk-places .mkp-head{display:flex;align-items:center;gap:8px;height:28px;min-width:0}
.mk-places .mkp-hue{position:relative;flex:none;width:9px;height:9px;border-radius:50%;background:var(--coral)}
.mk-places .mkp-hue::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--coral);opacity:0}
.mk-places .mkp-name{flex:none;font-size:16px;font-weight:700;letter-spacing:-.005em}
.mk-places .mkp-remote{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-ligatures:none}
.mk-places .mkp-head .mkchip{margin-left:auto;flex:none}

.mk-places .mkp-main{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.mk-places .mkp-list{position:relative;flex:1.5 1 250px;min-width:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.mk-places .mkp-spine{position:absolute;left:4px;top:-20px;width:1.5px;height:calc(37px + 3 * var(--pitch));background:var(--line-strong);border-radius:1px}
.mk-places .mkp-pk{position:absolute;left:0;top:-20px;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 4px var(--coral-wash);opacity:0;pointer-events:none;z-index:2;--d:calc(37px + var(--i) * var(--pitch))}

.mk-places .mkp-place{position:relative;height:34px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:7px;padding:0 7px 0 9px;background:var(--bg);border:1px solid var(--line-strong);border-radius:10px}
.mk-places .mkp-place::before{content:"";position:absolute;left:-18px;top:50%;width:18px;height:1.5px;margin-top:-.75px;background:var(--line-strong)}
.mk-places .mkp-place.hub{border-top:3px double var(--line-strong)}
.mk-places .mkp-t{display:flex;align-items:baseline;gap:6px;min-width:0}
.mk-places .mkp-t b{flex:none;font-size:13px;font-weight:700;white-space:nowrap}
.mk-places .mkp-t code{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-variant-ligatures:none}
.mk-places .mkp-place .mkchip{flex:none}
.mk-places .mkp-ic{flex:none;display:block;width:12px;height:9px;border:1.5px solid var(--muted);border-radius:2px}
.mk-places .mkp-ic.ws{border-style:dashed}
.mk-places .mkp-ic.hub{height:11px;border-top:3px double var(--muted)}

.mk-places .mkp-tree{flex:1 1 150px;min-width:0;background:var(--bg);border:1px solid var(--line-strong);border-top:3px double var(--line-strong);border-radius:10px;padding:7px 8px 8px}
.mk-places .mkp-th{display:flex;align-items:baseline;gap:6px;height:22px;padding:0 4px}
.mk-places .mkp-th b{font-family:var(--f-mono);font-size:12px;font-weight:600;font-variant-ligatures:none}
.mk-places .mkp-th span{font-size:11px;color:var(--muted)}
.mk-places .mkp-tree ul{list-style:none;margin:2px 0 0;padding:0 0 0 10px;position:relative}
.mk-places .mkp-tree ul::before{content:"";position:absolute;left:4px;top:0;bottom:10px;border-left:1px solid var(--line-strong)}
.mk-places .mkp-tree li{position:relative;display:flex;align-items:center;gap:7px;height:20px;padding:0 6px 0 8px;border-radius:5px;font-family:var(--f-mono);font-size:11.5px;font-variant-ligatures:none;white-space:nowrap}
.mk-places .mkp-tree li::before{content:"";position:absolute;left:-6px;top:50%;width:8px;border-top:1px solid var(--line-strong)}
.mk-places .mkp-f{flex:none;display:block;width:8px;height:10px;border:1.5px solid var(--muted);border-radius:1.5px}
.mk-places .mkp-d{flex:none;position:relative;display:block;width:11px;height:8px;margin-top:2px;border:1.5px solid var(--muted);border-radius:1.5px 2px 2px 2px}
.mk-places .mkp-d::before{content:"";position:absolute;left:-1.5px;top:-5px;width:5px;height:3px;border:1.5px solid var(--muted);border-bottom:0;border-radius:2px 2px 0 0}

@keyframes mkp-go{
  0%{opacity:0;transform:translate(0,0) scale(.5)}
  2%{opacity:1;transform:translate(0,0) scale(1)}
  9%{opacity:1;transform:translate(0,var(--d)) scale(1)}
  12%{opacity:1;transform:translate(17px,var(--d)) scale(1)}
  15%,100%{opacity:0;transform:translate(17px,var(--d)) scale(.6)}
}
@keyframes mkp-hit{
  0%{background-color:var(--bg);border-color:var(--line-strong)}
  2.5%,14%{background-color:var(--coral-wash);border-color:var(--coral)}
  24%,100%{background-color:var(--bg);border-color:var(--line-strong)}
}
@keyframes mkp-row{
  0%{background-color:transparent;color:var(--ink)}
  2%,7%{background-color:var(--coral-wash);color:var(--coral-ink)}
  12%,100%{background-color:transparent;color:var(--ink)}
}
@keyframes mkp-ring{
  0%,14%,28%,42%{opacity:0;transform:scale(.7)}
  1%,15%,29%,43%{opacity:.9;transform:scale(.9)}
  4.5%,18.5%,32.5%,46.5%{opacity:0;transform:scale(2.1)}
  50%,100%{opacity:0;transform:scale(.7)}
}
.mk-places.is-live .mkp-pk{animation:mkp-go 10s cubic-bezier(.2,.8,.2,1) infinite;animation-delay:calc(var(--i) * 1.4s)}
.mk-places.is-live .mkp-place{animation:mkp-hit 10s ease-in-out infinite;animation-delay:calc(var(--i) * 1.4s + .9s)}
.mk-places.is-live .mkp-tree{animation:mkp-hit 10s ease-in-out infinite;animation-delay:5.1s}
.mk-places.is-live .mkp-tree li{animation:mkp-row 10s ease-in-out infinite;animation-delay:calc(5.4s + var(--j) * .5s)}
.mk-places.is-live .mkp-hue::after{animation:mkp-ring 10s ease-out infinite}

@media (prefers-reduced-motion:reduce){
  .mk-places *,.mk-places *::before,.mk-places *::after{animation:none !important;transition:none !important}
  .mk-places .mkp-pk{display:none}
}
</style>
<div class="mk mk-places" role="img" aria-label="One project, many places: the project site lives in two checkouts, a delegate workspace and a hub folder, and the hub folder holds its shared files.">
  <div class="mkp-card">
    <div class="mkp-head">
      <span class="mkp-hue"></span>
      <span class="mkp-name">site</span>
      <span class="mkp-remote">github.com/you/site</span>
      <span class="mkchip">4 places</span>
    </div>
    <div class="mkp-main">
      <div class="mkp-list">
        <span class="mkp-spine"></span>
        <span class="mkp-pk" style="--i:0"></span>
        <span class="mkp-pk" style="--i:1"></span>
        <span class="mkp-pk" style="--i:2"></span>
        <span class="mkp-pk" style="--i:3"></span>
        <div class="mkp-place" style="--i:0"><i class="mkp-ic"></i><span class="mkp-t"><b>obelisk</b><code>~/code/site</code></span><span class="mkchip">checkout</span></div>
        <div class="mkp-place" style="--i:1"><i class="mkp-ic"></i><span class="mkp-t"><b>macbook</b><code>~/src/site</code></span><span class="mkchip">checkout</span></div>
        <div class="mkp-place" style="--i:2"><i class="mkp-ic ws"></i><span class="mkp-t"><b>ws-4f2a</b><code>delegate clone</code></span><span class="mkchip code">on obelisk</span></div>
        <div class="mkp-place hub" style="--i:3"><i class="mkp-ic hub"></i><span class="mkp-t"><b>hub folder</b></span><span class="mkchip">stored</span></div>
      </div>
      <div class="mkp-tree">
        <div class="mkp-th"><b>site/</b><span>hub folder</span></div>
        <ul>
          <li style="--j:0"><i class="mkp-f"></i>AGENTS.md</li>
          <li style="--j:1"><i class="mkp-d"></i>knowledge/</li>
          <li style="--j:2"><i class="mkp-d"></i>assets/</li>
          <li style="--j:3"><i class="mkp-d"></i>memory/</li>
          <li style="--j:4"><i class="mkp-d"></i>routines/</li>
          <li style="--j:5"><i class="mkp-d"></i>skills/</li>
        </ul>
      </div>
    </div>
  </div>
</div>
